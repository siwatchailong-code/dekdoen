/* ---------- Platform v2: ผลงานของไรเดอร์ — เก็บไฟล์จริงใน Supabase Storage (บักเก็ต rider-portfolio) ไม่ใช่
   base64-in-Postgres เหมือนระบบแชท (ตามที่ระบุห้ามใช้ base64 สำหรับฟีเจอร์นี้โดยเฉพาะ) แถวในตาราง rider_portfolio
   เก็บแค่ image_url (public URL จริงจาก Storage) + caption + sort_order ---------- */
let RIDER_PORTFOLIO_CACHE={};
async function fetchRiderPortfolio(riderId,client){
 client=client||sbCustomer;
 const {data,error}=await client.from('rider_portfolio').select('*').eq('rider_id',riderId).order('sort_order',{ascending:true}).order('created_at',{ascending:true});
 if(error){ console.error('load rider_portfolio failed',error); return RIDER_PORTFOLIO_CACHE[riderId]||[]; }
 RIDER_PORTFOLIO_CACHE[riderId]=data||[];
 return RIDER_PORTFOLIO_CACHE[riderId];
}
const PORTFOLIO_IMAGE_MAX_DIM=1600;
// บีบอัดรูปเป็น Blob จริง (ไม่ใช่ data URL) สำหรับอัปโหลดขึ้น Storage โดยตรง — ใช้ pipeline เดียวกับ compressChatImage
// (resize ด้าน ยาวสุด + ลดคุณภาพลงเรื่อย ๆ จนกว่าจะได้ไฟล์เล็กพอ) ต่างกันแค่ผลลัพธ์เป็น Blob ไม่ใช่ string
async function compressImageToBlob(file){
 const rawDataUrl=await fileToDataURL(file);
 const img=await loadImageEl(rawDataUrl);
 let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
 if(w>PORTFOLIO_IMAGE_MAX_DIM||h>PORTFOLIO_IMAGE_MAX_DIM){
  if(w>=h){h=Math.round(h*PORTFOLIO_IMAGE_MAX_DIM/w);w=PORTFOLIO_IMAGE_MAX_DIM;}
  else{w=Math.round(w*PORTFOLIO_IMAGE_MAX_DIM/h);h=PORTFOLIO_IMAGE_MAX_DIM;}
 }
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
 for(const q of [0.85,0.72,0.6]){
  const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',q));
  if(blob&&(blob.size<1200000||q===0.6)) return blob;
 }
 return null;
}
let riderPortfolioUploadBusy=false;
async function riderAddPortfolioPhoto(file,caption){
 const rider=currentRider(); if(!rider){ toast('กรุณาเข้าสู่ระบบก่อน'); return false; }
 if(!CHAT_IMAGE_ACCEPTED.includes(file.type)){ toast('รองรับเฉพาะไฟล์รูปภาพ JPG, PNG หรือ WebP เท่านั้น'); return false; }
 if(file.size>CHAT_IMAGE_MAX_BYTES){ toast('รูปภาพต้องมีขนาดไม่เกิน 10 MB'); return false; }
 if(riderPortfolioUploadBusy) return false;
 riderPortfolioUploadBusy=true;
 try{
  const blob=await compressImageToBlob(file);
  if(!blob){ toast('ไม่สามารถประมวลผลรูปนี้ได้ ลองรูปอื่น'); return false; }
  const path=rider.id+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.jpg';
  const {error:upErr}=await sbRider.storage.from('rider-portfolio').upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(upErr){ toast('อัปโหลดรูปไม่สำเร็จ: '+upErr.message); return false; }
  const {data:pub}=sbRider.storage.from('rider-portfolio').getPublicUrl(path);
  const existing=RIDER_PORTFOLIO_CACHE[rider.id]||[];
  const nextSort=existing.length?Math.max(...existing.map(x=>x.sort_order||0))+1:0;
  const {data,error}=await sbRider.from('rider_portfolio').insert({rider_id:rider.id,image_url:pub.publicUrl,caption:(caption||'').trim(),sort_order:nextSort}).select().single();
  if(error){ toast('บันทึกผลงานไม่สำเร็จ: '+error.message); return false; }
  RIDER_PORTFOLIO_CACHE[rider.id]=[...existing,data];
  return true;
 } finally { riderPortfolioUploadBusy=false; }
}
async function riderDeletePortfolioItem(item){
 const rider=currentRider(); if(!rider) return false;
 const {error}=await sbRider.from('rider_portfolio').delete().eq('id',item.id).eq('rider_id',rider.id);
 if(error){ toast('ลบผลงานไม่สำเร็จ: '+error.message); return false; }
 // ลบไฟล์จริงใน Storage ด้วย (ไม่บังคับต้องสำเร็จ — ถ้าลบไฟล์ไม่ได้ แถวข้อมูลก็ถูกลบไปแล้ว ไม่กระทบผู้ใช้)
 try{
  const marker='/rider-portfolio/';
  const idx=(item.image_url||'').indexOf(marker);
  if(idx!==-1){ const path=item.image_url.slice(idx+marker.length); await sbRider.storage.from('rider-portfolio').remove([path]); }
 }catch(e){}
 RIDER_PORTFOLIO_CACHE[rider.id]=(RIDER_PORTFOLIO_CACHE[rider.id]||[]).filter(x=>x.id!==item.id);
 return true;
}
async function riderMovePortfolioItem(itemId,dir){
 const rider=currentRider(); if(!rider) return false;
 const arr=RIDER_PORTFOLIO_CACHE[rider.id]||[];
 const i=arr.findIndex(x=>x.id===itemId); if(i===-1) return false;
 const ni=i+dir; if(ni<0||ni>=arr.length) return false;
 const a=arr[i], b=arr[ni];
 const {error}=await sbRider.from('rider_portfolio').update({sort_order:b.sort_order}).eq('id',a.id);
 if(error){ toast('จัดลำดับไม่สำเร็จ: '+error.message); return false; }
 const {error:err2}=await sbRider.from('rider_portfolio').update({sort_order:a.sort_order}).eq('id',b.id);
 if(err2){ toast('จัดลำดับไม่สำเร็จ: '+err2.message); return false; }
 const tmp=a.sort_order; a.sort_order=b.sort_order; b.sort_order=tmp;
 arr[i]=b; arr[ni]=a;
 return true;
}
function setRiderSession(riderId){ try{ sessionStorage.setItem(RIDER_SESSION_KEY,riderId); }catch(e){} }
function clearRiderSession(){ try{ sessionStorage.removeItem(RIDER_SESSION_KEY); }catch(e){} }
function currentRiderId(){ try{ return sessionStorage.getItem(RIDER_SESSION_KEY); }catch(e){ return null; } }
function currentRider(){
 const id=currentRiderId(); if(!id) return null;
 // เฟส 3 (fix): เช่นเดียวกับฝั่งลูกค้า — id เก่าก่อนเชื่อม Supabase (เช่น "rdr_...") ต้องไม่ถูกใช้งานอีกต่อไป
 if(!isUuid(id)){ clearRiderSession(); riderAuthMode='login'; return null; }
 const r=findRiderById(id); if(!r){ clearRiderSession(); return null; }
 if(r.banned){ clearRiderSession(); riderAuthMode='login'; toast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return null; } // ถูกแบนระหว่างที่ session ยังอยู่ -> บังคับออกจากระบบทันที และกลับไปหน้า login (ไม่ใช่ signup ที่อาจค้างจากก่อนสมัคร)
 return r;
}
// คืนชื่อ/รูป/เบอร์ ไรเดอร์ "ล่าสุดจริง" ของออเดอร์นี้ — ใช้บัญชีปัจจุบันแทนชื่อที่ snapshot ไว้ตอนรับงาน
// (รองรับย้อนหลังออเดอร์เก่าก่อนมีระบบบัญชี ที่ไม่มี riderId เก็บไว้ ด้วยการ fallback ไปใช้ชื่อเดิมที่บันทึกไว้)
function resolveRiderDisplay(o){
 if(!o||!o.rider) return null;
 const acc=o.rider.riderId?findRiderById(o.rider.riderId):null;
 return { name:acc?acc.name:o.rider.name, phone:acc?acc.phone:null, photo:acc?acc.photo:null, riderId:o.rider.riderId||null };
}
// เช่นเดียวกับ resolveRiderDisplay แต่ฝั่งลูกค้า — ใช้รูป/ชื่อบัญชีปัจจุบันถ้ายังมีบัญชีอยู่ (ผูกด้วย customerId)
// ออเดอร์เก่าก่อนมีระบบบัญชี หรือออเดอร์ที่แอดมินสร้างให้ทางแชท/โทรศัพท์ (customerId เป็น null) จะ fallback ไปใช้ชื่อที่ snapshot ไว้ในตัวออเดอร์เอง
function resolveCustomerDisplay(o){
 if(!o) return null;
 const acc=o.customerId?findCustomerById(o.customerId):null;
 return { name:acc?acc.name:(o.customer?o.customer.name:''), photo:acc?acc.photo:null };
}
const AVATAR_MAX_DIM=480;
async function compressAvatarImage(file){
 const rawDataUrl=await fileToDataURL(file);
 const img=await loadImageEl(rawDataUrl);
 let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
 if(w>AVATAR_MAX_DIM||h>AVATAR_MAX_DIM){
  if(w>=h){h=Math.round(h*AVATAR_MAX_DIM/w);w=AVATAR_MAX_DIM;}
  else{w=Math.round(w*AVATAR_MAX_DIM/h);h=AVATAR_MAX_DIM;}
 }
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
 let out=null;
 for(const q of [0.85,0.7,0.55]){
  let candidate=canvas.toDataURL('image/webp',q);
  if(!candidate||candidate.indexOf('data:image/webp')!==0) candidate=canvas.toDataURL('image/jpeg',q);
  out=candidate;
  if(candidate.length<220000) break;
 }
 return out;
}

/* ======================= บัญชีลูกค้า (สมัคร/ล็อกอิน + เซสชันค้างข้ามการปิดเบราว์เซอร์) ======================= */
/* ต่างจากไรเดอร์ตรงที่เก็บเซสชันเป็น localStorage (ไม่ใช่ sessionStorage) โดยตั้งใจ
   เพราะโจทย์ต้องการให้ลูกค้าเปิดลิงก์เดิม/ปิดเบราว์เซอร์แล้วกลับมาเปิดใหม่ ไม่ต้อง login ซ้ำ
   (คนละความต้องการกับไรเดอร์ที่อยากให้ทดสอบ/ใช้งานคนละคนคนละแท็บของเบราว์เซอร์เดียวกันได้) */
const CUSTOMERS_KEY='dekdoen_customers_v1';
const CUSTOMER_SESSION_KEY='dekdoen_customer_session';
function defaultCustomersStore(){ return { customers:[] }; }
function loadCustomers(){
 try{
  const raw=localStorage.getItem(CUSTOMERS_KEY);
  if(!raw) return defaultCustomersStore();
  const d=JSON.parse(raw);
  return Object.assign(defaultCustomersStore(),d,{customers:d.customers||[]});
 }catch(e){ return defaultCustomersStore(); }
}
let CUSTOMERS=loadCustomers();
let customerStoreListeners=[];
function saveCustomers(){
 try{ localStorage.setItem(CUSTOMERS_KEY,JSON.stringify(CUSTOMERS)); }
 catch(e){ toast('พื้นที่จัดเก็บเต็ม ไม่สามารถบันทึกบัญชีนี้ได้'); CUSTOMERS=loadCustomers(); customerStoreListeners.forEach(fn=>{try{fn(false)}catch(e){}}); return; }
 customerStoreListeners.forEach(fn=>{try{fn(false)}catch(e){}});
}
window.addEventListener('storage',e=>{ if(e.key===CUSTOMERS_KEY){ CUSTOMERS=loadCustomers(); customerStoreListeners.forEach(fn=>{try{fn(true)}catch(e){}}); } });
function findCustomerById(id){ return id? CUSTOMERS.customers.find(c=>c.id===id) : null; }
function findCustomerByPhone(phone){ return CUSTOMERS.customers.find(c=>c.phone===phone); }
const PHONE_PATTERN=/^0\d{8,9}$/; // เบอร์โทรไทย 9-10 หลัก ขึ้นต้นด้วย 0
/* เชื่อม Supabase Auth จริงแล้ว (เฟส 2) — รูปแบบเดียวกับฝั่งไรเดอร์ทุกประการ (ดูคอมเมนต์ที่ riderSignup) */
async function customerSignup({name,phone,password,photo}){
 name=(name||'').trim(); phone=(phone||'').trim();
 if(!name) return {ok:false,reason:'กรุณากรอกชื่อจริง'};
 if(!phone) return {ok:false,reason:'กรุณากรอกเบอร์โทรศัพท์'};
 if(!PHONE_PATTERN.test(phone)) return {ok:false,reason:'กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (ตัวเลข 9-10 หลัก ขึ้นต้นด้วย 0)'};
 if(!password||password.length<4) return {ok:false,reason:'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'};
 const email=phoneToInternalEmail(phone,'customer');
 let data,error;
 try{ ({data,error}=await sbCustomer.auth.signUp({email,password,options:{data:{role:'customer',name,phone}}})); }
 catch(e){ return {ok:false,reason:'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 if(isDuplicateSignup(error,data)) return {ok:false,reason:'เบอร์นี้ถูกใช้สมัครแล้ว กรุณาเข้าสู่ระบบแทน'};
 if(error) return {ok:false,reason:'สมัครสมาชิกไม่สำเร็จ: '+error.message};
 const uid=data.user.id;
 if(photo){ try{ await sbCustomer.from('profiles').update({photo}).eq('id',uid); }catch(e){} }
 const c={id:uid,name,phone,photo:photo||null,banned:false,createdAt:nowISO()};
 CUSTOMERS=loadCustomers();
 const idx=CUSTOMERS.customers.findIndex(x=>x.id===uid);
 if(idx>=0) CUSTOMERS.customers[idx]=c; else CUSTOMERS.customers.push(c);
 saveCustomers();
 return {ok:true,customer:c};
}
async function customerLogin(phone,password){
 phone=(phone||'').trim();
 const email=phoneToInternalEmail(phone,'customer');
 let data,error;
 try{ ({data,error}=await sbCustomer.auth.signInWithPassword({email,password})); }
 catch(e){ return {ok:false,reason:'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 if(error) return {ok:false,reason:'เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง'};
 const {data:prof,error:profErr}=await sbCustomer.from('profiles').select('id,name,phone,photo,banned,created_at').eq('id',data.user.id).single();
 if(profErr||!prof){ await sbCustomer.auth.signOut(); return {ok:false,reason:'ไม่พบข้อมูลบัญชีนี้ กรุณาลองใหม่'}; }
 if(prof.banned){ await sbCustomer.auth.signOut(); return {ok:false,reason:'บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'}; }
 const c={id:prof.id,name:prof.name,phone:prof.phone,photo:prof.photo||null,banned:prof.banned,createdAt:prof.created_at};
 CUSTOMERS=loadCustomers();
 const idx=CUSTOMERS.customers.findIndex(x=>x.id===c.id);
 if(idx>=0) CUSTOMERS.customers[idx]=c; else CUSTOMERS.customers.push(c);
 saveCustomers();
 return {ok:true,customer:c};
}
async function updateCustomerProfile(id,{name,phone,password,photo}){
 CUSTOMERS=loadCustomers();
 const c=findCustomerById(id); if(!c) return {ok:false,reason:'ไม่พบบัญชีนี้'};
 const newPhone=phone!=null?phone.trim():c.phone;
 if(newPhone!==c.phone) return {ok:false,reason:'ยังไม่รองรับการเปลี่ยนเบอร์โทรในเฟสนี้ กรุณาติดต่อผู้ดูแลระบบ (ชื่อ/รหัสผ่าน/รูปโปรไฟล์แก้ไขได้ตามปกติ)'};
 const patch={};
 if(name!=null&&name.trim()) patch.name=name.trim();
 if(photo!==undefined) patch.photo=photo;
 if(Object.keys(patch).length){
  const {error}=await sbCustomer.from('profiles').update(patch).eq('id',id);
  if(error) return {ok:false,reason:'บันทึกโปรไฟล์ไม่สำเร็จ: '+error.message};
 }
 if(password){
  const {error:pwErr}=await sbCustomer.auth.updateUser({password});
  if(pwErr) return {ok:false,reason:'เปลี่ยนรหัสผ่านไม่สำเร็จ: '+pwErr.message};
 }
 if(name!=null&&name.trim()) c.name=name.trim();
 if(photo!==undefined) c.photo=photo;
 saveCustomers();
 return {ok:true,customer:c};
}
function setCustomerSession(id){ try{ localStorage.setItem(CUSTOMER_SESSION_KEY,id); }catch(e){} }
function clearCustomerSession(){ try{ localStorage.removeItem(CUSTOMER_SESSION_KEY); }catch(e){} }
function currentCustomerId(){ try{ return localStorage.getItem(CUSTOMER_SESSION_KEY); }catch(e){ return null; } }
function currentCustomer(){
 const id=currentCustomerId(); if(!id) return null;
 // เฟส 3 (fix): id เก่าจากยุคก่อนเชื่อม Supabase (เช่น "cus_...") อาจยังค้างอยู่ใน localStorage ของเบราว์เซอร์
 // ผู้ใช้จากตอนทดสอบ MVP ก่อนหน้านี้ — ถ้าไม่ใช่ UUID จริงจาก Supabase Auth ถือว่า session ใช้ไม่ได้ทันที
 // บังคับออกจากระบบ กลับไปหน้า login เพื่อ login ใหม่ผ่าน Supabase Auth จริง (ไม่มีทาง fallback ไปใช้ id ปลอมได้อีก)
 if(!isUuid(id)){ clearCustomerSession(); customerAuthMode='login'; return null; }
 const c=findCustomerById(id); if(!c){ clearCustomerSession(); return null; }
 if(c.banned){ clearCustomerSession(); customerAuthMode='login'; toast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return null; } // ถูกแบนระหว่างที่ session ยังอยู่ -> บังคับออกจากระบบทันที และกลับไปหน้า login (ไม่ใช่ signup ที่อาจค้างจากก่อนสมัคร)
 return c;
}

/* ======================= บัญชีแอดมิน (สิทธิ์แยกจากลูกค้า/ไรเดอร์อย่างชัดเจน) ======================= */
/* กันไม่ให้ลูกค้า/ไรเดอร์เข้าถึงหน้าและฟังก์ชันแอดมินได้ — ต้อง login ด้วยบัญชีแอดมินก่อนถึงจะเห็นเนื้อหาแอดมิน
   เก็บ session แบบ sessionStorage (เหมือนไรเดอร์) เพราะเป็นบัญชีที่มีสิทธิ์สูง ไม่ควรค้าง login ข้ามการปิดเบราว์เซอร์นานเกินไป
   สร้างบัญชีแอดมินเริ่มต้นให้อัตโนมัติครั้งแรกที่ไม่มีบัญชีแอดมินเลยในระบบ (ค่าเริ่มต้นสำหรับ MVP เท่านั้น — ควรเปลี่ยนรหัสผ่านทันทีเมื่อใช้งานจริง) */
const ADMINS_KEY='dekdoen_admins_v1';
const ADMIN_SESSION_KEY='dekdoen_admin_session';
function defaultAdminsStore(){ return { admins:[] }; }
function loadAdmins(){
 try{
  const raw=localStorage.getItem(ADMINS_KEY);
  if(!raw) return defaultAdminsStore();
  const d=JSON.parse(raw);
  return Object.assign(defaultAdminsStore(),d,{admins:d.admins||[]});
 }catch(e){ return defaultAdminsStore(); }
}
let ADMINS=loadAdmins();
let adminStoreListeners=[];
function saveAdmins(){
 try{ localStorage.setItem(ADMINS_KEY,JSON.stringify(ADMINS)); }
 catch(e){ toast('พื้นที่จัดเก็บเต็ม ไม่สามารถบันทึกข้อมูลนี้ได้'); ADMINS=loadAdmins(); adminStoreListeners.forEach(fn=>{try{fn(false)}catch(e){}}); return; }
 adminStoreListeners.forEach(fn=>{try{fn(false)}catch(e){}});
}
window.addEventListener('storage',e=>{ if(e.key===ADMINS_KEY){ ADMINS=loadAdmins(); adminStoreListeners.forEach(fn=>{try{fn(true)}catch(e){}}); } });
function findAdminById(id){ return id? ADMINS.admins.find(a=>a.id===id) : null; }
function findAdminByPhone(phone){ return ADMINS.admins.find(a=>a.phone===phone); }
// หมายเหตุ (เฟส 2): เดิมฟังก์ชันนี้สร้างบัญชีแอดมินเริ่มต้น admin/admin1234 ให้อัตโนมัติในเครื่อง localStorage
// (เก็บรหัสผ่านเป็น plaintext ในเครื่อง) ตอนนี้ login ผ่าน Supabase Auth จริงแล้ว บัญชีแอดมินต้องถูกสร้างไว้ในฝั่ง

// ถูกเรียกจาก boot() ก็ตาม — ตรวจสอบทั้งไฟล์แล้วไม่มี password ถูกเก็บ/ส่งไปที่ใดนอกจาก supabase.auth
// signUp/signInWithPassword/updateUser โดยตรงเท่านั้น (Supabase Auth เก็บ hash เอง ไม่มีทางอ่าน/กู้รหัสผ่านเดิมได้)
/* เชื่อม Supabase Auth จริงแล้ว (เฟส 2) — ไม่มีหน้าสมัครแอดมิน (ตั้งใจ เหมือนเดิม) บัญชีแอดมินถูกสร้างไว้แล้วในฝั่ง
   Supabase ล่วงหน้า (admin/admin1234 ตามค่าเริ่มต้นเดิม) รูปแบบ email ภายในเดียวกับ customer/rider */
async function adminLogin(phone,password){
 phone=(phone||'').trim();
 const email=phoneToInternalEmail(phone,'admin');
 let data,error;
 try{ ({data,error}=await sbAdmin.auth.signInWithPassword({email,password})); }
 catch(e){ return {ok:false,reason:'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 if(error) return {ok:false,reason:'เบอร์โทร/ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'};
 const {data:prof,error:profErr}=await sbAdmin.from('profiles').select('id,name,phone,photo,banned,created_at,role').eq('id',data.user.id).single();
 if(profErr||!prof||prof.role!=='admin'){ await sbAdmin.auth.signOut(); return {ok:false,reason:'บัญชีนี้ไม่มีสิทธิ์แอดมิน'}; }
 // เฟส 3 (แก้ระบบ Admin): เดิมจุดนี้ไม่เคยเช็ค banned เลย (เช็คแค่ role==='admin') ต่างจาก customer/rider login
 // ที่เช็คอยู่แล้ว — แก้ให้เช็คเหมือนกันทุก role เพื่อให้ "ผู้ใช้ถูกแบน login ไม่ได้" เป็นจริงกับทุกบทบาทไม่มีข้อยกเว้น
 if(prof.banned){ await sbAdmin.auth.signOut(); return {ok:false,reason:'บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'}; }
 const a={id:prof.id,name:prof.name,phone:prof.phone,photo:prof.photo||null,createdAt:prof.created_at};
 ADMINS=loadAdmins();
 const idx=ADMINS.admins.findIndex(x=>x.id===a.id);
 if(idx>=0) ADMINS.admins[idx]=a; else ADMINS.admins.push(a);
 saveAdmins();
 return {ok:true,admin:a};
}

function currentAdmin(){

/* ======================= เครดิต/คอมมิชชั่นไรเดอร์ (เฟส 3: เชื่อม Supabase จริงแล้ว — เดิมคำนวณเองในเครื่อง) =======================
   ตาราง rider_credit_entries สร้างแถวให้อัตโนมัติฝั่ง server ทันทีที่ออเดอร์ถึงสถานะ DONE จริง (trigger
   create_credit_entry_on_done ใน 0001_init.sql) และ record_rider_payment() RPC จัดการตัดยอดจ่ายแบบ FIFO ให้
   ฝั่งนี้จึงเหลือแค่ "cache" ผลลัพธ์จริงมาแสดง ไม่ต้องคำนวณเองในเครื่องอีกต่อไป (กันเลขไม่ตรงกับของจริงฝั่ง server)
   หมายเหตุ: โหมด "อัตราคงที่ต่องาน (flat)" ที่เคยเลือกได้ในเครื่อง ตาราง/สูตรจริงฝั่ง server รองรับเฉพาะคำนวณ
   จาก commission_percent ของ rates_config เท่านั้น (ดู create_credit_entry_on_done) ตัวเลือกนี้จึงเป็นค่า preference
   ที่ยังเลือกได้ในหน้าจอเหมือนเดิม (ไม่ลบ UI) แต่ไม่มีผลต่อยอดคอมมิชชั่นจริงที่แสดงอีกต่อไป */
let CREDIT={mode:'percent',flatPerJob:5};
let CREDIT_ENTRIES=[]; // cache จากตาราง rider_credit_entries จริง
let CREDIT_PAYMENTS=[]; // cache จากตาราง rider_credit_payments จริง
function upsertCreditEntry(row){
 const mapped={id:row.id, riderId:row.rider_id, riderName:row.rider_name, orderId:row.order_id, jobCount:row.job_count, fee:Number(row.fee), commissionAmount:Number(row.commission_amount), mode:row.mode, paidAmount:Number(row.paid_amount), status:row.status, createdAt:row.created_at};
 const idx=CREDIT_ENTRIES.findIndex(e=>e.id===row.id);
 if(idx>=0) CREDIT_ENTRIES[idx]=mapped; else CREDIT_ENTRIES.unshift(mapped);
}
function upsertCreditPayment(row){
 if(CREDIT_PAYMENTS.some(p=>p.id===row.id)) return;
 CREDIT_PAYMENTS.unshift({id:row.id, riderId:row.rider_id, riderName:row.rider_name, amount:Number(row.amount), note:row.note||'', at:row.created_at});
}
async function syncCreditForClient(client){
 const [{data:entries,error:e1},{data:payments,error:e2}]=await Promise.all([
  client.from('rider_credit_entries').select('*'),
  client.from('rider_credit_payments').select('*')
 ]);
 if(!e1) (entries||[]).forEach(upsertCreditEntry);
 if(!e2) (payments||[]).forEach(upsertCreditPayment);
}
function riderCreditSummary(riderId){
 const entries=CREDIT_ENTRIES.filter(e=>e.riderId===riderId);
 const totalCommission=entries.reduce((s,e)=>s+e.commissionAmount,0);
 const totalPaid=entries.reduce((s,e)=>s+e.paidAmount,0);
 return {completedCount:entries.length,totalCommission,totalPaid,outstanding:totalCommission-totalPaid,entries};
}
function allRidersCreditSummary(){
 const byKey={};
 CREDIT_ENTRIES.forEach(e=>{
  const key=e.riderId||('~'+e.riderName);
  if(!byKey[key]) byKey[key]={riderId:e.riderId,riderName:e.riderName,completedCount:0,totalCommission:0,totalPaid:0};
  byKey[key].completedCount++; byKey[key].totalCommission+=e.commissionAmount; byKey[key].totalPaid+=e.paidAmount;
 });
 return Object.values(byKey).map(r=>Object.assign(r,{outstanding:r.totalCommission-r.totalPaid}));
}
// จ่ายเงินแบบ FIFO จริงฝั่ง server ผ่าน RPC record_rider_payment (แทนที่การคำนวณเองในเครื่องเดิม)
let adminRecordPaymentBusy=false;
async function adminRecordPayment(riderKey,riderName,riderIdRaw){
 if(adminRecordPaymentBusy) return;
 const amtInput=$('payAmt_'+riderKey), noteInput=$('payNote_'+riderKey);
 const amount=Number(amtInput?amtInput.value:0);
 if(!amount||amount<=0){ toast('กรุณากรอกจำนวนเงินที่ชำระให้ถูกต้อง'); return; }
 const note=noteInput?noteInput.value.trim():'';
 if(!riderIdRaw){ toast('ไม่พบรหัสไรเดอร์ ไม่สามารถบันทึกการชำระเงินได้'); return; }
 adminRecordPaymentBusy=true;
 try{
  const {error}=await sbAdmin.rpc('record_rider_payment',{p_rider_id:riderIdRaw,p_rider_name:riderName,p_amount:amount,p_note:note});
  if(error){ toast('บันทึกการชำระเงินไม่สำเร็จ: '+error.message); return; }
  await syncCreditForClient(sbAdmin);
  toast('บันทึกการชำระเงิน '+baht(amount)+' แล้ว');
  renderAdminCreditList();
 } finally { adminRecordPaymentBusy=false; }
}

/* ---------- เพิ่ม/ลบ/ย้ายงาน — ทุกฟังก์ชันแก้ array จริงก่อนเสมอ แล้วค่อย re-render ทั้ง container ---------- */
function addStopTo(containerId,data={}){
 if(!stopsState[containerId]) stopsState[containerId]=[];
 stopsState[containerId].push(newStopData(data));
 renderStopsContainer(containerId);
}
function removeStopById(containerId,jobId){
 const arr=stopsState[containerId]; if(!arr) return;
 if(arr.length<=1){ toast('ต้องมีอย่างน้อย 1 งาน'); return; }
 stopsState[containerId]=arr.filter(j=>j.id!==jobId);
 renderStopsContainer(containerId);
}
function moveStopById(containerId,jobId,dir){
 const arr=stopsState[containerId]; if(!arr) return;
 const i=arr.findIndex(j=>j.id===jobId); if(i===-1) return;
 const ni=i+dir; if(ni<0||ni>=arr.length) return;
 const tmp=arr[i]; arr[i]=arr[ni]; arr[ni]=tmp; // สลับ object งานจริงในอาเรย์ (ทั้งก้อนข้อมูล+id ติดไปด้วย) ไม่ใช่แค่สลับ HTML
 renderStopsContainer(containerId);
}
function updateJobField(containerId,jobId,field,value){
 const job=findJobById(containerId,jobId); if(!job) return;
 if(field==='qty') job.qty=Number(value||1)||1; else job[field]=value;
 afterStopsChange(containerId);
}
function renderStopsContainer(containerId){
 const c=$(containerId); if(!c) return;
 const jobs=stopsState[containerId]||[];
 c.innerHTML=jobs.map((job,i)=>stopRowHTML(containerId,job,i+1,jobs.length,{label:'จุดที่'})).join('');
 afterStopsChange(containerId);

function afterStopsChange(containerId){

function collectStopsFrom(containerId){
 return (stopsState[containerId]||[]).map(job=>({
  pickup:job.pickup||'', dropoff:job.dropoff||'',

 }));
}
/* ---------- รูปสินค้า: ผูกกับ job.id ตรง ๆ กันรูปหายตอน re-render จากการจัดลำดับ/เพิ่ม-ลบงานอื่น ---------- */
function addPhotoToJob(containerId,jobId){
 const job=findJobById(containerId,jobId); if(!job) return;
 const input=document.createElement('input'); input.type='file'; input.accept='image/*'; input.multiple=true; input.style.display='none';
 document.body.appendChild(input);
 input.onchange=()=>{
  const files=[...input.files]; let remaining=files.length;
  if(!remaining){ input.remove(); return; }
  files.forEach(file=>{
   if(!file.type.startsWith('image/')){ remaining--; if(remaining<=0) input.remove(); return; }
   const reader=new FileReader();
   reader.onload=e=>{ job.photos.push(e.target.result); renderJobPhotos(containerId,job); remaining--; if(remaining<=0) input.remove(); };
   reader.readAsDataURL(file);
  });
 }; input.click();
}
function renderJobPhotos(containerId,job){
 const box=$('thumbs_'+job.id); if(!box) return;
 box.innerHTML=(job.photos||[]).map((src,idx)=>`<div class="thumb"><img src="${src}"><button type="button" class="thumb-remove" onclick="removePhotoFromJob('${containerId}','${job.id}',${idx})">×</button></div>`).join('');
}
function removePhotoFromJob(containerId,jobId,idx){
 const job=findJobById(containerId,jobId); if(!job) return;
 job.photos.splice(idx,1); renderJobPhotos(containerId,job);
}

/* ---------- แนบรูปในแชท: ตรวจสอบ/บีบอัด/แสดงตัวอย่างก่อนส่ง ---------- */
const CHAT_IMAGE_MAX_BYTES=10*1024*1024; // 10 MB ก่อนบีบอัด (ไฟล์จริงที่ถูกส่งไปเก็บจะเล็กกว่านี้มากหลัง compressChatImage บีบอัดแล้ว)
const CHAT_IMAGE_ACCEPTED=['image/jpeg','image/jpg','image/png','image/webp'];
const CHAT_IMAGE_MAX_DIM=1920;
let custPendingImage=null, riderPendingImage=null;
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file);});}
function loadImageEl(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('โหลดรูปไม่สำเร็จ'));img.src=src;});}
async function compressChatImage(file){
 const rawDataUrl=await fileToDataURL(file);
 const img=await loadImageEl(rawDataUrl);
 let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
 if(w>CHAT_IMAGE_MAX_DIM||h>CHAT_IMAGE_MAX_DIM){
  if(w>=h){h=Math.round(h*CHAT_IMAGE_MAX_DIM/w);w=CHAT_IMAGE_MAX_DIM;}
  else{w=Math.round(w*CHAT_IMAGE_MAX_DIM/h);h=CHAT_IMAGE_MAX_DIM;}
 }
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
 let out=null;
 for(const q of [0.82,0.68,0.55,0.4]){
  let candidate=canvas.toDataURL('image/webp',q);
  if(!candidate||candidate.indexOf('data:image/webp')!==0) candidate=canvas.toDataURL('image/jpeg',q);
  out=candidate;
  if(candidate.length<700000) break; // ประมาณ ~500KB จริงหลังถอด base64 — พอเหมาะกับ localStorage ของ MVP
 }
 return out;
}
async function onChatImagePicked(input,role){
 const file=input.files&&input.files[0];
 input.value='';
 if(!file)return;
 if(!CHAT_IMAGE_ACCEPTED.includes(file.type)){ toast('รองรับเฉพาะไฟล์รูปภาพ JPG, PNG หรือ WebP เท่านั้น'); return; }
 if(file.size>CHAT_IMAGE_MAX_BYTES){ toast('รูปภาพต้องมีขนาดไม่เกิน 10 MB'); return; }
 try{
  const compressed=await compressChatImage(file);
  if(role==='customer'){ custPendingImage=compressed; renderCustAttachPreview(); }
  else { riderPendingImage=compressed; renderRiderAttachPreview(); }
 }catch(e){ toast('ไม่สามารถใช้งานรูปนี้ได้ ลองเลือกรูปอื่น'); } // ข้อความสั้น เข้าใจง่าย ไม่โชว์ technical error ให้ลูกค้า
}
function renderCustAttachPreview(){

// ปุ่มแนบรูปในแชท (จุดเดียว รองรับทั้งถ่ายรูปจากกล้อง+เลือกจากคลัง): สาเหตุจริงที่ถ่ายรูปจากกล้องไม่ได้ (เดิม)
// คือ accept ระบุ MIME type แบบ list ยาว (image/jpeg,image/png,image/webp,image/jpg — "image/jpg" ไม่ใช่ MIME
// type มาตรฐานด้วย ค่าที่ถูกต้องคือ "image/jpeg") ซึ่งเป็นพฤติกรรมที่รู้กันดีว่า iOS Safari/Chrome บาง
// เวอร์ชันจะตัดตัวเลือก "ถ่ายรูป" ออกจากเมนู เหลือแค่ "เลือกจากคลังรูป" เมื่อ accept ไม่ใช่ wildcard image/* ตรง
// ๆ — แก้โดยเปลี่ยนเป็น accept="image/*" (ตามที่ระบุ) และไม่ใส่ capture เลย เพราะ input file ที่มี accept="image/*"
// แบบไม่มี capture จะเปิดเมนูเนทีฟของอุปกรณ์เอง (ถ่ายรูปจากกล้อง / เลือกจากคลังรูป) ให้ผู้ใช้เลือกได้ทั้งสองทาง
// ทั้ง iOS และ Android อยู่แล้วโดยไม่ต้องบังคับโหมดใดโหมดหนึ่ง — ถ้าใส่ capture="environment" แทน จะบังคับเปิด
// กล้องอย่างเดียวบน iOS Safari (ตัดตัวเลือกคลังรูปออกไปเลย) ซึ่งขัดกับข้อกำหนด "ห้ามบังคับให้เปิดเฉพาะกล้อง"
// โดยตรง จึงไม่ใส่ capture — ปุ่มเรียก input.click() ตรง ๆ แบบ synchronous ใน onclick (ไม่ผ่าน async callback)
// ตามที่ต้องรักษาไว้ เพื่อไม่ให้ iOS บล็อกการเปิด picker (ต้องมาจาก user gesture โดยตรงเท่านั้น)

/* ======================= MATCH MARKETPLACE — ชิ้นส่วน UI ที่ใช้ร่วมกันระหว่างฝั่งลูกค้า/ผู้ให้บริการ =======================
   เหตุผลที่แยกมาไว้ตรงนี้ (นอกเขต CUSTOMER/RIDER): รายการ MATCH/ห้องแชท MATCH/การ์ดข้อความ หน้าตาเหมือนกันทุก
   ประการทั้งสองฝั่ง ต่างแค่ "อีกฝ่ายที่กำลังคุยด้วยคือใคร" และปุ่ม action เฉพาะ role — ใช้โค้ดชุดเดียวกันทั้งหมด
   กันโค้ดซ้ำซ้อน/พฤติกรรมเพี้ยนกันระหว่างสองฝั่งโดยไม่ตั้งใจ */
const MATCH_STATUS_LABEL={pending:'รอผู้ให้บริการตอบรับ',accepted:'ยอมรับแล้ว',declined:'ถูกปฏิเสธ',cancelled:'ยกเลิกแล้ว',active:'กำลังดำเนินงาน',completed:'เสร็จสิ้นแล้ว'};
function customerMatchStatusLabel(s){ return MATCH_STATUS_LABEL[s]||s; }
// แคชชื่อ/รูปของ "อีกฝ่าย" ใน MATCH แต่ละอัน — อ่านแบบ sync เสมอ (คืนค่า placeholder ทันทีถ้ายังไม่มีในแคช) แล้วค่อย
// ยิง fetch จริงเบื้องหลัง เสร็จแล้วเรียก fireChange() ให้ทุกจอที่กำลังแสดงอยู่วาดใหม่อัตโนมัติ — รูปแบบเดียวกับที่ทั้ง
// ไฟล์นี้ใช้อยู่แล้ว (realtime → upsert* → fireChange → dbListeners วาดใหม่) ไม่ต้องสร้างกลไก async ใหม่ซ้อน
let MATCH_PROVIDER_CACHE={}, MATCH_PROVIDER_FETCHING={};
let MATCH_CUSTOMER_CACHE={}, MATCH_CUSTOMER_FETCHING={};
function getMatchProviderDisplay(id){
 if(!id) return {name:'ผู้ให้บริการ',photo:null};
 const fromDir=RIDER_DIRECTORY.find(r=>r.id===id);
 if(fromDir) return {name:fromDir.name,photo:fromDir.photo||null};
 if(MATCH_PROVIDER_CACHE[id]) return MATCH_PROVIDER_CACHE[id];
 ensureMatchProviderCached(id);
 return {name:'ผู้ให้บริการ',photo:null};
}
async function ensureMatchProviderCached(id){
 if(MATCH_PROVIDER_CACHE[id]||MATCH_PROVIDER_FETCHING[id]) return;
 MATCH_PROVIDER_FETCHING[id]=true;
 try{
  const {data,error}=await sbCustomer.from('rider_directory').select('*').eq('id',id).maybeSingle();
  if(!error&&data){ MATCH_PROVIDER_CACHE[id]={name:data.name||'ผู้ให้บริการ',photo:data.photo||null}; fireChange(false); }
 } finally { MATCH_PROVIDER_FETCHING[id]=false; }
}
function getMatchCustomerDisplay(id){
 if(!id) return {name:'ลูกค้า',photo:null};
 if(MATCH_CUSTOMER_CACHE[id]) return MATCH_CUSTOMER_CACHE[id];
 ensureMatchCustomerCached(id);
 return {name:'ลูกค้า',photo:null};
}
async function ensureMatchCustomerCached(id){
 if(MATCH_CUSTOMER_CACHE[id]||MATCH_CUSTOMER_FETCHING[id]) return;
 MATCH_CUSTOMER_FETCHING[id]=true;
 try{
  // อ่านได้เฉพาะลูกค้าของ MATCH ที่ผู้ให้บริการคนนี้เป็นคู่สนทนาอยู่จริงเท่านั้น (RLS: profiles_select_customer_by_match_provider ใน 0008_match_marketplace.sql)
  const {data,error}=await sbRider.from('profiles').select('id,name,photo').eq('id',id).maybeSingle();
  if(!error&&data){ MATCH_CUSTOMER_CACHE[id]={name:data.name||'ลูกค้า',photo:data.photo||null}; fireChange(false); }
 } finally { MATCH_CUSTOMER_FETCHING[id]=false; }
}
// แถวเดียวในรายการ MATCH/แชท — ใช้ทั้งฝั่งลูกค้า (viewerRole='customer', เห็นชื่อผู้ให้บริการ) และฝั่งผู้ให้บริการ
// (viewerRole='rider', เห็นชื่อลูกค้า)
function matchListRowHTML(m,viewerRole){
 const counterparty=viewerRole==='customer'?getMatchProviderDisplay(m.providerId):getMatchCustomerDisplay(m.customerId);
 const openFn=viewerRole==='customer'?'customerOpenMatch':'riderOpenMatch';

// ตรวจสอบทั้งระบบ (End-to-End, เฟส 4) — ADMIN_USERS: cache ผู้ใช้ "ทั้งหมดจริง" จากตาราง profiles
// ============================================================================
// ปัญหาเดิมที่พบจากการตรวจสอบ: allUsersList() อ่านจาก RIDERS/CUSTOMERS/ADMINS ซึ่งเป็นแค่ localStorage
// mirror ต่อเบราว์เซอร์ (ถูก seed ตอน login/สมัครสมาชิกของบัญชีที่เคยใช้งานบนเครื่องนั้นเท่านั้น) — ทำให้
// แอดมินเห็น "จัดการผู้ใช้" ไม่ครบ เห็นเฉพาะคนที่เคยล็อกอิน/สมัครบนเบราว์เซอร์เดียวกับแอดมินเอง และปุ่มแบน/
// ปลดแบนก็ค้นหาเป้าหมายจาก mirror เดียวกันนี้ด้วย ถ้าไม่เจอในนั้นจะขึ้น "ไม่พบบัญชีนี้" ทันทีแม้ผู้ใช้จะมีอยู่จริง
// ในระบบก็ตาม — แก้โดยดึงข้อมูลจากตาราง profiles ตรงๆ ผ่าน sbAdmin (RLS policy profiles_select_admin ใน
// 0001_init.sql อนุญาตให้แอดมินอ่านได้ทุกแถวอยู่แล้ว ไม่ต้องแก้ RLS เพิ่ม) แล้วรักษาให้สดอยู่เสมอผ่าน Realtime
// (ดู subscribeRealtimeForRole role==='admin' ด้านบน) — เป็น "แหล่งข้อมูลจริง" หนึ่งเดียวสำหรับหน้าจัดการผู้ใช้
// จากนี้ไป ไม่พึ่ง local mirror อีกต่อไป (RIDERS/CUSTOMERS/ADMINS ยังคงไว้เหมือนเดิมสำหรับ session ปัจจุบันของ
// เบราว์เซอร์นั้นๆ เท่านั้น ไม่ได้ถูกลบทิ้ง เพื่อไม่กระทบระบบ login/signup เดิม)
let ADMIN_USERS=[]; // [{id,role,name,phone,photo,banned,createdAt}]
let adminUsersSynced=false;
async function syncAdminUsersList(){
 const {data,error}=await sbAdmin.from('profiles').select('id,role,name,phone,photo,banned,created_at').order('created_at',{ascending:false});
 if(error){ console.error('syncAdminUsersList failed',error); toast('โหลดรายชื่อผู้ใช้ไม่สำเร็จ: '+error.message); return; }
 ADMIN_USERS=(data||[]).map(mapProfileRowToAdminUser);
 adminUsersSynced=true;
 if(adminTab==='users') renderAdminUsersList();
}
function mapProfileRowToAdminUser(p){
 return {id:p.id,role:p.role,name:p.name||'',phone:p.phone||'',photo:p.photo||null,banned:!!p.banned,createdAt:p.created_at};
}
// เรียกจาก realtime listener ของแอดมิน (INSERT สมาชิกใหม่ / UPDATE เช่นแบน-ปลดแบน-แก้โปรไฟล์)
function upsertAdminUserProfile(row){
 if(!row||!row.id) return;
 const mapped=mapProfileRowToAdminUser(row);
 const idx=ADMIN_USERS.findIndex(u=>u.id===mapped.id);
 if(idx>=0) ADMIN_USERS[idx]=mapped; else ADMIN_USERS.unshift(mapped);
 if(adminTab==='users') renderAdminUsersList();
}
// เรียกจาก realtime listener ของแอดมิน (DELETE — บัญชีถูกลบจริงผ่าน Edge Function admin-users)
function removeAdminUserProfile(id){
 if(!id) return;
 const idx=ADMIN_USERS.findIndex(u=>u.id===id);
 if(idx>=0) ADMIN_USERS.splice(idx,1);
 if(adminTab==='users') renderAdminUsersList();
}

// เฟส 5 (เชื่อม Edge Function "admin-users" เวอร์ชันจริงที่ deploy อยู่): เปลี่ยนจากเรียกด้วย fetch() ตรงๆ
// เป็น sbAdmin.functions.invoke() ตามที่ระบุ — ยังคงหลักการเดิมทุกประการ: แนบ access token ของแอดมินที่ login
// อยู่ไปให้ฟังก์ชันตรวจสอบสิทธิ์เอง (server-side) ทุกครั้งก่อนทำงาน service_role ไม่เคยหลุดมาฝั่ง frontend
// ใช้ร่วมกันทั้งลบบัญชีและรีเซ็ตรหัสผ่าน — ไม่สร้าง Supabase client ใหม่ ใช้ sbAdmin ตัวเดิมของโปรเจกต์เท่านั้น
async function callAdminUsersFunction(action,targetId,extra){
 const {data:sessionData,error:sessionError}=await sbAdmin.auth.getSession();
 const session=sessionData&&sessionData.session;
 if(sessionError||!session){ return {ok:false,error:'เซสชันแอดมินหมดอายุ กรุณาเข้าสู่ระบบใหม่'}; }
 let invokeResult;
 try{
  invokeResult=await sbAdmin.functions.invoke('admin-users',{
   body:Object.assign({action,targetId},extra||{}),
   headers:{Authorization:'Bearer '+session.access_token}
  });
 }catch(e){ return {ok:false,error:'เชื่อมต่อ server ไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 const {data,error}=invokeResult||{};
 if(error){
  // สำคัญ: เมื่อ Edge Function ตอบกลับ status ที่ไม่ใช่ 2xx (400/401/403/404/405/500) sbAdmin.functions.invoke()
  // จะไม่ parse body ให้อัตโนมัติ (data เป็น null) แต่เก็บ Response ดิบไว้ที่ error.context — ต้อง parse เอง
  // เพื่อดึงข้อความ error จริงจาก {ok:false,error:"..."} ที่ Edge Function ส่งมา ไม่งั้นจะเห็นแค่ข้อความทั่วไป
  // "Edge Function returned a non-2xx status code" ที่ไม่บอกสาเหตุจริงให้แอดมินเห็น
  let serverMsg=null;
  try{
   if(error.context&&typeof error.context.json==='function'){
    const errBody=await error.context.clone().json();
    serverMsg=errBody&&errBody.error;
   }
  }catch(e){ /* response ไม่ใช่ JSON ที่ parse ได้ — ใช้ error.message ทั่วไปแทนด้านล่าง */ }
  return {ok:false,error:serverMsg||error.message||'ทำรายการไม่สำเร็จ'};
 }
 if(!data||data.ok===false) return {ok:false,error:(data&&data.error)||'ทำรายการไม่สำเร็จ'};
 return Object.assign({ok:true},data);
}
// เฟส 3 (แก้ระบบ Admin): ลบบัญชีจริงทั้ง auth.users และ profiles (ผูก on delete cascade) ผ่าน Edge Function
// เท่านั้น (เดิมลบได้แค่แถว profiles ตรงๆ จาก client ทำให้บัญชี auth.users เดิมยัง login ผ่าน Supabase Auth ได้
// ในทางเทคนิค แม้จะใช้งานต่อไม่ได้เพราะไม่มี profile — ตอนนี้ลบจริงสมบูรณ์ 100% ผ่าน service_role ฝั่งเซิร์ฟเวอร์)
let adminDeleteBusy=false;
async function adminDeleteUser(type,id){
 if(adminDeleteBusy) return;
 if(type==='admin'){toast('ไม่สามารถลบบัญชีแอดมินจากหน้านี้ได้');adminUserConfirm=null;renderAdminUsersList();return}
 const me=currentAdmin();
 if(me&&me.id===id){ toast('ไม่สามารถลบบัญชีแอดมินของตัวเองได้'); adminUserConfirm=null; renderAdminUsersList(); return; }
 adminDeleteBusy=true;
 try{
  // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): เอาชื่อไว้แสดงผล toast จาก ADMIN_USERS (รายชื่อจริงทั้งระบบ) แทน
  // local mirror เดิม — ไม่ใช้เป็นเงื่อนไขตัดสินใจใดๆ การตรวจสอบสิทธิ์/ความถูกต้องทั้งหมดทำที่ Edge Function เสมอ
  const targetName=(ADMIN_USERS.find(x=>x.id===id)||{}).name||'';
  // ตามคำสั่ง (แก้เชื่อม admin-users): ต้องเรียก action "delete_user" ตรงตาม contract ของ Edge Function เวอร์ชัน
  // ที่ deploy จริง (เดิมเรียก 'delete' — ฝั่ง server เวอร์ชันนี้ normalize 'delete' เป็น 'delete_user' ให้เองก็จริง
  // แต่ระบุให้ตรงชัดเจนตามที่สั่งไว้)
  const r=await callAdminUsersFunction('delete_user',id);
  if(!r.ok){ toast('ลบบัญชีไม่สำเร็จ: '+r.error); return; }
  removeAdminUserProfile(id); // อัปเดต ADMIN_USERS ทันทีแบบ optimistic ก่อน (ตอบสนองไว)
  // ข้อกำหนด: ลบบัญชีสำเร็จแล้วต้องรีเฟรชรายชื่อผู้ใช้ใหม่ — ใช้ syncAdminUsersList() ซึ่งเป็นฟังก์ชันเดิมของ
  // โปรเจกต์ที่ query ตาราง profiles จริงจาก Supabase (เทียบเท่า loadUsers() ที่ผู้ใช้ระบุถึง) ยืนยันรายชื่อให้
  // ตรงกับฐานข้อมูลจริงอีกครั้งหลังลบเสร็จ ไม่พึ่งแค่การอัปเดต cache ในเครื่องเฉย ๆ
  syncAdminUsersList();
  // เผื่อบัญชีที่ถูกลบตรงกับ local mirror ของเบราว์เซอร์นี้เอง (เช่นแอดมินเคยล็อกอิน/สมัครเป็นคนนี้มาก่อนบนเครื่องนี้)
  // ให้เคลียร์ตามไปด้วย กันข้อมูลตกค้างชี้ไปหาบัญชีที่ลบไปแล้วจริง
  if(type==='customer'){ const idx=CUSTOMERS.customers.findIndex(x=>x.id===id); if(idx>=0){ CUSTOMERS.customers.splice(idx,1); saveCustomers(); } }
  else if(type==='rider'){ const idx=RIDERS.riders.findIndex(x=>x.id===id); if(idx>=0){ RIDERS.riders.splice(idx,1); saveRiders(); } }
  toast('ลบบัญชี'+(targetName?(' '+targetName):'')+' แล้ว (ประวัติออเดอร์เดิมยังอยู่)');
 } finally { adminDeleteBusy=false; adminUserConfirm=null; adminUserDetail=null; renderAdminUsersList(); }
}
// เฟส 3 (แก้ระบบ Admin, ใหม่): แอดมิน "รีเซ็ตรหัสผ่าน" ให้ลูกค้า/ไรเดอร์ได้ ผ่าน Edge Function เดียวกัน — ไม่มีทาง
// อ่านรหัสผ่านเดิมได้เลย (Supabase Auth เก็บ hash เท่านั้น) ระบบจะ "ตั้งรหัสผ่านใหม่แบบสุ่ม" ให้แทน แล้วแสดงให้
// แอดมินเห็น "ครั้งเดียว" ตรงนี้เพื่อนำไปแจ้งเจ้าของบัญชีเอง ไม่ถูกบันทึกไว้ที่ใดในระบบทั้งสิ้น
let adminResetPwBusy=false;
let adminResetPwResult=null; // {id, name, password} ของรายการล่าสุดที่เพิ่ง reset ไว้แสดงผลครั้งเดียว
// รับ customPassword เพิ่มเติมเป็นพารามิเตอร์ตัวเลือก (ไม่บังคับ): ถ้าอนาคตมีจุดในหน้าเว็บที่ให้แอดมินพิมพ์
// รหัสผ่านใหม่เองแล้วเรียกฟังก์ชันนี้พร้อมค่านั้น จะถูกส่งต่อเป็น newPassword ให้ Edge Function ใช้ตรงๆ ตามที่
// ระบุไว้ ("หากมีการส่งรหัสผ่านใหม่จากหน้าเว็บ ให้รองรับ newPassword") — ปุ่ม "รีเซ็ตรหัสผ่าน" เดิมในหน้า UI
// ยังคงเรียกแบบไม่ส่งพารามิเตอร์นี้เหมือนเดิมทุกประการ (customPassword=undefined) ทำให้ Edge Function สุ่ม
// รหัสผ่านให้เองเหมือนพฤติกรรมเดิมของฟีเจอร์นี้ ไม่มีอะไรเปลี่ยนจากมุมมองผู้ใช้งานปัจจุบัน
async function adminResetPassword(type,id,customPassword){
 if(adminResetPwBusy) return;
 // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): หาชื่อไว้แสดงผลจาก ADMIN_USERS แทน local mirror เดิม (เหตุผลเดียวกับ
 // adminToggleBan/adminDeleteUser ด้านบน) — ไม่กระทบการตรวจสิทธิ์ ซึ่งทำที่ Edge Function เสมออยู่แล้ว
 const u=ADMIN_USERS.find(x=>x.id===id);
 adminResetPwBusy=true;
 try{
  const extra=(typeof customPassword==='string'&&customPassword.trim())?{newPassword:customPassword.trim()}:undefined;

 } finally { adminResetPwBusy=false; renderAdminUsersList(); }
}

const DK_STATUS_LABEL={available:'ว่าง',busy:'ไม่ว่าง',offline:'ออฟไลน์'};
function dkProviderStatus(row){
 const st=riderEffectiveStatus(row); // 'open'|'busy'|'closed'
 return st==='open'?'available':st==='busy'?'busy':'offline';
}
function startingPriceHTML(row){
 // ราคาเริ่มต้นเป็นข้อมูลจริงที่ผู้ให้บริการตั้งเองเท่านั้น (ไม่มีการคำนวณ/สุ่ม) — ถ้ายังไม่ตั้งค่า แสดงข้อความ
 // ตรงไปตรงมาแทนตัวเลขหลอก
 if(row.starting_price!=null&&row.starting_price!=='') return `<div class="dk-startprice">เริ่มต้น <b>${baht(row.starting_price)}</b></div>`;
 return `<div class="dk-startprice muted">สอบถามราคาในแชท</div>`;
}
/* สถานะแบบ Reference: จุดสีเล็ก + ข้อความบาง ๆ มุมขวาบนของการ์ด (ไม่ใช่ป้ายทึบ) — ยังคำนวณจากข้อมูลจริง
   (สวิตช์เปิดรับงานของผู้ให้บริการ + งานที่กำลังทำอยู่จริง) เหมือนเดิมทุกประการ ไม่มีสถานะปลอม */
function dkStatusDotHTML(row){
 const k=dkProviderStatus(row);
 return `<span class="dk-onstatus st-${k}"><i></i>${DK_STATUS_LABEL[k]}</span>`;
}
/* คะแนนแบบ Reference: "★ 4.93 (127 งาน)" — ตัวเลขงานคือ completed_count จริงจากฐานข้อมูล
   ถ้ายังไม่มีรีวิวเลย แสดงเฉพาะจำนวนงานจริง ไม่แสดงดาวหลอก */
function dkRatingLineHTML(row){
 if(row.review_count>0) return `<span class="dk-rating-num"><span class="dk-star">★</span> <b>${Number(row.avg_rating).toFixed(2)}</b> <span>(${row.completed_count} งาน)</span></span>`;
 return `<span class="dk-rating-num dk-norating">ยังไม่มีรีวิว${row.completed_count?` • ${row.completed_count} งาน`:''}</span>`;
}
function providerCardHTML(row){
 const st=dkProviderStatus(row);
 const canMatch=st==='available';
 const services=(row.services||'').split(',').map(s=>s.trim()).filter(Boolean);
 return `<div class="dk-pcard" onclick="customerOpenProviderProfile('${row.id}')">
  <div class="dk-pchead">
   ${avatarHTML(row.name,row.photo,48,'brand')}
   <div class="dk-pcbody">
    <div class="dk-pctop">
     <div class="dk-pcname">${esc(row.name)}</div>
     ${dkStatusDotHTML(row)}
    </div>
    ${services.length?`<div class="dk-pcsub">${services.slice(0,3).map(esc).join(' • ')}</div>`:''}
    <div class="dk-rating">${dkRatingLineHTML(row)}${row.service_area?`<span class="dk-area-inline">${ICON_MAPPIN}${esc(row.service_area)}</span>`:''}</div>
    ${startingPriceHTML(row)}
   </div>
  </div>
  <div class="dk-pcard-actions">
   <button type="button" class="dk-btn outline" onclick="event.stopPropagation();customerOpenProviderProfile('${row.id}')">ดูโปรไฟล์</button>
   <button type="button" class="dk-btn primary" ${canMatch?'':'disabled'} onclick="event.stopPropagation();customerStartMatch('${row.id}','${esc(row.name)}')">MATCH</button>

}
/* การ์ดแนวนอนขนาดเล็กสำหรับแถว "แนะนำสำหรับคุณ" ตาม Reference (คนที่เหมาะกับคุณ) — ข้อมูลจริงทั้งหมด */
function providerMiniCardHTML(row){
 const services=(row.services||'').split(',').map(s=>s.trim()).filter(Boolean);
 return `<button type="button" class="dk-mini" onclick="customerOpenProviderProfile('${row.id}')">
  <span class="dk-mini-av">${avatarHTML(row.name,row.photo,54,'brand')}<i class="dk-mini-dot st-${dkProviderStatus(row)}"></i></span>
  <span class="dk-mini-name">${esc(row.name)}</span>
  <span class="dk-mini-sub">${services.length?esc(services[0]):'ผู้ให้บริการ'}</span>
  <span class="dk-mini-rate">${row.review_count>0?`<span class="dk-star">★</span> ${Number(row.avg_rating).toFixed(2)}`:`${row.completed_count} งาน`}</span>
 </button>`;
}
function renderProviderGrid(){
 const box=$('dkProviderGrid'); if(!box) return;
 let rows=RIDER_DIRECTORY;
 if(riderDirectoryCategory!=='all') rows=rows.filter(r=>(r.services||'').split(',').map(s=>s.trim()).includes(riderDirectoryCategory));
 const q=riderDirectorySearch.trim().toLowerCase();
 if(q) rows=rows.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.services||'').toLowerCase().includes(q)||(r.bio||'').toLowerCase().includes(q)||(r.service_area||'').toLowerCase().includes(q));

 // แถว "แนะนำสำหรับคุณ" ตาม Reference — คัดจากข้อมูลจริงเท่านั้น: เฉพาะคนที่ "ว่างรับงานอยู่จริง" ตอนนี้
 // เรียงตามคะแนนจริงแล้วตามจำนวนงานจริง ไม่มีการสุ่ม/ยัดข้อมูลปลอม แสดงเฉพาะตอนดู "ทั้งหมด" และไม่ได้ค้นหาอยู่
 // (เหมือน Reference ที่แถวแนะนำเป็นชุดคัดมาให้ ไม่ใช่ผลการค้นหา) และต้องมีอย่างน้อย 2 คนถึงจะคุ้มที่จะโชว์
 let recHTML='';
 if(riderDirectoryCategory==='all' && !q){
  const rec=RIDER_DIRECTORY.filter(r=>dkProviderStatus(r)==='available')
   .sort((a,b)=>(Number(b.avg_rating)||0)-(Number(a.avg_rating)||0)||(Number(b.completed_count)||0)-(Number(a.completed_count)||0))
   .slice(0,8);
  if(rec.length>=2){
   recHTML=`<div class="dk-sechead"><h3>แนะนำสำหรับคุณ</h3><span>ว่างรับงานตอนนี้ ${rec.length} คน</span></div>
   <div class="dk-hscroll">${rec.map(providerMiniCardHTML).join('')}</div>`;
  }
 }
 const listHead=`<div class="dk-sechead" style="margin-top:${recHTML?'16px':'2px'}"><h3>${riderDirectoryCategory==='all'&&!q?'ผู้ให้บริการทั้งหมด':'ผลการค้นหา'}</h3><span>${rows.length} คน</span></div>`;
 const listHTML=rows.length
  ? `${listHead}<div class="dk-provider-grid">${rows.map(providerCardHTML).join('')}</div>`
  : `${listHead}<div class="dk-empty">ไม่พบผู้ให้บริการที่ตรงกับเงื่อนไข ลองเปลี่ยนหมวดบริการหรือคำค้นหา</div>`;
 box.innerHTML=recHTML+listHTML;
}

}

/* ---------- สร้างคำขอ MATCH ---------- */
let customerMatchBusy=false;
async function customerStartMatch(providerId,providerName){
 if(customerMatchBusy) return;
 customerMatchBusy=true;
 try{
  const {data,error}=await sbCustomer.rpc('create_match_request',{p_provider_id:providerId});
  if(error){ toast(error.message||'ส่งคำขอ MATCH ไม่สำเร็จ'); return; }
  upsertMatch(data);
  toast('ส่งคำขอ MATCH ถึง '+providerName+' แล้ว รอผู้ให้บริการตอบรับ');
  customerOpenMatch(data.id);
 } finally { customerMatchBusy=false; }
}
function customerOpenMatch(id){
 const u=new URL(location.href); u.searchParams.delete('order'); history.pushState({},'',u.toString());
 customerViewingMatchId=id; customerViewMode='matchRoom'; custBuiltMode=null; renderCustomerRoot();
}

/* ---------- ให้คะแนน+รีวิวหลังงานเสร็จสิ้น ---------- */
async function renderMatchReviewBox(matchId){
 const box=$('dkReviewBox'); if(!box) return;
 const {data,error}=await sbCustomer.from('reviews').select('*').eq('match_id',matchId).maybeSingle();
 if(!error&&data){
  box.innerHTML=`<div class="dk-card" style="margin-top:0"><h2 style="margin:0 0 8px">รีวิวของคุณ</h2><div class="dk-review-stars">${'★'.repeat(data.rating)}${'☆'.repeat(5-data.rating)}</div>${data.comment?`<div class="dk-review-comment" style="margin-top:6px">${esc(data.comment)}</div>`:''}</div>`;
  return;
 }
 customerPickedStar=0;
 box.innerHTML=`<div class="dk-card" style="margin-top:0">
  <h2 style="margin:0 0 8px">ให้คะแนนงานนี้</h2>
  <div class="dk-stars-picker" id="dkStarsPicker">${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="customerPickStar(${n})">★</span>`).join('')}</div>
  <textarea id="dkReviewComment" placeholder="เล่าประสบการณ์การใช้บริการ (ไม่บังคับ)" style="width:100%;min-height:70px;border:1px solid var(--brand-line);border-radius:10px;padding:10px;font-size:13px;box-sizing:border-box;font-family:inherit"></textarea>
  <button type="button" class="dk-btn primary" style="width:100%;margin-top:10px" onclick="customerSubmitReview('${matchId}')">ส่งรีวิว</button>
 </div>`;
}
let customerPickedStar=0;
function customerPickStar(n){
 customerPickedStar=n;
 const picker=$('dkStarsPicker'); if(!picker) return;
 picker.querySelectorAll('span').forEach(el=>el.classList.toggle('on',Number(el.dataset.n)<=n));
}
let customerReviewBusy=false;
async function customerSubmitReview(matchId){
 if(customerReviewBusy) return;
 if(!customerPickedStar){ toast('กรุณาเลือกจำนวนดาว'); return; }
 customerReviewBusy=true;
 try{
  const comment=$('dkReviewComment')?$('dkReviewComment').value:'';
  const {error}=await sbCustomer.rpc('submit_review',{p_match_id:matchId,p_rating:customerPickedStar,p_comment:comment});
  if(error){ toast(error.message||'ส่งรีวิวไม่สำเร็จ'); return; }
  toast('ขอบคุณสำหรับรีวิว!');
  renderMatchReviewBox(matchId);
 } finally { customerReviewBusy=false; }
}
/* ---------- ตอบรับ/ปฏิเสธข้อเสนอราคาในแชท ---------- */
let customerProposalBusy=false;
async function customerRespondProposal(messageId,accept){
 if(customerProposalBusy) return;
 customerProposalBusy=true;
 try{
  const {data,error}=await sbCustomer.rpc('respond_price_proposal',{p_message_id:messageId,p_accept:accept});
  if(error){ toast(error.message||'ดำเนินการไม่สำเร็จ'); return; }
  upsertChatMessage(data);
  // อัปเดตสถานะ MATCH ในเครื่อง (optimistic) ทันที ไม่รอ Realtime อย่างเดียว — เพราะ respond_price_proposal
  // คืนค่าแค่แถวข้อความ ไม่ใช่แถว matches เอง ถ้าไม่อัปเดตตรงนี้ สถานะจะยังค้างเป็น "ยอมรับแล้ว" บนหน้าจอผู้ใช้ที่
  // เพิ่งกดเอง จนกว่า Realtime event ของตาราง matches จะมาถึง (ปกติเร็วมาก แต่ไม่ควรพึ่งพาอย่างเดียวสำหรับ action ของตัวเอง)
  const m=findMatch(data.match_id);
  if(m){
   if(accept){ m.status='active'; m.agreedPrice=data.meta&&data.meta.price!=null?Number(data.meta.price):m.proposedPrice; }
   fireChange(false);
  }
  toast(accept?'ยอมรับข้อเสนอราคาแล้ว เริ่มงานได้เลย':'ปฏิเสธข้อเสนอราคาแล้ว');
 } finally { customerProposalBusy=false; }
}
/* ---------- ส่งข้อความในห้องแชท MATCH ---------- */
let custMatchChatSendBusy=false;
async function customerSendMatchChat(){
 if(custMatchChatSendBusy) return;
 const id=customerViewingMatchId; if(!id) return;
 const v=$('dkChatInput')?$('dkChatInput').value.trim():'';
 if(!v&&!custPendingImage) return;
 custMatchChatSendBusy=true;
 if($('dkChatInputSendBtn')){ $('dkChatInputSendBtn').disabled=true; $('dkChatInputSendBtn').textContent='กำลังส่ง...'; }
 if($('dkChatInput')) $('dkChatInput').disabled=true;
 if($('attachBtn_dkChatInputImg')) $('attachBtn_dkChatInputImg').disabled=true;
 try{
  const ok=await addChatTo({matchId:id},'customer',v,custPendingImage);
  if(ok){ if($('dkChatInput')) $('dkChatInput').value=''; custPendingImage=null; renderCustAttachPreview(); }
 } finally {
  custMatchChatSendBusy=false;
  if($('dkChatInputSendBtn')){ $('dkChatInputSendBtn').disabled=false; $('dkChatInputSendBtn').textContent='ส่ง'; }
  if($('dkChatInput')) $('dkChatInput').disabled=false;
  if($('attachBtn_dkChatInputImg')) $('attachBtn_dkChatInputImg').disabled=false;
 }
}

async function onCustomerProfilePhotoPicked(input){

let custProfileSaveBusy=false;
async function onCustomerProfileSave(){
 if(custProfileSaveBusy) return;
 const cust=currentCustomer(); if(!cust) return;
 const name=$('custProfileName')?$('custProfileName').value:'';
 if(!name||!name.trim()){ toast('กรุณากรอกชื่อ'); return; }
 custProfileSaveBusy=true;
 try{
  const r=await updateCustomerProfile(cust.id,{name,photo:custProfilePendingPhoto});
  if(!r.ok){ toast(r.reason); return; }
  custProfilePendingPhoto=undefined;
  toast('บันทึกโปรไฟล์แล้ว');
  renderCustomerRoot();
 } finally { custProfileSaveBusy=false; }
}

let custAuthBusy=false;
async function onCustomerSignupSubmit(){
 if(custAuthBusy) return;
 const name=$('custSignupName').value, phone=$('custSignupPhone').value;
 const pw=$('custSignupPassword').value, pw2=$('custSignupPassword2').value;
 if(!name.trim()){ toast('กรุณากรอกชื่อ'); return; }
 if(!phone.trim()){ toast('กรุณากรอกเบอร์โทรศัพท์'); return; }
 if(!pw||pw.length<4){ toast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return; }
 if(pw!==pw2){ toast('รหัสผ่านยืนยันไม่ตรงกัน'); return; }
 custAuthBusy=true;
 try{
  const r=await customerSignup({name,phone,password:pw,photo:custAuthPendingPhoto});
  if(!r.ok){ toast(r.reason); return; }
  custAuthPendingPhoto=null;
  setCustomerSession(r.customer.id);
  customerViewMode='home'; custBuiltMode=null;
  toast('สมัครสมาชิกสำเร็จ ยินดีต้อนรับ '+r.customer.name);
  renderCustomerRoot();
  activateRoleSync('customer');
 } finally { custAuthBusy=false; }
}
async function onCustomerLoginSubmit(){
 if(custAuthBusy) return;
 const phone=$('custLoginPhone').value, pw=$('custLoginPassword').value;
 custAuthBusy=true;
 try{
  const r=await customerLogin(phone,pw);
  if(!r.ok){ toast(r.reason); return; }
  setCustomerSession(r.customer.id);
  customerViewMode='home'; custBuiltMode=null;
  toast('ยินดีต้อนรับกลับมา '+r.customer.name);
  renderCustomerRoot();
  activateRoleSync('customer');
 } finally { custAuthBusy=false; }
}
function customerLogout(){
 sbCustomer.auth.signOut().catch(()=>{});
 clearCustomerSession();
 deactivateRoleSync('customer');
 customerAuthMode='login'; customerViewMode='home'; custBuiltMode=null;
 const u=new URL(location.href); u.searchParams.delete('order'); history.pushState({},'',u.toString());
 toast('ออกจากระบบแล้ว');
 renderCustomerRoot();
}
// เฟส 3 (fix): ดึง user.id จาก Supabase Auth จริง (auth.getUser()) เสมอ ก่อนเขียน customer_id/sender_id ลง
// Supabase ทุกครั้ง — ห้ามเชื่อ id จาก local mirror (CUSTOMERS.customers / currentCustomer()) เพียงอย่างเดียว
// เพราะเป็นแค่สำเนาในเครื่องที่อาจไม่ตรงกับ session จริง (เช่น กรณี localStorage เก่าค้างจากยุคก่อนเชื่อม Supabase)
// ถ้าไม่มี session จริงตอนนี้ ให้บล็อกและบังคับ login ใหม่ ไม่มีทาง fallback ไปใช้ id ปลอมได้อีก
async function requireCustomerAuthId(){
 let data,error;
 try{ ({data,error}=await sbCustomer.auth.getUser()); }
 catch(e){ return null; }
 if(error||!data||!data.user||!isUuid(data.user.id)) return null;
 return data.user.id;
}
async function requireRiderAuthId(){
 let data,error;
 try{ ({data,error}=await sbRider.auth.getUser()); }
 catch(e){ return null; }
 if(error||!data||!data.user||!isUuid(data.user.id)) return null;
 return data.user.id;
}

let custChatSendBusy=false;
// ส่งข้อความ/รูปแบบ async จริง: กันกดส่งซ้ำระหว่างรอ (custChatSendBusy), แสดงสถานะ "กำลังส่ง..." บนปุ่ม, ปิดปุ่ม
// แนบรูป+ช่องพิมพ์ระหว่างส่ง และเคลียร์ข้อความ/รูปที่แนบไว้ "เฉพาะตอนส่งสำเร็จจริง" เท่านั้น — ถ้าส่งไม่สำเร็จ
// (เช่น เน็ตหลุด/RLS ปฏิเสธ) ข้อความ/รูปจะยังค้างอยู่ในกล่องให้กดส่งใหม่ได้ทันที ไม่หายไปเฉย ๆ ทั้งที่ไม่ได้ส่งจริง
// หมายเหตุ: หน้าติดตามออเดอร์อาจถูก re-render จาก realtime ระหว่างรอ (root.innerHTML ใหม่ทั้งก้อน) จึงต้อง
// ค้นหา element ด้วย $() ใหม่ทุกครั้งที่ใช้งาน (ไม่ cache ตัวแปรไว้ข้าม await) กัน element เก่าหลุดจาก DOM
async function customerSendChat(){
 if(custChatSendBusy) return;
 const params=new URLSearchParams(location.search); const id=params.get('order'); if(!id)return;
 const v=$('custChatInput')?$('custChatInput').value.trim():'';
 if(!v&&!custPendingImage)return;
 custChatSendBusy=true;
 if($('custChatSendBtn')){ $('custChatSendBtn').disabled=true; $('custChatSendBtn').textContent='กำลังส่ง...'; }
 if($('custChatInput')) $('custChatInput').disabled=true;
 if($('attachBtn_custImgInput')) $('attachBtn_custImgInput').disabled=true;
 try{
  const ok=await addChat(id,'customer',v,custPendingImage);
  if(ok){ if($('custChatInput')) $('custChatInput').value=''; custPendingImage=null; renderCustAttachPreview(); }
 } finally {
  custChatSendBusy=false;
  if($('custChatSendBtn')){ $('custChatSendBtn').disabled=false; $('custChatSendBtn').textContent='ส่ง'; }
  if($('custChatInput')) $('custChatInput').disabled=false;
  if($('attachBtn_custImgInput')) $('attachBtn_custImgInput').disabled=false;
 }
}
async function customerCancel(id){
 const {data,error}=await sbCustomer.rpc('cancel_order',{p_order_id:id});
 if(error){ toast(error.message||'ยกเลิกไม่สำเร็จ'); return; }
 upsertOrder(data);
 toast('ยกเลิกงานแล้ว');
}
function renderCustomerRoot(){
 const root=$('customerRoot'); if(!root)return;
 const cust=currentCustomer();
 if(!cust){
  // สร้างใหม่ทุกครั้ง (เหมือนไรเดอร์) เพราะฟอร์ม login/signup ต้องสลับโหมดได้ทันทีที่กดปุ่ม — เก็บค่าที่พิมพ์ค้างไว้กันข้อมูลหาย
  const keep={};
  ['custSignupName','custSignupPhone','custSignupPassword','custSignupPassword2','custLoginPhone','custLoginPassword'].forEach(id=>{ if($(id)) keep[id]=$(id).value; });
  root.innerHTML=customerAuthFormHTML();
  Object.keys(keep).forEach(id=>{ if($(id)) $(id).value=keep[id]; });
  custBuiltMode='auth';
  renderBottomNav();
  return;
 }
 const params=new URLSearchParams(location.search);
 const orderId=params.get('order');
 // ลิงก์ติดตามออเดอร์เดิม (ระบบแอดมินรับแจ้งทางแชท/โทรศัพท์) ต้องเช็คก่อนเสมอ — สำคัญที่สุดของระบบเดิมที่ต้องคงไว้
 if(orderId){
  const o=findOrder(orderId);
  // เห็นได้เฉพาะออเดอร์ของบัญชีตัวเอง หรือออเดอร์ที่แอดมินสร้างให้ทางแชท/โทรศัพท์ (ไม่ผูกบัญชีใคร) เท่านั้น — ห้ามเห็นออเดอร์ของลูกค้าคนอื่น
  if(!o || (o.customerId && o.customerId!==cust.id)){ root.innerHTML='<div class="card"><div class="empty">ไม่พบออเดอร์นี้</div></div>'; custBuiltMode=null; renderBottomNav(); return; }
  const savedVal=$('custChatInput')?$('custChatInput').value:'';
  const prevBox=$('custChatMsgs');
  const wasNearBottom=prevBox?(prevBox.scrollHeight-prevBox.scrollTop-prevBox.clientHeight<80):true;
  root.innerHTML=customerTrackingHTML(o);
  if($('custChatInput')) $('custChatInput').value=savedVal;
  if(custPendingImage) renderCustAttachPreview();
  const nextBox=$('custChatMsgs');
  if(nextBox&&wasNearBottom) nextBox.scrollTop=nextBox.scrollHeight;
  custBuiltMode='track:'+orderId;
  renderBottomNav();
  return;
 }
 if(customerViewMode==='riderProfile'){
  if(custBuiltMode!=='riderProfile:'+customerViewingProviderId){ root.innerHTML=customerProviderProfileHTML(); custBuiltMode='riderProfile:'+customerViewingProviderId; renderCustomerProviderProfileView(); }
  renderBottomNav();
  return;
 }
 if(customerViewMode==='matchRoom'){
  const m=findMatch(customerViewingMatchId);
  if(!m||m.customerId!==cust.id){ root.innerHTML=`<div class="dk-card"><button type="button" class="dk-btn outline" style="max-width:100px;margin-bottom:12px" onclick="customerNavGo('chats')">${ICON_ARROWLEFT}&nbsp;กลับ</button><div class="dk-empty">ไม่พบ MATCH นี้ หรือคุณไม่มีสิทธิ์เข้าถึง</div></div>`; custBuiltMode=null; renderBottomNav(); return; }
  const savedVal=$('dkChatInput')?$('dkChatInput').value:'';
  const prevBox=$('dkChatBox');
  const wasNearBottom=prevBox?(prevBox.scrollHeight-prevBox.scrollTop-prevBox.clientHeight<80):true;
  root.innerHTML=matchRoomHTML(m,'customer',getMatchProviderDisplay(m.providerId));
  if($('dkChatInput')) $('dkChatInput').value=savedVal;
  if(custPendingImage) renderCustAttachPreview();
  const nextBox=$('dkChatBox');
  if(nextBox&&wasNearBottom) nextBox.scrollTop=nextBox.scrollHeight;
  if(m.status==='completed') renderMatchReviewBox(m.id);
  custBuiltMode='matchRoom:'+m.id;
  renderBottomNav();
  return;
 }
 if(customerViewMode==='matches'){
  if(custBuiltMode!=='matches'){ root.innerHTML=customerMatchesHTML(); custBuiltMode='matches'; }
  renderMatchListInto('dkMatchesList', matchesFor('customer',cust.id).slice().sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt)), 'customer');
  renderBottomNav();
  return;
 }

 if(!file) return;
 if(!CHAT_IMAGE_ACCEPTED.includes(file.type)){ toast('รองรับเฉพาะไฟล์รูปภาพ JPG, PNG หรือ WebP เท่านั้น'); return; }
 if(file.size>CHAT_IMAGE_MAX_BYTES){ toast('รูปภาพต้องมีขนาดไม่เกิน 10 MB'); return; }
 // เก็บ preview (data URL) ไว้แสดงตัวอย่างเฉยๆ แต่ตอนอัปโหลดจริงใช้ไฟล์ต้นฉบับ (ผ่าน compressImageToBlob) เสมอ ไม่ใช้ preview นี้
 try{ riderPendingPortfolioPhoto=await fileToDataURL(file); }catch(e){ toast('ไม่สามารถอ่านไฟล์รูปนี้ได้ ลองรูปอื่น'); return; }
 riderPendingPortfolioFile=file;
 renderRiderPortfolioAdd();
}

async function riderClaim(id){
 const rider=currentRider();
 if(!rider){ toast('กรุณาเข้าสู่ระบบไรเดอร์ก่อนรับงาน'); return; }
 // claim_order() เป็น atomic UPDATE ... WHERE status='PENDING' ฝั่ง server เดียว — กันไรเดอร์ 2 คนรับงานเดียวกันซ้อนกันจริงระดับ DB
 const {data,error}=await sbRider.rpc('claim_order',{p_order_id:id});
 if(error){ toast(error.message||'รับงานไม่สำเร็จ'); return; }
 upsertOrder(data);
 // เหตุการณ์ตรงจากการกดของไรเดอร์เอง — แจ้งเตือนครั้งเดียวแน่นอน ไม่ต้องผ่านระบบ dedup กลาง เพราะ claim_order สำเร็จได้ครั้งเดียวต่องานอยู่แล้ว
 NOTIF_RIDER=loadRiderNotif();
 pushNotification('rider',{title:RIDER_NOTIF_TEXT.CLAIMED,body:'งาน #'+id,orderId:id});
 saveRiderNotif();
 toast('รับงาน '+id+' แล้ว');
 playStatusChime();
}
function myActiveOrder(){

 return DB.orders.find(o=>o.rider&&['ASSIGNED','TO_PICKUP','PICKED_UP','DELIVERING'].includes(o.status)&&

}

async function riderAdvance(id){

 if(error){ toast(error.message||'อัปเดตสถานะไม่สำเร็จ'); return; }
 upsertOrder(data);
 toast('อัปเดตสถานะแล้ว');
 if(data.status==='DONE'){
  NOTIF_RIDER=loadRiderNotif();
  pushNotification('rider',{title:RIDER_NOTIF_TEXT.DONE,body:'งาน #'+id,orderId:id});
  saveRiderNotif();
  playStatusChime();
 }
}
let riderChatSendBusy=false;
// เหมือน customerSendChat ทุกประการ (async จริง, กันกดซ้ำ, สถานะกำลังส่ง, เคลียร์เฉพาะตอนสำเร็จ, ค้นหา element
// ใหม่ทุกครั้งกันหน้าติดตามงานถูก re-render จาก realtime ระหว่างรอ)
async function riderSendChat(id){
 if(riderChatSendBusy) return;
 const v=$('riderChatInput')?$('riderChatInput').value.trim():'';
 if(!v&&!riderPendingImage)return;
 riderChatSendBusy=true;
 if($('riderChatSendBtn')){ $('riderChatSendBtn').disabled=true; $('riderChatSendBtn').textContent='กำลังส่ง...'; }

 if($('attachBtn_riderImgInput')) $('attachBtn_riderImgInput').disabled=true;
 try{
  const ok=await addChat(id,'rider',v,riderPendingImage);
  if(ok){ if($('riderChatInput')) $('riderChatInput').value=''; riderPendingImage=null; renderRiderAttachPreview(); }
 } finally {
  riderChatSendBusy=false;
  if($('riderChatSendBtn')){ $('riderChatSendBtn').disabled=false; $('riderChatSendBtn').textContent='ส่ง'; }
  if($('riderChatInput')) $('riderChatInput').disabled=false;
  if($('attachBtn_riderImgInput')) $('attachBtn_riderImgInput').disabled=false;
 }
}

  upsertMatch(data);

 } finally { riderMatchActionBusy=false; }

}
function renderRiderAuthState(){
 const authCard=$('riderAuthCard'), appBox=$('riderAppBox');
 if(!authCard||!appBox) return;
 if(currentRider()){
  authCard.classList.add('hidden'); authCard.innerHTML='';
  appBox.classList.remove('hidden');
 }else{
  appBox.classList.add('hidden');
  authCard.classList.remove('hidden');
  // เก็บค่าที่พิมพ์ค้างไว้ก่อน rebuild (เช่นตอนเลือกรูปโปรไฟล์ระหว่างกรอกฟอร์ม) กันข้อมูลหาย
  const keep={};
  ['riderSignupName','riderSignupPhone','riderSignupPassword','riderSignupPassword2','riderLoginPhone','riderLoginPassword'].forEach(id=>{ if($(id)) keep[id]=$(id).value; });
  authCard.innerHTML=riderAuthFormHTML();
  Object.keys(keep).forEach(id=>{ if($(id)) $(id).value=keep[id]; });
 }
}
// เฟส Match Marketplace: เนื้อหาหลักของแอปไรเดอร์ทั้งหมดตอนนี้สลับตามแท็บ (riderViewMode) — ต่างจาก
// renderRiderAuthState (สลับแค่การ์ดล็อกอิน/แอป) โครงสร้างเดียวกับ renderCustomerRoot ฝั่งลูกค้า
function renderRiderMain(){
 const main=$('riderMain'); if(!main) return;
 const rider=currentRider(); if(!rider) return;
 if(riderViewMode==='matchRoom'){
  const m=findMatch(riderViewingMatchId);
  if(!m||m.providerId!==rider.id){ main.innerHTML=`<div class="dk-card"><button type="button" class="dk-btn outline" style="max-width:100px;margin-bottom:12px" onclick="riderNavGo('matches')">${ICON_ARROWLEFT}&nbsp;กลับ</button><div class="dk-empty">ไม่พบ MATCH นี้ หรือคุณไม่มีสิทธิ์เข้าถึง</div></div>`; riderBuiltMode=null; return; }
  const savedVal=$('dkRiderChatInput')?$('dkRiderChatInput').value:'';
  const prevBox=$('dkChatBox');
  const wasNearBottom=prevBox?(prevBox.scrollHeight-prevBox.scrollTop-prevBox.clientHeight<80):true;
  main.innerHTML=matchRoomHTML(m,'rider',getMatchCustomerDisplay(m.customerId));
  if($('dkRiderChatInput')) $('dkRiderChatInput').value=savedVal;
  if(riderPendingImage) renderRiderAttachPreview();
  const nextBox=$('dkChatBox');
  if(nextBox&&wasNearBottom) nextBox.scrollTop=nextBox.scrollHeight;
  riderBuiltMode='matchRoom:'+m.id;
  return;
 }
 if(riderViewMode==='matches'){
  if(riderBuiltMode!=='matches'){ main.innerHTML=riderMatchesTabHTML(); riderBuiltMode='matches'; }
  renderMatchListInto('dkRiderMatchesList', matchesFor('rider',rider.id).filter(m=>m.status==='pending').slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)), 'rider');
  return;
 }
 if(riderViewMode==='active'){
  if(riderBuiltMode!=='active'){ main.innerHTML=riderActiveTabHTML(); riderBuiltMode='active'; }
  renderMatchListInto('dkRiderActiveList', matchesFor('rider',rider.id).filter(m=>['accepted','active'].includes(m.status)).slice().sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt)), 'rider');
  return;
 }
 if(riderViewMode==='history'){
  if(riderBuiltMode!=='history'){ main.innerHTML=riderHistoryTabHTML(); riderBuiltMode='history'; }
  renderMatchListInto('dkRiderHistoryList', matchesFor('rider',rider.id).filter(m=>['completed','declined','cancelled'].includes(m.status)).slice().sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt)), 'rider');
  return;
 }
 // 'profile' — รวมโปรไฟล์/สถานะพร้อมรับ MATCH/ผลงาน/เครดิต/ระบบรับงานเดิม (พับเก็บ)
 if(riderBuiltMode!=='profile'){ main.innerHTML=riderProfileTabHTML(); riderBuiltMode='profile'; }
 renderRiderProfileCard();
 const params=new URLSearchParams(location.search);
 renderRiderInvite(params.get('order'));
 renderRiderJobRoom();
 renderRiderMyJob();
 renderRiderCreditCard();
 if(!riderPortfolioLoaded){ riderPortfolioLoaded=true; renderRiderPortfolioCard(); } // โหลดผลงานครั้งเดียวต่อ session ล็อกอิน (เพิ่ม/ลบ/แก้ไขเรียก render ของตัวเองอยู่แล้ว ไม่ต้องโหลดซ้ำทุกครั้งที่ realtime ยิง)
}
function renderRiderRoot(){
 const root=$('riderRoot'); if(!root)return;
 if(!riderBuilt){ root.innerHTML=riderRootHTML(); riderBuilt=true; }
 renderRiderAuthState();
 if(!currentRider()){ renderBottomNav(); return; } // ยังไม่ล็อกอิน — ไม่ต้องเรนเดอร์เนื้อหาแท็บใด ๆ
 renderRiderMain();
 renderBottomNav();
}
let riderPortfolioLoaded=false;

/* ======================= ROLE / ROUTER ======================= */
// เฟส Match Marketplace: Bottom Navigation ใช้ร่วมกันทั้งลูกค้า/ผู้ให้บริการ (มือถือเท่านั้น — เดสก์ท็อปใช้
// customerNavTabsHTML/riderNavTabsHTML ที่ฝังอยู่ในตัวเนื้อหาแต่ละหน้าแทน ดู .dk-bottomnav/.dk-navtabs-desktop
// ใน CSS) อ่าน currentNotifRole() ตัวเดียวกับที่ระบบแจ้งเตือนใช้อยู่แล้ว เพื่อตัดสินว่าตอนนี้ควรโชว์แท็บของใคร
function renderBottomNav(){
 const nav=$('dkBottomNav'); if(!nav) return;
 const role=currentNotifRole();
 if(role==='customer'){
  const cust=currentCustomer();
  if(!cust){ nav.classList.add('hidden'); nav.innerHTML=''; return; }
  nav.classList.remove('hidden');
  const active=customerActiveTabKey();
  nav.innerHTML=CUSTOMER_TABS.map(t=>`<button type="button" class="bnitem${active===t.key?' active':''}" onclick="customerNavGo('${t.key}')">${t.icon}<span>${t.label}</span></button>`).join('');
 }else if(role==='rider'){
  const rider=currentRider();
  if(!rider){ nav.classList.add('hidden'); nav.innerHTML=''; return; }
  nav.classList.remove('hidden');
  const active=riderActiveTabKey();
  nav.innerHTML=RIDER_TABS.map(t=>`<button type="button" class="bnitem${active===t.key?' active':''}" onclick="riderNavGo('${t.key}')">${t.icon}<span>${t.label}</span></button>`).join('');
 }else{
  nav.classList.add('hidden'); nav.innerHTML='';
 }
}
function setRole(role){
 document.querySelectorAll('.role').forEach(b=>b.classList.toggle('active',b.dataset.role===role));
 ['admin','customer','rider'].forEach(r=>$(r+'View').classList.toggle('hidden',r!==role));
 if(role==='admin'){ $('heroTitle').textContent='จัดการงานรับหิ้ว';$('heroText').textContent='ดูงานทั้งหมดแบบเรียลไทม์ กรอง ค้นหา และดูรายละเอียดทุกจุดรับ-ส่ง'}
 if(role==='customer'){ $('heroTitle').textContent='เด็กเดิน (Dekdein)';$('heroText').textContent='เลือกผู้ให้บริการที่ถูกใจ กด MATCH คุยรายละเอียด ตกลงราคา แล้วเริ่มงานได้ทันที'}
 if(role==='rider'){ $('heroTitle').textContent='แอปผู้ให้บริการ';$('heroText').textContent='รับคำขอ MATCH ใหม่ คุยรายละเอียดกับลูกค้า เสนอราคา และอัปเดตความคืบหน้างานได้ในที่เดียว'}
 // เฟส "รื้อ Frontend ใหม่ตาม Reference": Customer Flow หลัก (ลูกค้า/ผู้ให้บริการ) ใช้หัวเว็บแบบสะอาด ไม่มีแบนเนอร์
 // ไล่สีกรมท่า/ปุ่ม dev เช่นสลับ role หรือทดสอบเสียงปนอยู่ — เฉพาะแอดมินเท่านั้นที่ยังเห็นหัวเว็บ/แบนเนอร์แบบเดิม
 const dkMode=(role==='customer'||role==='rider');
 if($('appTopBar')) $('appTopBar').classList.toggle('dk-mode',dkMode);
 if($('heroSection')) $('heroSection').classList.toggle('hidden',dkMode);
 if($('notifPanel')) $('notifPanel').classList.add('hidden');
 renderBellBadge();
 renderBottomNav();
}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.role));

/* ======================= BOOT ======================= */
function boot(){
 // เฟส 2: ไม่ auto-seed บัญชีแอดมินจาก localStorage อีกต่อไป (ดูคอมเมนต์ที่ ensureDefaultAdminSeeded ด้านบน)
 // บัญชีแอดมินเริ่มต้น admin/admin1234 ถูกสร้างไว้ในฝั่ง Supabase ล่วงหน้าแล้ว
 $('adminRoot').innerHTML=adminRootHTML();
 addStopTo('adminStops',{pickup:'ร้าน A'}); addStopTo('adminStops',{pickup:'ร้าน B'});
 $('rateBase').value=DB.rates.base; $('ratePerStop').value=DB.rates.perStop; $('rateKm').value=DB.rates.km; $('rateCommission').value=DB.rates.commission; $('rateNote').value=DB.rates.note;
 renderAdminEstimate(); renderAdminList();
 renderAdminAuthState(); // ต้อง login แอดมินก่อนถึงจะเห็นเนื้อหาแอดมินจริง

 renderCustomerRoot();
 renderRiderRoot();

 // หมายเหตุ (เฟส 3): ไม่เรียก ensureNotifBaseline() ตรงนี้อีกต่อไป เพราะ DB.orders ยังว่างเปล่า (ยังไม่ทัน sync
 // จริงจาก Supabase) — ensureNotifBaseline() ถูกเรียกจาก activateRoleSync() แทน หลังโหลดข้อมูลจริงเสร็จแล้วเท่านั้น
 checkForNotifiableEvents(); // seed baseline ต่อออเดอร์/แชทที่กำลังดูอยู่ตอนเปิดหน้า (ทำงานได้แม้ DB.orders ยังว่าง)
 renderSoundButton();
 renderBellBadge();

 dbListeners.push(()=>renderAdminList());
 dbListeners.push(()=>renderCustomerRoot());
 dbListeners.push(()=>{renderRiderJobRoom();renderRiderMyJob();});
 dbListeners.push(()=>renderRiderMain()); // เฟส Match Marketplace: อัปเดตแท็บ Match ใหม่/กำลังดำเนินการ/ประวัติงาน/ห้องแชท MATCH แบบสดผ่าน realtime เดียวกับออเดอร์
 dbListeners.push(()=>checkForNotifiableEvents());
 dbListeners.push(()=>{renderRiderCreditCard();renderAdminCreditList();}); // เครดิต/เครดิตการชำระเงินอัปเดตสดผ่าน realtime เดียวกับออเดอร์
 dbListeners.push(()=>renderBottomNav()); // ป้าย/สถานะที่ Bottom Nav อาจต้องสะท้อนข้อมูลใหม่ (เช่นสถานะ MATCH เปลี่ยน)

 // เมื่อโปรไฟล์ไรเดอร์เปลี่ยน (ชื่อ/รูป) จากแท็บใดก็ตาม ต้องอัปเดตทุกหน้าที่แสดงชื่อ/รูปไรเดอร์ทันที
 riderStoreListeners.push(()=>{ renderAdminList(); renderCustomerRoot(); renderRiderRoot(); if(adminTab==='users') renderAdminUsersList(); });
 customerStoreListeners.push(()=>{ renderCustomerRoot(); if(adminTab==='users') renderAdminUsersList(); });
 adminStoreListeners.push(()=>{ if(adminTab==='users') renderAdminUsersList(); });

 notifListeners.push(()=>{
  renderBellBadge();
  const panel=$('notifPanel');
  if(panel&&!panel.classList.contains('hidden')) renderNotifPanel();
 });

 const params=new URLSearchParams(location.search);
 const initial=params.get('view')||'admin';
 setRole(['admin','customer','rider'].includes(initial)?initial:'admin');

 // เฟส 3: ถ้ามี session ค้างอยู่แล้ว (เปิดหน้าเว็บซ้ำโดยไม่ต้อง login ใหม่) ให้เชื่อม sync+realtime ทันที
 // ต่อ role นั้น ๆ โดยไม่ต้องรอกด login/สมัครอีกครั้ง
 if(currentCustomer()) activateRoleSync('customer');
 if(currentRider()) activateRoleSync('rider');
 if(currentAdmin()) activateRoleSync('admin');

 if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
 }
}
boot();
</script>
</body></html>
