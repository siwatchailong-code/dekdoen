<title>เด็กเดิน (Dekdein) — แพลตฟอร์ม Match ผู้ให้บริการ</title>
<style>
:root{
 --navy:#0b2f55;--blue:#1769b0;--blue2:#0f548f;--yellow:#f4c542;--bg:#f5f7fa;
 --card:#fff;--line:#dfe7f0;--text:#172334;--muted:#6d7b8c;--green:#17945b;--red:#d64545;
 /* ---------- Dekdein Match Marketplace: โทนสีใหม่ (ส้มเป็นสีหลัก) ----------
    ใช้เฉพาะกับ UI ใหม่ของฝั่งลูกค้า/ผู้ให้บริการ (ค้นหา/โปรไฟล์/MATCH/แชท/รีวิว) เท่านั้น — ไม่แตะ
    ตัวแปร --navy/--blue เดิมที่หน้า Admin และระบบออเดอร์เดิมยังใช้อยู่ กันไม่ให้ดีไซน์ใหม่ไปกระทบ
    ส่วนที่ไม่ได้ขอให้ปรับ */
 --brand:#ff7a1a;--brand-dark:#e2650a;--brand-light:#fff1e6;--brand-line:#ffd9b8;
 --ink:#1c1610;--ink-soft:#7a6f63;--surface:#fffaf6;--radius-lg:20px;--radius-md:14px;
}
*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",Arial,sans-serif;overflow-wrap:break-word;word-break:break-word}
button,input,textarea{font:inherit}button{cursor:pointer}
.top{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;box-shadow:0 5px 18px #08284a22;flex-wrap:wrap;row-gap:10px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff}.brand b{font-size:22px}.brand small{display:block;font-size:11px;color:#b9d0e8;margin-top:2px}
.headerRight{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roles{display:flex;gap:7px}.role{border:1px solid #ffffff2e;background:#ffffff10;color:#dcecff;border-radius:12px;padding:10px 14px;font-weight:800}.role.active{background:var(--yellow);color:#4d3a00;border-color:var(--yellow)}
.icon-btn{background:#ffffff14;border:1px solid #ffffff2e;color:#fff;border-radius:12px;width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;font-size:18px;position:relative}
.icon-btn.muted{opacity:.55}
.notif-wrap{position:relative}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 4px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
.notif-panel{position:absolute;top:52px;right:0;width:320px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 15px 40px #0004;z-index:60;color:var(--text)}
.notif-panel .nph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0}
.notif-panel .nph b{font-size:13px}
.notif-panel .nph button{border:0;background:none;color:var(--blue);font-size:11px;font-weight:800;cursor:pointer}
.notif-item{padding:11px 14px;border-bottom:1px solid #f0f3f7;font-size:12px;cursor:pointer}
.notif-item:last-child{border-bottom:0}
.notif-item.unread{background:#f4f9ff}
.notif-item .ntitle{font-weight:900;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.notif-item .ntitle .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.notif-item .nbody{color:var(--muted)}
.notif-item .ntime{font-size:10px;color:#9fb0c2;margin-top:3px}
.notif-empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:850px){.notif-panel{position:fixed;top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:60vh}}
.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}
.hero{background:linear-gradient(135deg,#0b3a70,#1470cc);color:#fff;border-radius:18px;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;box-shadow:0 10px 26px rgba(10,47,85,.10)}
.hero h1{margin:0 0 6px;font-size:29px}.hero p{margin:0;color:#d8eaff;line-height:1.5;font-size:14px}.hero .pill{background:#ffffff18;border:1px solid #ffffff2b;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:800;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.8fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 5px 20px rgba(24,60,100,.07);margin-bottom:18px}.card h2{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
label{font-size:12px;font-weight:800;color:#556579;display:block;margin:0 0 6px}.field{margin-bottom:13px}input,textarea,select{width:100%;border:1px solid #d5e0eb;background:#fbfdff;border-radius:12px;padding:12px 13px;outline:none;max-width:100%}input:focus,textarea:focus,select:focus{border-color:#5b9ee4;box-shadow:0 0 0 3px #1268c414}textarea{min-height:86px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900}.primary{background:var(--blue);color:#fff}.yellow{background:var(--yellow);color:#4d3a00}.ghost{background:#eef4fa;color:#31506f}.green{background:var(--green);color:#fff}.danger{background:#fff0f0;color:var(--red)}
.btn:disabled,button:disabled,input:disabled{opacity:.55;cursor:not-allowed}
.stop{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:#fcfdff}.stophead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:900;font-size:13px}.stoptitle{font-weight:900;flex:1}.stoptools{display:flex;gap:5px}.stoptools button{border:0;border-radius:8px;padding:6px 8px;background:#eef3f8;color:#607084;font-size:11px;display:grid;place-items:center}.stoptools button[disabled]{opacity:.35;cursor:not-allowed}
.loc-fields{margin:10px 0}.loc-field{margin-bottom:10px;position:relative}
.loc-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#f7faff}
.loc-chip-text{min-width:0}.loc-chip-name{font-weight:900;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-chip-sub{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-clear-btn{border:0;background:#eef3f8;color:#607084;border-radius:8px;padding:7px;flex:0 0 auto;display:grid;place-items:center}
.waypoint-row{display:flex;align-items:flex-start;gap:8px}.waypoint-row .loc-field{flex:1}
.waypoint-remove{padding:8px;margin-top:22px;flex:0 0 auto;display:grid;place-items:center}
.add-waypoint-btn{width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.place-sugg{position:absolute;left:0;right:0;top:100%;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:240px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.place-sugg-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f0f3f7}.place-sugg-item:last-child{border-bottom:0}.place-sugg-item:hover{background:#f4f9ff}
.place-sugg-main{font-weight:800;font-size:13px;color:var(--text)}.place-sugg-sub{font-size:11px;color:var(--muted);margin-top:2px}.place-sugg-empty{padding:12px;color:var(--muted);font-size:12px}
.jobmap-wrap{margin:10px 0}.jobmap{height:230px;border-radius:15px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(24,60,100,.06);overflow:hidden;background:#eef2f6}.jobmap-info{font-size:12px;color:var(--muted);margin-top:8px}
.map{height:180px;border-radius:15px;position:relative;overflow:hidden;border:1px solid #cbd8e6;background:
linear-gradient(24deg,transparent 47%,#fff 48%,#fff 49%,transparent 50%),
linear-gradient(155deg,transparent 45%,#fff 46%,#fff 48%,transparent 49%),
linear-gradient(90deg,#e7eef3 1px,transparent 1px),linear-gradient(#e7eef3 1px,transparent 1px);
background-size:auto,auto,38px 38px,38px 38px;background-color:#dfe9ee;margin:10px 0}
.map .searchbox{position:absolute;top:10px;left:10px;right:100px;background:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 3px 12px #0002;color:#7b8795;font-size:12px}.map .maplabel{position:absolute;right:10px;top:10px;background:#fff;border-radius:9px;padding:8px 10px;font-size:10px;color:#5d6d7f;box-shadow:0 2px 8px #0001}
.pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;background:var(--blue);border:3px solid #fff;transform:translate(-50%,-90%) rotate(-45deg);box-shadow:0 4px 10px #0003;touch-action:none}.pin:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:9px;top:9px}
.route{position:absolute;height:5px;background:#1268c4;transform-origin:left center;border-radius:5px;opacity:.9}.mapnote{position:absolute;bottom:10px;left:10px;background:#ffffffdd;border-radius:9px;padding:7px 9px;font-size:10px;color:#526477}
.photo{border:1.5px dashed #b8cce0;border-radius:12px;padding:13px;text-align:center;color:var(--blue);background:#f8fbff;font-size:12px;cursor:pointer;transition:.18s}.photo:hover{border-color:var(--blue);background:#f3f8fd}.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.thumb{position:relative;width:64px;height:64px}.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block}.thumb-remove{position:absolute;right:-5px;top:-5px;width:19px;height:19px;border:0;border-radius:50%;background:#fff;color:#8a2631;box-shadow:0 2px 8px #0002;cursor:pointer;font-size:12px;line-height:19px;padding:0}.photo-hint{margin-top:6px;font-size:10px;color:#7a8a9b}
.summary{position:sticky;top:92px}.pricebox{background:#eef6ff;border-radius:15px;padding:15px;margin:12px 0}.pricebig{font-size:32px;font-weight:900;color:var(--blue)}.line{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font-size:13px}.line.total{padding-top:12px;border-top:1px solid #cfddea;font-weight:900;font-size:16px}.status{display:inline-flex;align-items:center;gap:6px;background:#eaf8f1;color:#21734c;border:1px solid #cce9d9;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:#22a464}
.linkbox{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:11px;word-break:break-all;color:#526174}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #cbd7e3;border-radius:14px;background:#fafcff}
.rider-stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f5}.rider-stop:last-child{border-bottom:0}.rnum{width:38px;height:38px;border-radius:12px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.tag{display:inline-block;font-size:10px;padding:5px 8px;border-radius:8px;background:#f1f5f8;color:#627184;margin-top:5px}
.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#15283d;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #0003;display:none;z-index:50;font-size:13px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.badge.st-PENDING{background:#fff4e0;color:#9a6400}.badge.st-ASSIGNED{background:#eaf2ff;color:#1a4fa0}.badge.st-TO_PICKUP{background:#eef0ff;color:#4b3fa8}.badge.st-DELIVERING{background:#e8f7ff;color:#0d6b9c}.badge.st-DONE{background:#eaf8f1;color:#17945b}.badge.st-CANCELLED{background:#fdeaea;color:#b02a2a}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#f3f7fb;color:#4c5c70;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:800}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.searchbar{display:flex;gap:8px;margin-bottom:14px}.searchbar input{flex:1}
.jobhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.jobmini{font-size:12px;color:var(--muted);margin:3px 0}
.chatbox{border:1px solid var(--line);border-radius:14px;padding:12px;height:680px;max-height:680px;overflow-y:auto;background:#f8fafc;margin-bottom:10px;scroll-behavior:smooth}
@media(max-width:1050px){.chatbox{height:480px;max-height:480px}}
@media(max-width:600px){.chatbox{height:400px;max-height:400px}}
.chatmsg{max-width:80%;padding:8px 11px;border-radius:12px;margin:6px 0;font-size:13px;word-break:break-word;overflow-wrap:anywhere}.chatmsg.me{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:3px}.chatmsg.other{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.chatmsg .who{font-size:10px;opacity:.85;margin-bottom:4px;font-weight:800;display:flex;align-items:center;gap:5px}
.chatmsg .who .whorole{background:#ffffff30;border-radius:6px;padding:1px 6px;font-size:9px;font-weight:900}
.chatmsg.other .who .whorole{background:#eef3f8;color:#5a6c80}
.chatmsg .who .whotime{margin-left:auto;opacity:.85;font-weight:600;white-space:nowrap}
.chat-partner{display:flex;align-items:center;gap:9px;margin-bottom:10px;background:#f4f9ff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.chat-partner b{font-size:13px}.chat-partner .tag{margin-top:2px}
.chatimg{display:block;max-width:220px;max-height:260px;width:auto;height:auto;border-radius:10px;cursor:zoom-in;margin-bottom:6px}
@media(max-width:600px){.chatimg{max-width:170px;max-height:200px}}
.chatrow{display:flex;gap:8px;align-items:flex-end}
.chatrow input{flex:1;min-width:0}
.chat-attach-btn{padding:11px 12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chat-attach-preview{margin-bottom:8px}
.attach-chip{display:inline-flex;align-items:center;gap:8px;background:#eef4fa;border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}
.attach-chip img{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block}
.attach-chip .attach-remove{border:0;border-radius:50%;width:22px;height:22px;background:#fff;color:#8a2631;box-shadow:0 2px 8px #0002;cursor:pointer;font-size:13px;line-height:22px;padding:0}
.lightbox{position:fixed;inset:0;background:rgba(9,20,34,.9);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px #0008}
.collapse{border:1px dashed #b8cce0;border-radius:14px;background:#fbfdff}.collapse>summary{cursor:pointer;padding:14px;font-weight:900;color:var(--blue);list-style:none}.collapse>summary::-webkit-details-marker{display:none}.collapse[open]>summary{border-bottom:1px solid var(--line)}.collapse .inner{padding:14px}
.timeline{margin:10px 0}.tlrow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12px;color:#526174}.tlrow b{color:var(--text)}
.stopview{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fcfdff}.stopview .sline{font-size:13px;margin:3px 0}
.miniphoto{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);margin-right:4px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #b9c8d8;display:inline-grid;place-items:center;font-weight:900;cursor:pointer;color:#8aa0b6;margin-left:8px}
.check.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Platform v2: nav, rider directory/profile, portfolio, availability, timeline ---------- */
.navtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:#eef2f7;border-radius:14px;padding:5px}
.navtab{border:0;background:transparent;color:#5c6c7f;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}
.navtab.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(24,60,100,.10)}
.navtab svg{flex:0 0 auto}
.jobmap-placeholder{font-size:12px;color:var(--muted);padding:2px 2px 10px;display:flex;align-items:center;gap:6px}
.avail-switch{display:flex;align-items:center;gap:10px;background:#f4f9ff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.avail-switch .swlabel{flex:1}
.avail-switch .swlabel b{display:block;font-size:13px}
.avail-switch .swlabel small{color:var(--muted);font-size:11px}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:#cfd8e2;border-radius:999px;transition:.18s;cursor:pointer}
.switch .slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.switch input:disabled+.slider{opacity:.5;cursor:not-allowed}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat-box{background:#f7faff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat-box .snum{font-size:20px;font-weight:900;color:var(--navy)}
.stat-box .slabel{font-size:11px;color:var(--muted);margin-top:3px}
@media(max-width:600px){.stat-grid{grid-template-columns:repeat(3,1fr);gap:6px}.stat-box{padding:8px}.stat-box .snum{font-size:16px}}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;color:#4c5c70;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip-search{flex:1;min-width:160px}
.rider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rider-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;box-shadow:0 3px 12px rgba(24,60,100,.05);cursor:pointer;transition:.15s}
.rider-card:hover{box-shadow:0 8px 22px rgba(24,60,100,.12);transform:translateY(-1px)}
.rider-card .rchead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rider-card .rcname{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avail-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:900}
.avail-pill.st-open{background:#eaf8f1;color:#17945b}
.avail-pill.st-busy{background:#fff4e0;color:#9a6400}
.avail-pill.st-closed{background:#f1f3f6;color:#6d7b8c}
.avail-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.rider-card .rcarea{font-size:11.5px;color:var(--muted);margin:6px 0;display:flex;align-items:center;gap:5px}
.rider-card .rcstats{font-size:11px;color:#607084;display:flex;gap:10px;margin-top:8px}
.portfolio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:640px){.portfolio-grid{grid-template-columns:repeat(4,1fr)}}
.portfolio-item{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:1/1;background:#eef2f6;cursor:pointer}
.portfolio-item img{width:100%;height:100%;object-fit:cover;display:block}
.portfolio-item .pcap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(9,20,34,.75),transparent);color:#fff;font-size:10.5px;padding:14px 8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.portfolio-item .premove{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:24px;height:24px;background:#fff;color:#8a2631;box-shadow:0 2px 8px #0003;font-size:13px;line-height:24px;padding:0}
.portfolio-move{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;gap:4px}
.portfolio-move button{border:0;border-radius:50%;width:22px;height:22px;background:#fff;color:#31506f;box-shadow:0 2px 8px #0003;display:grid;place-items:center;padding:0}
.portfolio-move button[disabled]{opacity:.4;cursor:not-allowed}
.portfolio-add{border:1.5px dashed #b8cce0;border-radius:13px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--blue);background:#f8fbff;font-size:11px;text-align:center;cursor:pointer}
.direct-rider-banner{display:flex;align-items:center;gap:12px;background:#eef6ff;border:1px solid #cfe3fb;border-radius:14px;padding:12px 14px;margin-bottom:16px}
.direct-rider-banner .drtext{flex:1;font-size:12.5px}
.direct-rider-banner .drtext b{display:block;font-size:14px;color:var(--navy)}
.order-card{border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;background:#fff;cursor:pointer;transition:.15s}
.order-card:hover{box-shadow:0 6px 18px rgba(24,60,100,.08)}
.order-card .ochead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero-cta .btn{padding:13px 18px;font-size:13px}
.lightbox-close{position:absolute;top:18px;right:22px;color:#fff;background:#ffffff26;border:0;border-radius:50%;width:38px;height:38px;font-size:18px}

/* ==================================================================================
   Dekdein Match Marketplace — ดีไซน์ใหม่ (ส้มเป็นสีหลัก, การ์ดขาว, เส้นขอบบาง, เงานุ่ม, มินิมอล)
   ใช้กับ: หน้าแรกลูกค้า (ค้นหาผู้ให้บริการ), โปรไฟล์ผู้ให้บริการ, MATCH, ห้องแชท/ข้อเสนอราคา, รีวิว,
   หน้าโปรไฟล์ลูกค้า, ส่วนของผู้ให้บริการ (Match ใหม่/กำลังดำเนินการ/ประวัติงาน/โปรไฟล์) และ Bottom Navigation
   ================================================================================== */
.dk-shell{max-width:1180px;margin:0 auto}
.dk-card{background:var(--surface);border:1px solid var(--brand-line);border-radius:var(--radius-lg);padding:20px;box-shadow:0 4px 18px rgba(226,101,10,.06);margin-bottom:16px}
.dk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dk-head h2{margin:0;font-size:18px;color:var(--ink)}
.dk-head .dk-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.dk-search-row{display:flex;gap:8px;margin-bottom:12px}
.dk-search-row input{flex:1;border:1px solid var(--brand-line);background:#fff;border-radius:var(--radius-md);padding:13px 15px;outline:none;font-size:13.5px}
.dk-search-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.dk-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.dk-chip{border:1px solid var(--brand-line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.dk-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.dk-provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dk-pcard{border:1px solid var(--brand-line);border-radius:var(--radius-lg);padding:16px;background:#fff;box-shadow:0 3px 14px rgba(28,22,16,.05);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.dk-pcard:hover{box-shadow:0 10px 26px rgba(226,101,10,.12);transform:translateY(-2px)}
.dk-pchead{display:flex;align-items:flex-start;gap:10px}
.dk-pcname{font-weight:900;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-pcsub{font-size:11px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-startprice{font-size:13px;color:var(--ink);font-weight:800}
.dk-startprice b{color:var(--brand-dark);font-size:14.5px}
.dk-startprice.muted{color:var(--ink-soft);font-weight:600;font-size:12px}
.dk-rating-sep{color:var(--brand-line);margin:0 1px;flex-shrink:0}
/* บั๊กที่แก้: การ์ดผู้ให้บริการการ์ดแคบ (2 คอลัมน์บนมือถือ) เดิมทำให้ตัวเลขคะแนน/จำนวนรีวิวถูกบีบจน "4.9" และ
   "รีวิว" ขึ้นบรรทัดใหม่ทีละตัวอักษร เพราะ *{min-width:0} (กฎกลางของทั้งไฟล์) ไปลบ min-width:auto เริ่มต้นของ
   flex item ออก รวมกับ body{word-break:break-word} ทำให้ข้อความตัวเลข/คำสั้น ๆ ที่ไม่ควรตัดถูกตัดกลางคำ — ส่วนที่
   ควรอยู่บรรทัดเดียวเสมอ (ดาว/คะแนน/จำนวนรีวิว) ต้องปักเป็น white-space:nowrap+flex-shrink:0 ไว้ชัดเจน แล้วให้
   เฉพาะพื้นที่ (ระยะทาง/ที่อยู่คร่าว ๆ) เป็นส่วนที่ยืดหด+ตัดด้วย … แทน (มี overflow:hidden/text-overflow:ellipsis
   อยู่แล้ว แต่ต้องมี flex:1;min-width:0 กำกับชัดเจน ไม่งั้นบีบตัวเลขข้าง ๆ แทน) */
.dk-rating-num{white-space:nowrap;flex-shrink:0}
.dk-norating{color:var(--ink-soft);font-weight:600}
.dk-area-inline{display:inline-flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;margin-left:auto;min-width:0}
/* ไอคอนหมุดต้องไม่ถูกบีบหายเมื่อชื่อพื้นที่ยาว (เป็น flex item ที่ *{min-width:0} ทำให้ย่อได้ถึง 0) */
.dk-area-inline svg{flex-shrink:0}
/* ---------- โครงการ์ดผู้ให้บริการตาม Reference: อวตารซ้าย เนื้อหาทั้งหมดไหลเป็นคอลัมน์ทางขวาของอวตาร
   สถานะเป็นจุดสี+ข้อความบางมุมขวาบน ปุ่มสองปุ่มเต็มความกว้างการ์ดด้านล่าง ---------- */
.dk-pcbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dk-pctop{display:flex;align-items:flex-start;gap:8px}
.dk-pctop .dk-pcname{flex:1;min-width:0}
.dk-onstatus{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;white-space:nowrap;flex-shrink:0;margin-top:1px}
.dk-onstatus i{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.dk-onstatus.st-available{color:#178a4c}
.dk-onstatus.st-busy{color:#c8880e}
.dk-onstatus.st-offline{color:#9a8f83}
/* ---------- แถวแนะนำแบบเลื่อนแนวนอนตาม Reference ("คนที่เหมาะกับคุณ") ---------- */
.dk-hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dk-hscroll::-webkit-scrollbar{display:none}
.dk-mini{flex:0 0 108px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid var(--brand-line);border-radius:16px;padding:12px 8px;cursor:pointer;font-family:inherit;text-align:center}
.dk-mini-av{position:relative;display:inline-block;line-height:0}
.dk-mini-dot{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.dk-mini-dot.st-available{background:#22a35c}.dk-mini-dot.st-busy{background:#e2a20a}.dk-mini-dot.st-offline{background:#b3a89c}
.dk-mini-name{font-size:12.5px;font-weight:900;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-mini-sub{font-size:10.5px;color:var(--ink-soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-mini-rate{font-size:11px;font-weight:800;color:var(--ink)}
/* ---------- หัวข้อ section แบบ Reference: ชื่อหมวดหนา + ตัวนับ/ลิงก์ทางขวา ---------- */
.dk-sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 0 9px}
.dk-sechead h3{margin:0;font-size:14.5px;font-weight:900;color:var(--ink)}
.dk-sechead span{font-size:11.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
/* บรรทัดข้อมูลใต้ชื่อคู่สนทนาในหัวห้องแชท ตาม Reference (ราคา + สถานะอยู่บรรทัดเดียวกันใต้ชื่อ) */
.dk-chathead-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:11.5px;color:var(--ink-soft)}
.dk-chathead-meta b{color:var(--brand-dark);font-weight:900;font-size:12px}
/* ---------- รายการขั้นตอน MATCH (เติมพื้นที่ว่างตอนรอตอบรับ) ---------- */
.dk-steps{margin-top:16px;border-top:1px solid var(--brand-line);padding-top:16px}
.dk-step{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.dk-step-dot{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--brand-light);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900}
.dk-step.done .dk-step-dot{background:var(--brand);color:#fff}
.dk-step b{display:block;font-size:12.5px;color:var(--ink);font-weight:800}
.dk-step span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.5}
.dk-step.done b{color:var(--brand-dark)}
/* ---------- รายการผลงานตาม Reference: รูปย่อสี่เหลี่ยมมนซ้าย + ชื่อผลงาน + วันที่ ---------- */
.dk-worklist{display:flex;flex-direction:column;gap:2px}
.dk-work{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--brand-line);cursor:pointer}
.dk-work:last-child{border-bottom:0}
.dk-work img{width:60px;height:60px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--brand-light)}
.dk-work-text{min-width:0}
.dk-work-text b{display:block;font-size:13px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-work-text span{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px}
.dk-status{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:900}
.dk-status.st-available{background:#e9f9ef;color:#178a4c}
.dk-status.st-busy{background:#fff4e0;color:#a06a00}
.dk-status.st-offline{background:#f1f1ef;color:#83786c}
.dk-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.dk-tagrow{display:flex;flex-wrap:wrap;gap:6px}
.dk-tag{background:var(--brand-light);color:var(--brand-dark);border-radius:8px;padding:4px 9px;font-size:10.5px;font-weight:800}
.dk-rating{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft)}
.dk-rating b{color:var(--ink)}
.dk-star{color:#f4a825}
.dk-area{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-pcard-actions{display:flex;gap:8px;margin-top:auto}
.dk-btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;font-size:13px;cursor:pointer;flex:1;text-align:center}
.dk-btn.primary{background:var(--brand);color:#fff}
.dk-btn.primary:disabled{background:#eee0d2;color:#b6a48f;cursor:not-allowed}
.dk-btn.ghost{background:var(--brand-light);color:var(--brand-dark)}
.dk-btn.outline{background:#fff;border:1px solid var(--brand-line);color:var(--ink)}
.dk-btn.danger{background:#fdeceb;color:#c23b2f}
.dk-btn:disabled{opacity:.6;cursor:not-allowed}
.dk-profile-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dk-profile-hero .avt{width:76px;height:76px}
.dk-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.dk-stat{background:var(--brand-light);border-radius:var(--radius-md);padding:12px;text-align:center}
.dk-stat b{display:block;font-size:18px;color:var(--brand-dark)}
.dk-stat span{font-size:10.5px;color:var(--ink-soft)}
.dk-portfolio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:640px){.dk-portfolio-grid{grid-template-columns:repeat(4,1fr)}}
.dk-review{border-bottom:1px solid var(--brand-line);padding:12px 0}
.dk-review:last-child{border-bottom:0}
.dk-review-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.dk-review-stars{color:#f4a825;font-size:13px;letter-spacing:1px}
.dk-review-name{font-weight:800;font-size:12.5px;color:var(--ink)}
.dk-review-time{font-size:10.5px;color:var(--ink-soft)}
.dk-review-comment{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.dk-match-list{display:flex;flex-direction:column;gap:10px}
.dk-match-row{border:1px solid var(--brand-line);border-radius:var(--radius-md);padding:13px 14px;background:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.dk-match-row:hover{box-shadow:0 5px 16px rgba(226,101,10,.08)}
.dk-match-row .mtext{flex:1;min-width:0}
.dk-match-row .mtitle{font-weight:900;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-match-row .mmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-mstatus{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:900;white-space:nowrap;flex:0 0 auto}
.dk-mstatus.st-pending{background:#fff4e0;color:#a06a00}
.dk-mstatus.st-accepted{background:#eaf2ff;color:#1a4fa0}
.dk-mstatus.st-active{background:#e9f9ef;color:#178a4c}
.dk-mstatus.st-completed{background:#eef0f4;color:#4b5768}
.dk-mstatus.st-declined,.dk-mstatus.st-cancelled{background:#fdeceb;color:#c23b2f}
.dk-chatbox{border:1px solid var(--brand-line);border-radius:var(--radius-md);padding:12px;height:480px;max-height:60vh;overflow-y:auto;background:#fffdfa;margin-bottom:10px;scroll-behavior:smooth}
.dk-proposal-card{max-width:78%;background:#fff;border:1.5px solid var(--brand);border-radius:14px;padding:13px 14px;margin:8px 0}
.dk-proposal-card.me{margin-left:auto}
.dk-proposal-card .pptitle{font-size:11px;font-weight:900;color:var(--brand-dark);text-transform:uppercase;letter-spacing:.03em}
.dk-proposal-card .ppprice{font-size:22px;font-weight:900;color:var(--ink);margin:4px 0 8px}
.dk-proposal-card .ppactions{display:flex;gap:8px}
.dk-proposal-card .ppresult{font-size:12px;font-weight:800;padding:6px 0}
.dk-proposal-card .ppresult.accepted{color:#178a4c}
.dk-proposal-card .ppresult.rejected{color:#c23b2f}
.dk-avail-switch{display:flex;align-items:center;gap:10px;background:var(--brand-light);border:1px solid var(--brand-line);border-radius:var(--radius-md);padding:13px 14px;margin:12px 0}
.dk-avail-switch .swlabel{flex:1}
.dk-avail-switch .swlabel b{display:block;font-size:13px;color:var(--ink)}
.dk-avail-switch .swlabel small{color:var(--ink-soft);font-size:11px}
.dk-empty{padding:30px 18px;text-align:center;color:var(--ink-soft);border:1px dashed var(--brand-line);border-radius:var(--radius-md);background:#fffdfa;font-size:13px}
.dk-services-edit{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.dk-service-pick{border:1px solid var(--brand-line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800}
.dk-service-pick.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.dk-stars-picker{display:flex;gap:6px;font-size:30px;color:#e3d9cc;margin:6px 0 12px}
.dk-stars-picker span{cursor:pointer}
.dk-stars-picker span.on{color:#f4a825}

/* ---------- Bottom Navigation (มือถือเป็นหลัก) ---------- */
.dk-bottomnav{display:none}
@media(max-width:850px){
 .dk-bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--brand-line);
  display:flex;box-shadow:0 -4px 18px rgba(28,22,16,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .dk-bottomnav .bnitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink-soft);font-size:10.5px;font-weight:800;padding:6px 2px;border-radius:12px}
 .dk-bottomnav .bnitem.active{color:var(--brand-dark)}
 .dk-bottomnav .bnitem .bnbadge{position:relative}
 .dk-bottomnav .bnitem .bndot{position:absolute;top:-3px;right:-6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
 body{padding-bottom:64px}
 .dk-navtabs-desktop{display:none}
}
@media(min-width:851px){
 .dk-bottomnav{display:none !important}
 /* บั๊กที่แก้: เดิม .dk-navtabs-desktop{display:flex} อยู่นอก media query ทำให้ชนะ .dk-navtabs-desktop{display:none}
    ที่อยู่ใน @media(max-width:850px) เสมอ (ลำดับ source ทับกัน ไม่เกี่ยวกับ media query) ผลคือแท็บเมนูชุดสำหรับ
    จอเดสก์ท็อปไปโผล่ซ้อนอยู่บนมือถือด้วย เปลืองพื้นที่และซ้ำกับ Bottom Nav — ต้องผูก display:flex ไว้ในเงื่อนไข
    จอกว้างเท่านั้น ให้เข้าคู่กับกฎ display:none ที่ตั้งไว้แล้วสำหรับจอแคบ */
 .dk-navtabs-desktop{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:var(--brand-light);border-radius:14px;padding:5px}
}
.dk-navtabs-desktop .navtab{border:0;background:transparent;color:var(--ink-soft);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer}
.dk-navtabs-desktop .navtab.active{background:#fff;color:var(--brand-dark);box-shadow:0 2px 8px rgba(226,101,10,.12)}
/* บั๊กที่แก้: เดิมบังคับ 2 คอลัมน์เสมอที่จอ <=600px ทำให้การ์ดผู้ให้บริการเหลือกว้างจริงแค่ ~155px บนมือถือทั่วไป
   (390px) ไม่พอสำหรับ อวตาร+ชื่อ+ป้ายสถานะในแถวเดียวกัน ทำให้ชื่อผู้ให้บริการถูกบีบจนความกว้างเกือบ 0 (มองไม่เห็น
   เลยจริง ๆ ไม่ใช่แค่ล้น) — ปล่อยให้กฎ auto-fill,minmax(230px,1fr) ที่ตั้งไว้แล้วจัดคอลัมน์เองตามพื้นที่จริงแทน
   (จะได้ 1 คอลัมน์บนมือถือทั่วไป และ 2 คอลัมน์เองอัตโนมัติเมื่อจอกว้างพอจริง ๆ เช่น แท็บเล็ต) */
@media(max-width:600px){.dk-stat-row{gap:6px}.dk-stat{padding:9px}.dk-stat b{font-size:15px}}

/* ---------- โหมดหัวเว็บสำหรับลูกค้า/ผู้ให้บริการ: แถบบนสะอาด โปร่ง ไม่ใช้สีกรมท่าของแอดมิน ไม่มีปุ่ม dev/testing
   (สลับ role, ทดสอบเสียง) ปนอยู่ใน Customer Flow หลัก — ดู setRole() ที่ toggle คลาสนี้ ---------- */
.top.dk-mode{height:58px;padding:0 16px;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--brand-line);border-bottom:1px solid var(--brand-line)}
/* ตาม Reference: หัวเว็บเป็นบรรทัดเดียวสะอาด ๆ — เวิร์ดมาร์กแบรนด์สีส้มซ้าย ไอคอนขวา ไม่มีบรรทัดคำโปรย
   ไม่มีปุ่ม dev ไม่มีแถบสลับ role (ของแอดมินเท่านั้น) */
.top.dk-mode .brand{gap:9px}

/* .collapse (ระบบพับเก็บเดิม) ที่ซ้อนอยู่ในการ์ดดีไซน์ใหม่ (dk-card) ต้องใช้สีส้มของแบรนด์แทนสีฟ้าเดิม — ไม่แตะสี
   ของ .collapse ที่อยู่นอก dk-card (เช่นในหน้าแอดมิน/ติดตามออเดอร์เดิม) เลย */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ======================= UTIL ======================= */
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display='none',2400)}
function baht(n){return Number(n||0).toLocaleString('th-TH')+' ฿'}
function nowISO(){return new Date().toISOString()}
function fmtTime(iso){try{const d=new Date(iso);return d.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}catch{return iso}}
// เฟส 3 (fix): ตรวจว่าเป็น UUID จริงจาก Supabase Auth เท่านั้น — ใช้กันไม่ให้ id เก่าจากยุค localStorage
// ล้วน (เช่น "cus_1788174381337_xxxxx" / "rdr_..." ก่อนเชื่อม Supabase) หลุดรอดไปใช้เป็น customer_id/
// sender_id/rider_id เวลาเขียนลง Supabase จริง (คอลัมน์เหล่านี้เป็น type uuid เท่านั้น ส่งค่าอื่นเข้าไปจะ error)
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function isUuid(v){ return typeof v==='string' && UUID_RE.test(v); }
function baseUrl(){return location.origin+location.pathname}
function copyText(v){navigator.clipboard?.writeText(v);toast('คัดลอกลิงก์แล้ว')}

/* ======================= Supabase client (เชื่อม backend จริง — เฟส 2) =======================
   ใช้ client แยก 3 instance (customer/rider/admin) เก็บ session คนละ storage key เพื่อรักษาพฤติกรรมเดิม
   ที่ให้ล็อกอินเป็นลูกค้า + ไรเดอร์ + แอดมิน "พร้อมกันในแท็บเดียว" ได้ (เดิมแยกด้วย CUSTOMER_SESSION_KEY
   แบบ localStorage vs RIDER/ADMIN_SESSION_KEY แบบ sessionStorage) — ถ้าใช้ client เดียวกันทั้ง 3 role
   จะเก็บ session ได้แค่อันเดียว ล็อกอินไรเดอร์แล้วจะเด้งลูกค้าออกทันที ซึ่งพังพฤติกรรมเดิม
   สำคัญ: ใช้ Publishable Key (เดิมเรียก anon key) เท่านั้น ห้ามใช้ Secret/service_role key ในหน้าเว็บเด็ดขาด
   สิทธิ์ทุกอย่างถูกบังคับด้วย Row Level Security ฝั่ง Supabase (ดู supabase/migrations/0001_init.sql) */
const SUPABASE_URL='https://ptktomwmnnvlsjaiclvv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_4MpZOC76iZsraUonFXyqAw_Dvxv1bWM';
const sbCustomer=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'dekdoen-sb-customer',storage:window.localStorage,persistSession:true,autoRefreshToken:true}});
const sbRider=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'dekdoen-sb-rider',storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}});
const sbAdmin=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'dekdoen-sb-admin',storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}});

/* ======================= Match Marketplace: ระบบเดิม "Google Maps ตอนสร้างออเดอร์ลูกค้า" ถูกถอดออกจาก
   ระบบนี้ทั้งหมดแล้ว (เฟส Match Marketplace) ตามที่ระบุ — ระบบสร้างงาน/จุดรับ-จุดส่ง/ปักหมุด/คำนวณระยะทาง/
   คำนวณราคาอัตโนมัติของลูกค้าถูกลบออกจริง (ไม่ใช่แค่ซ่อน UI) จึงไม่มีจุดใดในไฟล์นี้เรียกใช้ Google Maps
   JavaScript API / Places API / Routes API อีกต่อไป — คงเหลือไว้แค่ openMaps() (ปุ่ม "เปิดแผนที่" ของไรเดอร์
   ที่เปิดลิงก์ค้นหาบน Google Maps เฉย ๆ ไม่ใช้ API key ใด ๆ) ซึ่งไม่เกี่ยวข้องกับระบบสร้างงานเดิมที่ถูกลบ */
// แปลงเบอร์โทร(หรือ username แอดมิน)เป็น "email ภายใน" ปลอมสำหรับ Supabase Auth เท่านั้น — ผู้ใช้ไม่เห็นค่านี้เลย
// ยังคงกรอกแค่เบอร์โทร+รหัสผ่านในหน้าเว็บเหมือนเดิมทุกจุด (role ต่อท้าย domain กันเบอร์เดียวกันชนกันข้าม role)
function phoneToInternalEmail(identifier,role){ return String(identifier||'').trim().toLowerCase()+'@'+role+'.dekdoen.internal'; }
// Supabase บางเวอร์ชัน/บาง config เมื่อสมัครซ้ำอีเมลเดิมจะไม่ error ตรง ๆ แต่คืนค่าแบบไม่มี session ใหม่มาให้
// (กันโจมตี enumeration) — เช็คทั้งสองแบบเพื่อให้ข้อความ "เบอร์นี้ถูกใช้สมัครแล้ว" ยังถูกต้องเสมอ
function isDuplicateSignup(error,data){
 if(error){
  const msg=(error.message||'').toLowerCase();
  if(msg.includes('already registered')||msg.includes('already exists')||msg.includes('user_already_exists')) return true;
 }
 if(!error && data && !data.session) return true;
 return false;
}
/* ---------- ระบบเสียงแจ้งเตือน (เดียวใช้ร่วมกันทุก role) ---------- */
// สำคัญ: รอบนี้ "ลบ" ระบบเสียงพูด/TTS/Web Speech API ออกทั้งหมดตามที่ผู้ใช้สั่ง แทนที่ด้วยเสียงสังเคราะห์
// ผ่าน Web Audio API ล้วน ๆ (ไม่มีเสียงคนพูดเหลืออยู่จุดใดเลยในไฟล์นี้) แบ่งเป็น 3 แบบตามลักษณะเหตุการณ์:
//  1) playOrderChime()  — เสียง "อินโทร" เอกลักษณ์ของแอป ยาว ~2.5 วิ ใช้เฉพาะตอนมีออเดอร์ใหม่เข้าระบบ (Rider/Admin) เท่านั้น
//  2) playChatPing()    — เสียงสั้นแยกเฉพาะข้อความแชทใหม่ สั้นกว่าและโทนต่างจากเสียงออเดอร์ชัดเจน
//  3) playStatusChime() — เสียงสั้นสำหรับแจ้งเตือนอัปเดตสถานะทั่วไป (ลูกค้าเห็นสถานะเปลี่ยน / ไรเดอร์รับงาน-จบงานเอง)
let soundEnabled=localStorage.getItem('dekdoen_sound_enabled')!=='false'; // เก็บค่าเปิด/ปิดของผู้ใช้
let audioCtx=null;
function ensureAudioCtx(){
 try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); }catch(e){}
 return audioCtx;
}
// ปลดล็อกเสียงหลังผู้ใช้มี interaction ครั้งแรก กัน browser บล็อก autoplay (ทุกเสียงในระบบใช้ AudioContext เดียวกันนี้)
['click','touchstart','keydown'].forEach(evt=>document.addEventListener(evt,ensureAudioCtx,{once:true,passive:true}));
// เล่นโน้ตเดี่ยวด้วย oscillator หลัก + harmonic เบา ๆ ซ้อนขึ้นหนึ่งอ็อกเทฟ ให้ฟังดูมีมิติแบบระฆัง/ระนาดอ่อน ๆ
// ไม่ใช่เสียง sine เดี่ยวแบนราบแบบ beep เดิม — ใช้เป็นบล็อกพื้นฐานประกอบเป็นทำนองสั้น ๆ ของทั้ง 3 เสียงด้านล่าง
function playTone(freq,startAt,dur,peakGain,type){
 if(!audioCtx) return;
 try{
  const t0=audioCtx.currentTime+startAt;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peakGain,t0+Math.min(0.03,dur*0.25));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.03);
  const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
  o2.type='sine'; o2.frequency.value=freq*2;
  g2.gain.setValueAtTime(0.0001,t0);
  g2.gain.exponentialRampToValueAtTime(peakGain*0.16,t0+Math.min(0.02,dur*0.2));
  g2.gain.exponentialRampToValueAtTime(0.0001,t0+dur*0.7);
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.start(t0); o2.stop(t0+dur*0.7+0.03);
 }catch(e){ /* ห้ามให้ error หลุดออกไปกระทบระบบอื่น */ }
}
// เสียงอินโทรแจ้งเตือน "ออเดอร์ใหม่" — อาร์เพจโจ 4 โน้ตไล่ขึ้น (C5-E5-G5-C6) สดใส จำง่าย เป็นเอกลักษณ์ของแอป
// โน้ตสุดท้ายค้างเสียงยาวขึ้นให้รู้สึก "จบประโยค" รวมความยาวทั้งหมด ~2.4-2.6 วินาที ไม่ใช่เสียง beep ธรรมดาแน่นอน
function playOrderChime(){
 if(!soundEnabled) return;
 ensureAudioCtx(); if(!audioCtx) return;
 playTone(523.25,0.00,0.32,0.22,'triangle');
 playTone(659.25,0.13,0.32,0.22,'triangle');
 playTone(783.99,0.26,0.34,0.24,'triangle');
 playTone(1046.50,0.40,1.35,0.28,'triangle');
}
// เสียงแจ้งเตือนข้อความแชทใหม่ — สั้นกระชับ (~0.25 วิ) โน้ตสูงกว่าและจังหวะไวกว่าเสียงออเดอร์อย่างชัดเจน แยกแยะได้ทันทีที่ได้ยิน
function playChatPing(){
 if(!soundEnabled) return;
 ensureAudioCtx(); if(!audioCtx) return;
 playTone(1174.66,0.00,0.13,0.18,'sine');
 playTone(1567.98,0.09,0.16,0.16,'sine');
}
// เสียงแจ้งเตือนอัปเดตสถานะทั่วไป — สั้น นุ่มกว่าเสียงออเดอร์ใหม่ ใช้ตอนสถานะงานเปลี่ยน/ไรเดอร์รับงาน-จบงานเอง
function playStatusChime(){
 if(!soundEnabled) return;
 ensureAudioCtx(); if(!audioCtx) return;
 playTone(880,0.00,0.22,0.2,'sine');
 playTone(1108.73,0.09,0.24,0.16,'sine');
}
// ฟังก์ชันกลางที่ทุกจุดแจ้งเตือนเรียกใช้ — kind กำหนดว่าจะเล่นเสียงไหน ('order'=อินโทรออเดอร์ใหม่, 'chat'=ข้อความแชทใหม่, ไม่ระบุ=สถานะทั่วไป)
function notifySoundAndToast(message,kind){
 toast(message);
 if(kind==='order') playOrderChime();
 else if(kind==='chat') playChatPing();
 else playStatusChime();
}
function toggleSound(){
 soundEnabled=!soundEnabled;
 try{ localStorage.setItem('dekdoen_sound_enabled', soundEnabled?'true':'false'); }catch(e){}
 renderSoundButton();
 if(soundEnabled){ ensureAudioCtx(); playStatusChime(); }
}
const ICON_SOUND_ON=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`;
const ICON_SOUND_OFF=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M23 9l-6 6"/><path d="M17 9l6 6"/></svg>`;
function renderSoundButton(){
 const btn=$('soundToggleBtn'); if(!btn)return;
 btn.innerHTML=soundEnabled?ICON_SOUND_ON:ICON_SOUND_OFF;
 btn.classList.toggle('muted',!soundEnabled);
 btn.title=soundEnabled?'ปิดเสียงแจ้งเตือน':'เปิดเสียงแจ้งเตือน';
}
// ปุ่ม "ทดสอบเสียง": action ที่ผู้ใช้กดเองโดยตรง จึงเล่นเสียงอินโทรออเดอร์ใหม่ (เสียงหลัก/เอกลักษณ์ของระบบ) ให้ฟังจริงเสมอ
// แม้ soundEnabled จะถูกปิดไว้ก็ตาม (เพื่อให้ผู้ใช้ทดสอบเสียงบนอุปกรณ์ตัวเองได้ตลอด) และใช้ user-gesture นี้ปลดล็อก autoplay ไปพร้อมกัน
function testVoice(){
 ensureAudioCtx();
 if(!audioCtx){ toast('อุปกรณ์นี้ไม่รองรับการเล่นเสียง (Web Audio API)'); return; }

   Realtime เท่านั้น ถ้า event หลุดหายไประหว่างแท็บไม่ active (เบราว์เซอร์บาง engine หยุด/ชะลอ WebSocket เบื้องหลัง)
   ข้อมูลบนจอจะค้างสถานะเก่าโดยที่ผู้ใช้ไม่รู้ตัว จนกว่าจะรีเฟรชเองเท่านั้น — แก้โดย "ดึงข้อมูลจริงจาก Supabase ซ้ำ
   ทุกครั้งที่แท็บกลับมา active" (ไม่ใช่แค่โหลด localStorage เหมือน listener เดิมด้านบน) ผ่าน syncOrdersForClient/
   syncChatForClient ที่มีอยู่แล้ว (เรียกได้ปลอดภัย ไม่สร้าง state ซ้ำซ้อน — upsertOrder/upsertChatMessage กันซ้ำเอง
   ด้วย id อยู่แล้ว) และไม่ subscribe realtime channel ใหม่เลยแม้แต่ช่องเดียว (ใช้ REST fetch ซ้ำเฉยๆ) จึงไม่มีทาง
   เกิด duplicate subscription ตามที่ห้ามไว้ ครอบคลุมเฉพาะ role ที่ login/sync อยู่จริงตอนนั้นเท่านั้น (ROLE_SYNC_ACTIVE) */
let refreshActiveRoleBusy=false, refreshActiveRoleLastAt=0;
async function refreshActiveRoleData(){
 if(refreshActiveRoleBusy) return;
 const now=Date.now();
 if(now-refreshActiveRoleLastAt<1500) return; // กัน focus/pageshow/visibilitychange ยิงซ้อนกันหลายอีเวนต์ในจังหวะเดียว
 refreshActiveRoleLastAt=now;
 refreshActiveRoleBusy=true;
 try{
  const roles=Object.keys(ROLE_SYNC_ACTIVE).filter(r=>ROLE_SYNC_ACTIVE[r]);
  for(const role of roles){
   const client=clientForRole(role);
   await Promise.all([syncOrdersForClient(client),syncMatchesForClient(client)]);
   await syncChatForClient(client); // ต้องรอ order/match sync เสร็จก่อนเสมอ (เหตุผลเดียวกับ activateRoleSync)
  }
  if(roles.length) fireChange(true);
 } catch(e){ console.error('refreshActiveRoleData failed',e); }
 finally{ refreshActiveRoleBusy=false; }
}
window.addEventListener('focus',()=>{ refreshActiveRoleData(); });

// เพิ่มพารามิเตอร์ตัวเลือก distanceKm (ระยะทางจริงจาก Google Maps หน่วยกิโลเมตร) — ถ้าไม่ส่งมา (undefined)
// จะเท่ากับ 0 พฤติกรรมเดิมทุกประการ (ราคาที่คำนวณไม่เปลี่ยนแปลงจากเดิมเลยถ้าไม่ได้ใช้แผนที่) ใช้ค่า
// rates_config.km (ค่าบริการต่อกิโลเมตร ที่มีอยู่แล้วในระบบตั้งแต่เฟส 1 แต่ยังไม่เคยถูกใช้จริงในสูตรราคา) —
// ไม่ได้สร้างระบบราคาใหม่ซ้อน แค่เติมองค์ประกอบระยะทางเข้าไปในฟังก์ชันราคาเดิมฟังก์ชันเดียวที่ใช้อยู่ทั้งระบบ
function calcPricing(stopsCount,goods,distanceKm){
 const r=DB.rates;
 const extra=Math.max(0,stopsCount-1)*Number(r.perStop||0);
 const distanceFee=Number(distanceKm||0)*Number(r.km||0);
 const fee=Number(r.base||0)+extra+distanceFee;
 const commission=Math.round(fee*Number(r.commission||0)/100);
 const riderEarn=fee-commission;
 const total=Number(goods||0)+fee;
 return {goods:Number(goods||0),fee,extra,distanceFee,distanceKm:Number(distanceKm||0),commission,riderEarn,total};
}
// ราคาแยกรายงาน (งานที่ 1 = ค่าบริการเริ่มต้น, งานที่ 2 เป็นต้นไป = ค่าบริการต่อจุดเพิ่ม) — ใช้สูตรราคาเดิมทุกประการ แค่แยกแสดงเป็นรายการ
function perJobFees(stopsCount){
 const r=DB.rates; const fees=[];
 for(let i=0;i<stopsCount;i++) fees.push(i===0?Number(r.base||0):Number(r.perStop||0));
 return fees;
}

/* เฟส 3: createOrder บันทึกลง Supabase จริง (ไม่ใช่ localStorage อีกต่อไป) — id/pricing/timeline คำนวณฝั่ง

async function createOrder({customerId,customerName,customerContact,customerNote,stops,goodsTotal,createdBy,pickupLat,pickupLng,dropoffLat,dropoffLng,distanceKm,riderId,riderName}){
 const client=createdBy==='admin'?sbAdmin:sbCustomer;
 const payload={
  created_by:createdBy||'customer',
  customer_id:customerId||null, // ผูกกับบัญชีลูกค้าจริง (null = ออเดอร์ที่แอดมินสร้างให้ทางแชท/โทรศัพท์ ไม่ผูกบัญชี)
  customer_name:customerName||'', customer_contact:customerContact||'', customer_note:customerNote||'',
  // waypoints/pickupLoc/dropoffLoc/distanceKm/durationText: ฟิลด์เสริมจากระบบแผนที่ใหม่ (เพิ่มเติมเข้าไปในฟิลด์
  // stops เดิมแบบไม่กระทบ — undefined/null ได้ปกติถ้างานนั้นไม่ได้ใช้แผนที่ ยังสร้างออเดอร์ได้ตามเดิมทุกประการ)
  stops:(stops||[]).map((s,i)=>({seq:i+1,pickup:s.pickup||'',dropoff:s.dropoff||'',detail:s.detail||'',note:s.note||'',qty:Number(s.qty||1),photos:s.photos||[],done:false,
   waypoints:s.waypoints||[], pickupLoc:s.pickupLoc||null, dropoffLoc:s.dropoffLoc||null,
   distanceKm:(s.distanceKm===undefined||s.distanceKm===null)?null:Number(s.distanceKm), durationText:s.durationText||null})),
  goods_total:Number(goodsTotal||0),
  // เฟส Google Maps: พิกัดจุดรับ-ส่งและระยะทางจริงระดับออเดอร์ (ไม่บังคับ — null ได้ถ้าไม่ได้ใช้แผนที่ ไม่กระทบออเดอร์แบบเดิมเลย)
  pickup_lat:(pickupLat===undefined||pickupLat===null)?null:Number(pickupLat),
  pickup_lng:(pickupLng===undefined||pickupLng===null)?null:Number(pickupLng),
  dropoff_lat:(dropoffLat===undefined||dropoffLat===null)?null:Number(dropoffLat),
  dropoff_lng:(dropoffLng===undefined||dropoffLng===null)?null:Number(dropoffLng),
  distance_km:(distanceKm===undefined||distanceKm===null)?null:Number(distanceKm)
 };
 // Platform v2: "ส่งงานตรงให้ไรเดอร์" — ผูก rider_id/status ตั้งแต่ตอนสร้างออเดอร์เลย (ไม่ผ่านห้องรับงานกลาง/claim_order)
 // ฝั่ง server (compute_order_pricing trigger, ดู 0007_rider_platform_v2.sql) จะตรวจสอบซ้ำอีกชั้นว่าไรเดอร์นี้มี
 // อยู่จริง เป็นไรเดอร์ และไม่ถูกแบน — ถ้าไม่ผ่านจะ raise exception กลับมาเป็น error.message ตรงนี้
 if(riderId){ payload.status='ASSIGNED'; payload.rider_id=riderId; payload.rider_name=riderName||''; }
 const {data,error}=await client.from('orders').insert(payload).select().single();
 if(error){ toast('สร้างออเดอร์ไม่สำเร็จ: '+error.message); return null; }
 upsertOrder(data);

}
/* ---------- เฟส 3: sync + realtime — เชื่อม DB.orders (cache กลางเดิม) เข้ากับ Supabase จริง ----------
   หลักการ: โค้ด render ทั้งหมด (renderAdminList/renderCustomerRoot/renderRiderJobRoom ฯลฯ) อ่าน DB.orders
   ตรง ๆ เหมือนเดิมทุกจุด ไม่ต้องแก้ — สิ่งที่เปลี่ยนคือ DB.orders ถูก "เติม/อัปเดต" จากฐานข้อมูลจริงแทนการเขียน
   ลง localStorage เอง โดย 2 ทาง: (1) ดึงข้อมูลทั้งหมดที่ role นั้นมีสิทธิ์เห็นตาม RLS ทันทีหลัง login/สมัคร/หรือมี
   session ค้างอยู่ตอนเปิดหน้าเว็บซ้ำ (2) subscribe Supabase Realtime (postgres_changes) รับอัปเดตสดทุกครั้งที่มี
   คนอื่น (คนละเครื่อง/คนละเบราว์เซอร์ก็ได้) สร้าง/แก้ไขออเดอร์หรือส่งข้อความแชท — Realtime กรองให้อัตโนมัติตาม RLS
   ของ client ที่ subscribe อยู่แล้ว (เช่น client ไรเดอร์จะได้รับเฉพาะออเดอร์ PENDING หรือออเดอร์ของตัวเอง)
   ทุกครั้งที่ DB.orders เปลี่ยนจะเรียก fireChange() ตัวเดิม ซึ่งไปกระตุ้น render ทุกจอ + checkForNotifiableEvents()
   (แจ้งเตือน+เสียงอินโทร) โดยอัตโนมัติอยู่แล้วตามที่ boot() ผูก dbListeners ไว้ — ไม่ต้องเพิ่มโค้ดแจ้งเตือน/เสียงแยก */
function clientForRole(role){ return role==='rider'?sbRider: role==='admin'?sbAdmin: sbCustomer; }
function mapOrderRow(row){
 return {
  id:row.id, status:row.status, createdAt:row.created_at, createdBy:row.created_by,
  customerId:row.customer_id,
  customer:{name:row.customer_name||'',contact:row.customer_contact||'',note:row.customer_note||''},
  stops:row.stops||[], pricing:row.pricing||{}, timeline:row.timeline||[],
  rider:row.rider_id?{riderId:row.rider_id,name:row.rider_name||''}:null,
  pickupLat:row.pickup_lat??null, pickupLng:row.pickup_lng??null,
  dropoffLat:row.dropoff_lat??null, dropoffLng:row.dropoff_lng??null,
  distanceKm:row.distance_km??null,
  chat:[] // เติมทีหลังจาก chat_messages แยกต่างหาก — ดู upsertOrder/upsertChatMessage
 };
}
function upsertOrder(row,opts){
 const mapped=mapOrderRow(row);
 const idx=DB.orders.findIndex(o=>o.id===row.id);
 if(idx>=0){ mapped.chat=DB.orders[idx].chat; DB.orders[idx]=mapped; } // รักษาแชทที่โหลดไว้แล้วของออเดอร์นี้
 else{ DB.orders.unshift(mapped); }
 if(!opts||!opts.silent) fireChange(false);
}
// เฟส Match Marketplace: chat_messages ตอนนี้ผูกกับ "order" (เดิม) หรือ "match" (ใหม่) อย่างใดอย่างหนึ่งเท่านั้น
// (บังคับด้วย CHECK constraint ฝั่ง DB แล้ว) — เก็บ kind/meta ของข้อความมาด้วยเพื่อ render การ์ดข้อเสนอราคาได้
// ต้องรองรับทั้ง insert (ข้อความใหม่) และ update (respond_price_proposal แก้ meta ของการ์ดข้อเสนอราคาเดิม
// ไม่ได้สร้างข้อความใหม่) — เจอ id เดิมแล้วอัปเดตแทนการข้าม ไม่ใช่แค่กันซ้ำเฉย ๆ เหมือนระบบแชทเดิม
function upsertChatMessage(row,opts){
 const target = row.match_id ? findMatch(row.match_id) : findOrder(row.order_id);
 if(!target) return;
 const mapped={id:row.id, from:row.sender_role, text:row.text||'', image:row.image||null, at:row.created_at,
  kind:row.kind||'text', meta:row.meta||null};
 const idx=target.chat.findIndex(m=>m.id===row.id);
 if(idx>=0) target.chat[idx]=mapped; else target.chat.push(mapped);
 target.chat.sort((a,b)=>new Date(a.at)-new Date(b.at));
 if(!opts||!opts.silent) fireChange(false);
}
async function syncOrdersForClient(client){
 const {data,error}=await client.from('orders').select('*');
 if(error){ console.error('sync orders failed',error); return; }
 (data||[]).forEach(row=>upsertOrder(row,{silent:true}));
}
async function syncChatForClient(client){
 const {data,error}=await client.from('chat_messages').select('*').order('created_at',{ascending:true});
 if(error){ console.error('sync chat failed',error); return; }
 (data||[]).forEach(row=>upsertChatMessage(row,{silent:true}));
}
/* ======================= MATCH MARKETPLACE — data layer =======================
   MATCHES คือ cache กลางของตาราง matches จริง (แพทเทิร์นเดียวกับ DB.orders ทุกประการ) — sync ครั้งแรกหลัง
   login/activateRoleSync แล้วอัปเดตสดผ่าน Realtime (ดู subscribeRealtimeForRole) โค้ด render ทั้งหมดอ่าน
   MATCHES ตรง ๆ เหมือนที่ DB.orders ถูกใช้ทั่วทั้งไฟล์ ไม่ต้อง query ใหม่ทุกครั้งที่วาดหน้าจอ */
let MATCHES=[];
function mapMatchRow(row){
 return {
  id:row.id, status:row.status, customerId:row.customer_id, providerId:row.provider_id,
  proposedPrice:row.proposed_price==null?null:Number(row.proposed_price),
  agreedPrice:row.agreed_price==null?null:Number(row.agreed_price),
  createdAt:row.created_at, updatedAt:row.updated_at,
  chat:[] // เติมทีหลังจาก chat_messages แยกต่างหาก — ดู upsertMatch/upsertChatMessage
 };
}
function findMatch(id){ return MATCHES.find(m=>m.id===id); }
function upsertMatch(row,opts){
 const mapped=mapMatchRow(row);
 const idx=MATCHES.findIndex(m=>m.id===row.id);
 if(idx>=0){ mapped.chat=MATCHES[idx].chat; MATCHES[idx]=mapped; } // รักษาแชทที่โหลดไว้แล้วของ match นี้
 else{ MATCHES.unshift(mapped); }
 if(!opts||!opts.silent) fireChange(false);
}
async function syncMatchesForClient(client){
 const {data,error}=await client.from('matches').select('*');
 if(error){ console.error('sync matches failed',error); return; }
 (data||[]).forEach(row=>upsertMatch(row,{silent:true}));
}
function matchesFor(role,userId){
 if(!userId) return [];
 return role==='rider' ? MATCHES.filter(m=>m.providerId===userId) : MATCHES.filter(m=>m.customerId===userId);
}
async function syncRatesForClient(client){
 const {data,error}=await client.from('rates_config').select('*').maybeSingle();
 if(error||!data) return;

function handleSelfBanned(role){
 toast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ');

async function subscribeRealtimeForRole(role){
 const client=clientForRole(role);
 if(REALTIME_CHANNELS[role]){ try{ client.removeChannel(REALTIME_CHANNELS[role]); }catch(e){} REALTIME_CHANNELS[role]=null; }
 let selfId=null;
 try{
  const {data:{session}}=await client.auth.getSession();
  if(session&&session.access_token) client.realtime.setAuth(session.access_token);
  if(session&&session.user) selfId=session.user.id;
 }catch(e){ console.error('realtime setAuth failed',e); }
 const ch=client.channel('dekdoen-'+role)
  .on('postgres_changes',{event:'*',schema:'public',table:'orders'},payload=>{
   if(payload.eventType==='DELETE') return; // ระบบนี้ไม่มีการลบออเดอร์จริง
   upsertOrder(payload.new);
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},payload=>{
   upsertChatMessage(payload.new);
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'chat_messages'},payload=>{
   // ใช้ตอนข้อเสนอราคาถูกยอมรับ/ปฏิเสธ (respond_price_proposal แก้ meta ของข้อความเดิม ไม่ได้ insert ใหม่)
   upsertChatMessage(payload.new);
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'matches'},payload=>{
   if(payload.eventType==='DELETE') return; // ระบบนี้ไม่มีการลบ match จริง
   upsertMatch(payload.new);
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'rider_credit_entries'},payload=>{
   if(payload.new) upsertCreditEntry(payload.new); fireChange(false);
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'rider_credit_payments'},payload=>{
   upsertCreditPayment(payload.new); fireChange(false);
  });
 if(selfId){
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+selfId},payload=>{
   if(payload.new&&payload.new.banned) handleSelfBanned(role);
  });
 }
 // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): เฉพาะแอดมินเท่านั้นที่ subscribe แบบไม่กรอง table ทั้งหมด
 // (RLS ของ profiles อนุญาตให้ is_admin() อ่านได้ทุกแถวอยู่แล้ว — realtime สืบสิทธิ์จาก RLS เดียวกันเสมอ ไม่ใช่
 // ช่องโหว่ใหม่) เพื่อให้หน้า "จัดการผู้ใช้" ของแอดมินอัปเดตสดทันทีที่มีคนสมัครสมาชิกใหม่/ถูกแบน/ถูกลบบัญชี
 // แทนที่จะต้องรอรีเฟรชหน้าเอง — ดู syncAdminUsersList()/ADMIN_USERS ด้านล่าง
 if(role==='admin'){
  ch.on('postgres_changes',{event:'*',schema:'public',table:'profiles'},payload=>{
   if(payload.eventType==='DELETE') removeAdminUserProfile(payload.old&&payload.old.id);
   else upsertAdminUserProfile(payload.new);
  });
 }
 ch.subscribe();
 REALTIME_CHANNELS[role]=ch;
}
function unsubscribeRealtimeForRole(role){

const ROLE_SYNC_ACTIVE={customer:false,rider:false,admin:false};

// สำคัญ: sync รอบแรกต้อง "เงียบ" ทั้งหมด (ไม่เรียก fireChange ระหว่างทาง) แล้วค่อย seed baseline การแจ้งเตือน
// (ensureNotifBaseline) จาก DB.orders ที่โหลดจริงแล้วก่อนเปิด realtime เสมอ — มิฉะนั้นออเดอร์/งานเก่าที่มีอยู่ก่อน

async function activateRoleSync(role){
 if(ROLE_SYNC_ACTIVE[role]) return;
 ROLE_SYNC_ACTIVE[role]=true;
 const client=clientForRole(role);
 // สำคัญ: ต้อง sync orders + matches (เจ้าของ chat แต่ละข้อความ) ให้เสร็จ "ก่อน" sync chat เสมอ — upsertChatMessage
 // หา order/match ปลายทางจาก cache ที่โหลดไว้แล้วเท่านั้น (ไม่ query แยก) ถ้า sync พร้อมกันแบบไม่รอกัน ข้อความ
 // อาจมาถึงก่อนออเดอร์/match เจ้าของมันโหลดเสร็จ แล้วถูกทิ้งเงียบ ๆ (หาไม่เจอ target ก็ return ออกไปเลย)
 const tasks=[syncOrdersForClient(client),syncMatchesForClient(client),syncRatesForClient(client),syncCreditForClient(client)];
 // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): เฉพาะแอดมินต้องโหลดรายชื่อผู้ใช้ทั้งหมดจริงจาก Supabase มาไว้ใน

 if(role==='admin') tasks.push(syncAdminUsersList());
 await Promise.all(tasks);

}
function deactivateRoleSync(role){

 unsubscribeRealtimeForRole(role);
}

// เฟส Match: เวอร์ชันทั่วไปของ addChat — ส่งข้อความแชทที่ผูกกับ "ออเดอร์เดิม" (orderId) หรือ "MATCH ใหม่" (matchId)
// ก็ได้ (ต้องมีอย่างใดอย่างหนึ่งเท่านั้น ห้ามส่งทั้งคู่ — ตรง constraint ฝั่ง DB เป๊ะ) ใช้ path เดียวกันทุกอย่างกับ
// addChat เดิม (client เลือกตาม role, ต้อง auth จริง, ข้อความ error สั้นไม่โชว์ raw error, upsertChatMessage ตอนสำเร็จ)
async function addChatTo(target,from,text,image){
 const t=(text||'').trim();
 if(!t&&!image) return false;
 const client=from==='rider'?sbRider:sbCustomer;
 const sender=from==='rider'?currentRider():currentCustomer();
 if(!sender){ toast('กรุณาเข้าสู่ระบบก่อนส่งข้อความ'); return false; }
 // เฟส 3 (fix): เช่นเดียวกับตอนสร้างออเดอร์ — ดึง user.id จาก Supabase Auth จริงมาใช้เป็น sender_id เสมอ
 // ห้ามใช้ sender.id จาก local mirror ตรงๆ กัน id เก่าก่อนเชื่อม Supabase หลุดเข้าไปเขียนลง DB
 const authId=from==='rider'?await requireRiderAuthId():await requireCustomerAuthId();
 if(!authId){ toast('เซสชันหมดอายุหรือไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่'); return false; }
 const payload={sender_role:from,sender_id:authId,text:t,image:image||null,kind:'text'};
 if(target&&target.matchId) payload.match_id=target.matchId; else payload.order_id=target&&target.orderId;
 const {data,error}=await client.from('chat_messages').insert(payload).select().single();
 // ข้อความแจ้งผู้ใช้เป็นข้อความสั้น เข้าใจง่ายเสมอ — ไม่โชว์ error.message ดิบ (อาจเป็นข้อความ technical จาก DB/RLS)
 // ให้ลูกค้าเห็น: log ไว้ที่ console สำหรับตรวจสอบ/debug ฝั่งเราเองแทน
 if(error){ console.error('addChat failed:',error); toast('ส่งข้อความไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); return false; }
 upsertChatMessage(data);
 return true;
}

/* ======================= ศูนย์การแจ้งเตือน (แยกคีย์ localStorage จากออเดอร์ ไม่กระทบ DB เดิม) ======================= */
/* สำคัญ: แยกเก็บเป็น "คนละคีย์ localStorage ต่อ role" (rider / customer / admin) แทนที่จะรวมเป็นก้อนเดียวกันทั้งหมด
   เหตุผล: ถ้ารวมเป็น object ก้อนเดียว เวลาแท็บ A (เช่นแท็บลูกค้า) กับแท็บ B (เช่นแท็บไรเดอร์ที่เพิ่งรับงาน) ต่างก็ต้อง
   save ทับกันในคีย์เดียวกันเกือบพร้อมกัน (แท็บอื่นเป็นคนละ process กันจริง ๆ ไม่ใช่แค่คิวใน thread เดียว) จะเกิด
   lost-update ข้ามความสนใจกันได้ (เช่นแท็บลูกค้าบันทึกทับ baseline แชทที่แท็บไรเดอร์เพิ่ง seed ไว้)
   การแยกคีย์ตาม role ทำให้แท็บที่ไม่เกี่ยวข้องกับ role นั้นไม่มีทางเขียนทับข้อมูลของ role อื่นได้เลย */
const NOTIF_RIDER_KEY='dekdoen_notif_rider_v1';
const NOTIF_CUSTOMER_KEY='dekdoen_notif_customer_v1';
const NOTIF_ADMIN_KEY='dekdoen_notif_admin_v1';
function defaultRiderNotif(){ return { list:[], seen:{ baselineSeeded:false, riderJobs:[], riderChat:{} } }; }
function defaultCustomerNotif(){ return { list:[], seen:{ customerStatus:{}, customerChat:{} } }; }
function defaultAdminNotif(){ return { list:[], seen:{ baselineSeeded:false, adminStatus:{} } }; }
function loadStore(key,defFn){
 try{
  const raw=localStorage.getItem(key);
  if(!raw) return defFn();
  const d=JSON.parse(raw);
  const def=defFn();
  return Object.assign(def,d,{seen:Object.assign(def.seen,d.seen||{})});
 }catch(e){ return defFn(); }
}
function loadRiderNotif(){ return loadStore(NOTIF_RIDER_KEY,defaultRiderNotif); }
function loadCustomerNotif(){ return loadStore(NOTIF_CUSTOMER_KEY,defaultCustomerNotif); }
function loadAdminNotif(){ return loadStore(NOTIF_ADMIN_KEY,defaultAdminNotif); }
let NOTIF_RIDER=loadRiderNotif();
let NOTIF_CUSTOMER=loadCustomerNotif();
let NOTIF_ADMIN=loadAdminNotif();
let notifListeners=[];
function saveRiderNotif(){ try{ localStorage.setItem(NOTIF_RIDER_KEY,JSON.stringify(NOTIF_RIDER)); }catch(e){} notifListeners.forEach(fn=>{try{fn(false)}catch(e){}}); }
function saveCustomerNotif(){ try{ localStorage.setItem(NOTIF_CUSTOMER_KEY,JSON.stringify(NOTIF_CUSTOMER)); }catch(e){} notifListeners.forEach(fn=>{try{fn(false)}catch(e){}}); }
function saveAdminNotif(){ try{ localStorage.setItem(NOTIF_ADMIN_KEY,JSON.stringify(NOTIF_ADMIN)); }catch(e){} notifListeners.forEach(fn=>{try{fn(false)}catch(e){}}); }
window.addEventListener('storage',e=>{
 if(e.key===NOTIF_RIDER_KEY){ NOTIF_RIDER=loadRiderNotif(); notifListeners.forEach(fn=>{try{fn(true)}catch(e){}}); }
 else if(e.key===NOTIF_CUSTOMER_KEY){ NOTIF_CUSTOMER=loadCustomerNotif(); notifListeners.forEach(fn=>{try{fn(true)}catch(e){}}); }
 else if(e.key===NOTIF_ADMIN_KEY){ NOTIF_ADMIN=loadAdminNotif(); notifListeners.forEach(fn=>{try{fn(true)}catch(e){}}); }
});

// เฟส 3: เรียกจาก activateRoleSync() หลังโหลดข้อมูลจริงจาก Supabase เสร็จ "เฉพาะของ role ที่เพิ่ง sync" เท่านั้น

// ไม่เห็นออเดอร์ DONE ของคนอื่นเหมือนแอดมิน) กันไม่ให้ออเดอร์ที่มีอยู่ก่อนถูกนับเป็น "ใหม่" แล้วแจ้งเตือนย้อนหลัง
function ensureNotifBaseline(role){
 if((!role||role==='rider') && !NOTIF_RIDER.seen.baselineSeeded){
  NOTIF_RIDER.seen.riderJobs=DB.orders.filter(o=>o.status==='PENDING').map(o=>o.id);

 if((!role||role==='admin') && !NOTIF_ADMIN.seen.baselineSeeded){
  NOTIF_ADMIN.seen.adminStatus={};
  DB.orders.forEach(o=>{ NOTIF_ADMIN.seen.adminStatus[o.id]=o.status; });
  NOTIF_ADMIN.seen.baselineSeeded=true;
  saveAdminNotif();
 }

function checkRiderChatNotifications(){
 const o=myActiveOrder(); if(!o) return false;
 const prevRaw=NOTIF_RIDER.seen.riderChat[o.id];
 // สำคัญ: ต้อง seed baseline ทันทีตั้งแต่ครั้งแรกที่เริ่มติดตามงานนี้ (แม้ยังไม่มีข้อความเลย ณ ตอนนั้น)

 NOTIF_RIDER.seen.riderChat[o.id]=o.chat.length;
 const newMsgs=o.chat.slice(prevRaw);

  pushNotification('rider',{title:'ลูกค้าส่งข้อความใหม่',body:'ออเดอร์ #'+o.id,orderId:o.id});
  if(currentNotifRole()==='rider') notifySoundAndToast('ลูกค้าส่งข้อความใหม่','chat');
 }
 return true;
}
function checkCustomerOrderNotifications(){
 if(!custBuiltMode||!custBuiltMode.startsWith('track:')) return false;
 const orderId=custBuiltMode.slice(6);
 const o=findOrder(orderId); if(!o) return false;
 let changed=false;
 const prevStatus=NOTIF_CUSTOMER.seen.customerStatus[orderId];
 if(prevStatus===undefined){
  NOTIF_CUSTOMER.seen.customerStatus[orderId]=o.status; changed=true; // baseline ครั้งแรกที่เปิดออเดอร์นี้ — ไม่แจ้งเตือนย้อนหลัง
 }else if(prevStatus!==o.status){
  NOTIF_CUSTOMER.seen.customerStatus[orderId]=o.status; changed=true;
  const msg=CUSTOMER_STATUS_MESSAGE[o.status];
  if(msg){
   pushNotification('customer',{title:msg,body:'ออเดอร์ #'+o.id,orderId:o.id});
   if(currentNotifRole()==='customer'){ notifySoundAndToast(msg); }
  }
 }
 const prevChatRaw=NOTIF_CUSTOMER.seen.customerChat[orderId];
 // เช่นเดียวกับฝั่งไรเดอร์: ต้อง seed baseline ทันทีตั้งแต่เปิดหน้าออเดอร์นี้ครั้งแรก (แม้ยังไม่มีข้อความ) กันข้อความแรกถูกกลืนเป็น baseline
 if(prevChatRaw===undefined){
  NOTIF_CUSTOMER.seen.customerChat[orderId]=o.chat.length; changed=true;
 }else if(o.chat.length>prevChatRaw){
  NOTIF_CUSTOMER.seen.customerChat[orderId]=o.chat.length; changed=true;
  const newMsgs=o.chat.slice(prevChatRaw);
  if(newMsgs.some(m=>m.from!=='customer')){
   pushNotification('customer',{title:'ได้รับข้อความใหม่',body:'ในออเดอร์ #'+o.id,orderId:o.id});
   if(currentNotifRole()==='customer') notifySoundAndToast('มีข้อความใหม่ในแชท','chat');
  }
 }
 return changed;
}
function checkAdminOrderNotifications(){
 let changed=false;
 DB.orders.forEach(o=>{
  const prev=NOTIF_ADMIN.seen.adminStatus[o.id];
  if(prev===undefined){
   NOTIF_ADMIN.seen.adminStatus[o.id]=o.status; changed=true;
   const firstStop=o.stops&&o.stops[0]?o.stops[0]:{pickup:'-',dropoff:'-'};
   const lastStop=o.stops&&o.stops.length?o.stops[o.stops.length-1]:firstStop;
   const body=`#${o.id} • ลูกค้า ${o.customer.name||'-'} • รับที่ ${firstStop.pickup||'-'} → ส่งที่ ${lastStop.dropoff||'-'} • สถานะ ${STATUS_LABEL[o.status]||o.status}`;
   pushNotification('admin',{title:'มีออเดอร์ใหม่เข้าสู่ระบบ',body,orderId:o.id});
   // สำคัญ: เล่นเสียงจริงเฉพาะแท็บที่กำลังแสดงหน้าแอดมินเท่านั้น ด้วยเหตุผลเดียวกับฝั่งไรเดอร์ด้านบน —
   // กันไม่ให้แท็บไรเดอร์/ลูกค้าที่เปิดค้างไว้เล่นเสียง "มีออเดอร์ใหม่เข้า" ของแอดมินไปด้วยโดยไม่ตั้งใจ ซึ่งเป็นสาเหตุ
   // จริงที่ทำให้เสียงของไรเดอร์/แอดมินเคยชนกัน/ปนกันจนฟังดูเหมือน "เสียงหาย" ในบางจังหวะ
   if(currentNotifRole()==='admin'){ notifySoundAndToast('มีออเดอร์ใหม่เข้าสู่ระบบ #'+o.id,'order'); }
  }else if(prev!==o.status){
   NOTIF_ADMIN.seen.adminStatus[o.id]=o.status; changed=true;
   if(o.status==='DONE'){
    pushNotification('admin',{title:'ออเดอร์จัดส่งสำเร็จ',body:'#'+o.id,orderId:o.id});
    if(currentNotifRole()==='admin') notifySoundAndToast('ออเดอร์ #'+o.id+' จัดส่งสำเร็จ');
   }
  }
 });
 return changed;
}
function checkForNotifiableEvents(){
 // sync ทั้ง 3 คีย์กับสิ่งที่แท็บอื่นเพิ่งเขียนไว้ก่อนเช็ค แล้ว save เฉพาะคีย์ที่ตัวเองเปลี่ยนจริง (คนละคีย์ต่อ role กันเขียนทับข้าม role)
 NOTIF_RIDER=loadRiderNotif(); NOTIF_CUSTOMER=loadCustomerNotif(); NOTIF_ADMIN=loadAdminNotif();
 const jobChanged=checkRiderJobNotifications(); // เรียกทั้งคู่แยกกันเสมอ ห้ามใช้ || เพราะจะ short-circuit ข้ามการเช็คแชทถ้าอันแรก true
 const chatChanged=checkRiderChatNotifications();
 const riderChanged = jobChanged||chatChanged;
 const customerChanged = checkCustomerOrderNotifications();
 const adminChanged = checkAdminOrderNotifications();
 if(riderChanged) saveRiderNotif();
 if(customerChanged) saveCustomerNotif();
 if(adminChanged) saveAdminNotif();

 // หมายเหตุ (เฟส 3): ไม่ต้องตรวจสร้างเครดิตคอมมิชชั่นเองแล้ว — ตาราง rider_credit_entries ฝั่ง Supabase
 // สร้างให้อัตโนมัติทันทีที่ออเดอร์ถึงสถานะ DONE จริง (trigger) แล้ว sync มาแสดงผ่าน realtime อยู่แล้ว
}

/* ======================= บัญชีไรเดอร์ (โปรไฟล์ + ล็อกอิน) ======================= */
/* เก็บแยกคีย์ localStorage จาก DB ออเดอร์เดิม ไม่กระทบโครงสร้างข้อมูลออเดอร์ที่มีอยู่
   เข้าสู่ระบบ (session) เก็บแบบ sessionStorage แยกต่อแท็บ/หน้าต่าง เพื่อให้ทดสอบ/ใช้งานไรเดอร์คนละคนคนละแท็บได้ตามธรรมชาติ */
const RIDERS_KEY='dekdoen_riders_v1';
const RIDER_SESSION_KEY='dekdoen_rider_session';
function defaultRidersStore(){ return { riders:[] }; }
function loadRiders(){
 try{
  const raw=localStorage.getItem(RIDERS_KEY);
  if(!raw) return defaultRidersStore();
  const d=JSON.parse(raw);
  return Object.assign(defaultRidersStore(),d,{riders:d.riders||[]});
 }catch(e){ return defaultRidersStore(); }
}
let RIDERS=loadRiders();
let riderStoreListeners=[];
function saveRiders(){
 try{
  localStorage.setItem(RIDERS_KEY,JSON.stringify(RIDERS));
 }catch(e){
  toast('พื้นที่จัดเก็บเต็ม ไม่สามารถบันทึกข้อมูลโปรไฟล์นี้ได้ ลองใช้รูปที่มีขนาดเล็กลง');
  RIDERS=loadRiders();
  riderStoreListeners.forEach(fn=>{try{fn(false)}catch(e){}});
  return;
 }
 riderStoreListeners.forEach(fn=>{try{fn(false)}catch(e){}});
}
window.addEventListener('storage',e=>{ if(e.key===RIDERS_KEY){ RIDERS=loadRiders(); riderStoreListeners.forEach(fn=>{try{fn(true)}catch(e){}}); } });
function findRiderById(id){ return id? RIDERS.riders.find(r=>r.id===id) : null; }
function findRiderByPhone(phone){ return RIDERS.riders.find(r=>r.phone===phone); }
/* เชื่อม Supabase Auth จริงแล้ว (เฟส 2) — เบอร์โทรแปลงเป็น email ภายในปลอม (phoneToInternalEmail) ก่อนส่งให้
   supabase.auth.signUp()/signInWithPassword() ผู้ใช้ยังกรอกแค่เบอร์โทร+รหัสผ่านเหมือนเดิมทุกจุด ไม่เห็น email นี้เลย
   หลัง login สำเร็จจะดึงข้อมูลจริงจากตาราง profiles มา cache ไว้ใน RIDERS.riders (local mirror) เหมือนเดิมทุกฟิลด์
   เพื่อให้โค้ดส่วนอื่นทั้งหมด (resolveRiderDisplay, findRiderById, สร้างออเดอร์ ฯลฯ) ทำงานต่อได้โดยไม่ต้องแก้ */
async function riderSignup({name,phone,password,photo}){
 name=(name||'').trim(); phone=(phone||'').trim();
 if(!name) return {ok:false,reason:'กรุณากรอกชื่อจริง'};
 if(!phone) return {ok:false,reason:'กรุณากรอกเบอร์โทรศัพท์'};
 if(!password||password.length<4) return {ok:false,reason:'รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'};
 const email=phoneToInternalEmail(phone,'rider');
 let data,error;
 try{ ({data,error}=await sbRider.auth.signUp({email,password,options:{data:{role:'rider',name,phone}}})); }
 catch(e){ return {ok:false,reason:'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 if(isDuplicateSignup(error,data)) return {ok:false,reason:'เบอร์นี้ถูกใช้สมัครแล้ว กรุณาเข้าสู่ระบบแทน'};
 if(error) return {ok:false,reason:'สมัครสมาชิกไม่สำเร็จ: '+error.message};
 const uid=data.user.id;
 if(photo){ try{ await sbRider.from('profiles').update({photo}).eq('id',uid); }catch(e){} }
 const r={id:uid,name,phone,photo:photo||null,banned:false,createdAt:nowISO(),availabilityStatus:'available',serviceArea:'',services:'',bio:'',startingPrice:null};
 RIDERS=loadRiders();
 const idx=RIDERS.riders.findIndex(x=>x.id===uid);
 if(idx>=0) RIDERS.riders[idx]=r; else RIDERS.riders.push(r);
 saveRiders();
 return {ok:true,rider:r};
}
async function riderLogin(phone,password){
 phone=(phone||'').trim();
 const email=phoneToInternalEmail(phone,'rider');
 let data,error;
 try{ ({data,error}=await sbRider.auth.signInWithPassword({email,password})); }
 catch(e){ return {ok:false,reason:'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 if(error) return {ok:false,reason:'เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง'};
 const {data:prof,error:profErr}=await sbRider.from('profiles').select('id,name,phone,photo,banned,created_at,availability_status,service_area,services,bio,starting_price').eq('id',data.user.id).single();
 if(profErr||!prof){ await sbRider.auth.signOut(); return {ok:false,reason:'ไม่พบข้อมูลบัญชีนี้ กรุณาลองใหม่'}; }
 if(prof.banned){ await sbRider.auth.signOut(); return {ok:false,reason:'บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'}; }
 const r={id:prof.id,name:prof.name,phone:prof.phone,photo:prof.photo||null,banned:prof.banned,createdAt:prof.created_at,availabilityStatus:prof.availability_status||'available',serviceArea:prof.service_area||'',services:prof.services||'',bio:prof.bio||'',startingPrice:prof.starting_price!=null?Number(prof.starting_price):null};
 RIDERS=loadRiders();
 const idx=RIDERS.riders.findIndex(x=>x.id===r.id);
 if(idx>=0) RIDERS.riders[idx]=r; else RIDERS.riders.push(r);
 saveRiders();
 return {ok:true,rider:r};
}
async function updateRiderProfile(id,{name,phone,password,photo,serviceArea,services,bio,startingPrice}){
 RIDERS=loadRiders();
 const r=findRiderById(id); if(!r) return {ok:false,reason:'ไม่พบบัญชีนี้'};
 const newPhone=phone!=null?phone.trim():r.phone;
 // เฟส 2 ยังไม่รองรับเปลี่ยนเบอร์โทร (= เปลี่ยน email ภายในที่ผูกกับ Supabase Auth) เพื่อความปลอดภัย/เสถียร
 // ก่อน — ชื่อ/รหัสผ่าน/รูปยังแก้ไขได้ปกติ ถ้าจำเป็นต้องเปลี่ยนเบอร์ให้ติดต่อแอดมินไปก่อน
 if(newPhone!==r.phone) return {ok:false,reason:'ยังไม่รองรับการเปลี่ยนเบอร์โทรในเฟสนี้ กรุณาติดต่อผู้ดูแลระบบ (ชื่อ/รหัสผ่าน/รูปโปรไฟล์แก้ไขได้ตามปกติ)'};
 const patch={};
 if(name!=null&&name.trim()) patch.name=name.trim();
 if(photo!==undefined) patch.photo=photo;
 if(serviceArea!=null) patch.service_area=serviceArea.trim(); // Platform v2: พื้นที่ให้บริการที่ไรเดอร์ประกาศเอง (ข้อความ ไม่ใช่พิกัด GPS)
 if(services!=null) patch.services=services; // เฟส Match Marketplace: ประเภทบริการที่รับ (คั่นด้วยจุลภาค เช่น "รับหิ้ว,ส่งของ")
 if(bio!=null) patch.bio=bio.trim(); // เฟส Match Marketplace: คำแนะนำตัวสั้น ๆ แสดงในหน้าโปรไฟล์ให้ลูกค้าเห็นก่อน MATCH
 // เฟส "รื้อ Frontend ใหม่ตาม Reference": ราคาเริ่มต้นที่ผู้ให้บริการกำหนดเอง (แสดงในการ์ดหน้าแรกลูกค้า) —
 // startingPrice===undefined แปลว่ายังไม่แก้ไข, null แปลว่าตั้งใจล้างค่า (กลับไปเป็น "สอบถามราคาในแชท"), ตัวเลข=ตั้งราคา
 if(startingPrice!==undefined) patch.starting_price=(startingPrice===null||startingPrice==='')?null:Number(startingPrice);
 if(Object.keys(patch).length){
  const {error}=await sbRider.from('profiles').update(patch).eq('id',id);
  if(error) return {ok:false,reason:'บันทึกโปรไฟล์ไม่สำเร็จ: '+error.message};
 }
 if(password){
  const {error:pwErr}=await sbRider.auth.updateUser({password});
  if(pwErr) return {ok:false,reason:'เปลี่ยนรหัสผ่านไม่สำเร็จ: '+pwErr.message};
 }
 if(name!=null&&name.trim()) r.name=name.trim();
 if(photo!==undefined) r.photo=photo;
 if(serviceArea!=null) r.serviceArea=serviceArea.trim();
 if(services!=null) r.services=services;
 if(bio!=null) r.bio=bio.trim();
 if(startingPrice!==undefined) r.startingPrice=(startingPrice===null||startingPrice==='')?null:Number(startingPrice);
 saveRiders();
 return {ok:true,rider:r};
}
/* ---------- Platform v2: สถานะเปิด/ปิดรับงานของไรเดอร์ (availability_status) — เขียนลง Supabase จริงเสมอ
   (ไม่ใช่ localStorage เป็นแหล่งความจริงหลัก) ผ่าน profiles_update_own (row-level, มีอยู่แล้วตั้งแต่เฟส 1)

let riderAvailabilityBusy=false;
async function riderSetAvailability(status){
