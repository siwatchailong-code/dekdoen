<style>
:root{
 --navy:#0b2f55;--blue:#1769b0;--blue2:#0f548f;--yellow:#f4c542;--bg:#f5f7fa;
 --card:#fff;--line:#dfe7f0;--text:#172334;--muted:#6d7b8c;--green:#17945b;--red:#d64545;
}
*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",Arial,sans-serif;overflow-wrap:break-word;word-break:break-word}
button,input,textarea{font:inherit}button{cursor:pointer}
.top{height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;box-shadow:0 5px 18px #08284a22;flex-wrap:wrap;row-gap:10px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff}.brand b{font-size:22px}.brand small{display:block;font-size:11px;color:#b9d0e8;margin-top:2px}
.headerRight{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roles{display:flex;gap:7px}.role{border:1px solid #ffffff2e;background:#ffffff10;color:#dcecff;border-radius:12px;padding:10px 14px;font-weight:800}.role.active{background:var(--yellow);color:#4d3a00;border-color:var(--yellow)}
.icon-btn{background:#ffffff14;border:1px solid #ffffff2e;color:#fff;border-radius:12px;width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;font-size:18px;position:relative}
.icon-btn.muted{opacity:.55}
.notif-wrap{position:relative}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 4px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
.notif-panel{position:absolute;top:52px;right:0;width:320px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 15px 40px #0004;z-index:60;color:var(--text)}
.notif-panel .nph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0}
.notif-panel .nph b{font-size:13px}
.notif-panel .nph button{border:0;background:none;color:var(--blue);font-size:11px;font-weight:800;cursor:pointer}
.notif-item{padding:11px 14px;border-bottom:1px solid #f0f3f7;font-size:12px;cursor:pointer}
.notif-item:last-child{border-bottom:0}
.notif-item.unread{background:#f4f9ff}
.notif-item .ntitle{font-weight:900;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.notif-item .ntitle .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.notif-item .nbody{color:var(--muted)}
.notif-item .ntime{font-size:10px;color:#9fb0c2;margin-top:3px}
.notif-empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:850px){.notif-panel{position:fixed;top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:60vh}}
.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}
.hero{background:linear-gradient(135deg,#0b3a70,#1470cc);color:#fff;border-radius:18px;padding:30px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;box-shadow:0 10px 26px rgba(10,47,85,.10)}
.hero h1{margin:0 0 6px;font-size:29px}.hero p{margin:0;color:#d8eaff;line-height:1.5;font-size:14px}.hero .pill{background:#ffffff18;border:1px solid #ffffff2b;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:800;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.8fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 5px 20px rgba(24,60,100,.07);margin-bottom:18px}.card h2{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
label{font-size:12px;font-weight:800;color:#556579;display:block;margin:0 0 6px}.field{margin-bottom:13px}input,textarea,select{width:100%;border:1px solid #d5e0eb;background:#fbfdff;border-radius:12px;padding:12px 13px;outline:none;max-width:100%}input:focus,textarea:focus,select:focus{border-color:#5b9ee4;box-shadow:0 0 0 3px #1268c414}textarea{min-height:86px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900}.primary{background:var(--blue);color:#fff}.yellow{background:var(--yellow);color:#4d3a00}.ghost{background:#eef4fa;color:#31506f}.green{background:var(--green);color:#fff}.danger{background:#fff0f0;color:var(--red)}
.stop{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:#fcfdff}.stophead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:900;font-size:13px}.stoptitle{font-weight:900;flex:1}.stoptools{display:flex;gap:5px}.stoptools button{border:0;border-radius:8px;padding:6px 8px;background:#eef3f8;color:#607084;font-size:11px}
.map{height:180px;border-radius:15px;position:relative;overflow:hidden;border:1px solid #cbd8e6;background:
linear-gradient(24deg,transparent 47%,#fff 48%,#fff 49%,transparent 50%),
linear-gradient(155deg,transparent 45%,#fff 46%,#fff 48%,transparent 49%),
linear-gradient(90deg,#e7eef3 1px,transparent 1px),linear-gradient(#e7eef3 1px,transparent 1px);
background-size:auto,auto,38px 38px,38px 38px;background-color:#dfe9ee;margin:10px 0}
.map .searchbox{position:absolute;top:10px;left:10px;right:100px;background:#fff;border-radius:11px;padding:10px 12px;box-shadow:0 3px 12px #0002;color:#7b8795;font-size:12px}.map .maplabel{position:absolute;right:10px;top:10px;background:#fff;border-radius:9px;padding:8px 10px;font-size:10px;color:#5d6d7f;box-shadow:0 2px 8px #0001}
.pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;background:var(--blue);border:3px solid #fff;transform:translate(-50%,-90%) rotate(-45deg);box-shadow:0 4px 10px #0003;touch-action:none}.pin:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;left:9px;top:9px}
.route{position:absolute;height:5px;background:#1268c4;transform-origin:left center;border-radius:5px;opacity:.9}.mapnote{position:absolute;bottom:10px;left:10px;background:#ffffffdd;border-radius:9px;padding:7px 9px;font-size:10px;color:#526477}
.photo{border:1.5px dashed #b8cce0;border-radius:12px;padding:13px;text-align:center;color:var(--blue);background:#f8fbff;font-size:12px;cursor:pointer;transition:.18s}.photo:hover{border-color:var(--blue);background:#f3f8fd}.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.thumb{position:relative;width:64px;height:64px}.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block}.thumb-remove{position:absolute;right:-5px;top:-5px;width:19px;height:19px;border:0;border-radius:50%;background:#fff;color:#8a2631;box-shadow:0 2px 8px #0002;cursor:pointer;font-size:12px;line-height:19px;padding:0}.photo-hint{margin-top:6px;font-size:10px;color:#7a8a9b}
.summary{position:sticky;top:92px}.pricebox{background:#eef6ff;border-radius:15px;padding:15px;margin:12px 0}.pricebig{font-size:32px;font-weight:900;color:var(--blue)}.line{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font-size:13px}.line.total{padding-top:12px;border-top:1px solid #cfddea;font-weight:900;font-size:16px}.status{display:inline-flex;align-items:center;gap:6px;background:#eaf8f1;color:#21734c;border:1px solid #cce9d9;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:#22a464}
.linkbox{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:11px;word-break:break-all;color:#526174}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #cbd7e3;border-radius:14px;background:#fafcff}
.rider-stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f5}.rider-stop:last-child{border-bottom:0}.rnum{width:38px;height:38px;border-radius:12px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.tag{display:inline-block;font-size:10px;padding:5px 8px;border-radius:8px;background:#f1f5f8;color:#627184;margin-top:5px}
.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#15283d;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #0003;display:none;z-index:50;font-size:13px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
.badge.st-PENDING{background:#fff4e0;color:#9a6400}.badge.st-ASSIGNED{background:#eaf2ff;color:#1a4fa0}.badge.st-TO_PICKUP{background:#eef0ff;color:#4b3fa8}.badge.st-DELIVERING{background:#e8f7ff;color:#0d6b9c}.badge.st-DONE{background:#eaf8f1;color:#17945b}.badge.st-CANCELLED{background:#fdeaea;color:#b02a2a}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#f3f7fb;color:#4c5c70;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:800}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.searchbar{display:flex;gap:8px;margin-bottom:14px}.searchbar input{flex:1}
.jobhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.jobmini{font-size:12px;color:var(--muted);margin:3px 0}
.chatbox{border:1px solid var(--line);border-radius:14px;padding:12px;height:680px;max-height:680px;overflow-y:auto;background:#f8fafc;margin-bottom:10px;scroll-behavior:smooth}
@media(max-width:1050px){.chatbox{height:480px;max-height:480px}}
@media(max-width:600px){.chatbox{height:400px;max-height:400px}}
.chatmsg{max-width:80%;padding:8px 11px;border-radius:12px;margin:6px 0;font-size:13px;word-break:break-word;overflow-wrap:anywhere}.chatmsg.me{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:3px}.chatmsg.other{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.chatmsg .who{font-size:10px;opacity:.85;margin-bottom:4px;font-weight:800;display:flex;align-items:center;gap:5px}
.chatmsg .who .whorole{background:#ffffff30;border-radius:6px;padding:1px 6px;font-size:9px;font-weight:900}
.chatmsg.other .who .whorole{background:#eef3f8;color:#5a6c80}
.chatmsg .who .whotime{margin-left:auto;opacity:.85;font-weight:600;white-space:nowrap}
.chat-partner{display:flex;align-items:center;gap:9px;margin-bottom:10px;background:#f4f9ff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.chat-partner b{font-size:13px}.chat-partner .tag{margin-top:2px}
.chatimg{display:block;max-width:220px;max-height:260px;width:auto;height:auto;border-radius:10px;cursor:zoom-in;margin-bottom:6px}
@media(max-width:600px){.chatimg{max-width:170px;max-height:200px}}
.chatrow{display:flex;gap:8px;align-items:flex-end}
.chatrow input{flex:1;min-width:0}
.chat-attach-btn{padding:11px 12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chat-attach-preview{margin-bottom:8px}
.attach-chip{display:inline-flex;align-items:center;gap:8px;background:#eef4fa;border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}
.attach-chip img{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block}
.attach-chip .attach-remove{border:0;border-radius:50%;width:22px;height:22px;background:#fff;color:#8a2631;box-shadow:0 2px 8px #0002;cursor:pointer;font-size:13px;line-height:22px;padding:0}
.lightbox{position:fixed;inset:0;background:rgba(9,20,34,.9);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px #0008}
.collapse{border:1px dashed #b8cce0;border-radius:14px;background:#fbfdff}.collapse>summary{cursor:pointer;padding:14px;font-weight:900;color:var(--blue);list-style:none}.collapse>summary::-webkit-details-marker{display:none}.collapse[open]>summary{border-bottom:1px solid var(--line)}.collapse .inner{padding:14px}
.timeline{margin:10px 0}.tlrow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12px;color:#526174}.tlrow b{color:var(--text)}
.stopview{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fcfdff}.stopview .sline{font-size:13px;margin:3px 0}
.miniphoto{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);margin-right:4px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid #b9c8d8;display:inline-grid;place-items:center;font-weight:900;cursor:pointer;color:#8aa0b6;margin-left:8px}
.check.on{background:var(--green);border-color:var(--green);color:#fff}
@media(max-width:850px){.top{height:auto;padding:12px 14px;gap:12px;align-items:flex-start}.roles{overflow:auto}.role{white-space:nowrap}.hero{display:block;padding:22px}.hero .pill{display:inline-block;margin-top:15px}.grid{grid-template-columns:1fr}.summary{position:static}.row{grid-template-columns:1fr}.wrap{padding:18px 12px 45px}.brand b{font-size:19px}}
</style>

<header class="top">
 <div class="brand"><img class="brand-logo" src="logo.jpg" alt="เด็กเดิน — Dek-Dern"><div><b>เด็กเดิน</b><small>ระบบจัดการงานรับหิ้ว • ส่งถึงที่</small></div></div>
 <div class="headerRight">
  <div class="roles">
   <button class="role active" data-role="admin">แอดมิน</button>
   <button class="role" data-role="customer">ลูกค้า</button>
   <button class="role" data-role="rider">ไรเดอร์</button>

  <div class="notif-wrap">

 </div>

<main class="wrap">
<section class="hero">
 <div><h1 id="heroTitle">จัดการงานรับหิ้ว</h1><p id="heroText">สร้างออเดอร์ เพิ่มจุดรับ-ส่งของ ผูกสินค้าและรูปกับแต่ละจุด แล้วส่งใบงานให้ไรเดอร์ในครั้งเดียว</p></div>
 <div class="pill">ระบบพร้อมใช้งาน</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ======================= UTIL ======================= */
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>x.style.display='none',2400)}
function baht(n){return Number(n||0).toLocaleString('th-TH')+' ฿'}
function nowISO(){return new Date().toISOString()}
function fmtTime(iso){try{const d=new Date(iso);return d.toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}catch{return iso}}
// เฟส 3 (fix): ตรวจว่าเป็น UUID จริงจาก Supabase Auth เท่านั้น — ใช้กันไม่ให้ id เก่าจากยุค localStorage
// ล้วน (เช่น "cus_1788174381337_xxxxx" / "rdr_..." ก่อนเชื่อม Supabase) หลุดรอดไปใช้เป็น customer_id/
// sender_id/rider_id เวลาเขียนลง Supabase จริง (คอลัมน์เหล่านี้เป็น type uuid เท่านั้น ส่งค่าอื่นเข้าไปจะ error)
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function isUuid(v){ return typeof v==='string' && UUID_RE.test(v); }
function baseUrl(){return location.origin+location.pathname}
function copyText(v){navigator.clipboard?.writeText(v);toast('คัดลอกลิงก์แล้ว')}

/* ======================= Supabase client (เชื่อม backend จริง — เฟส 2) =======================
   ใช้ client แยก 3 instance (customer/rider/admin) เก็บ session คนละ storage key เพื่อรักษาพฤติกรรมเดิม
   ที่ให้ล็อกอินเป็นลูกค้า + ไรเดอร์ + แอดมิน "พร้อมกันในแท็บเดียว" ได้ (เดิมแยกด้วย CUSTOMER_SESSION_KEY
   แบบ localStorage vs RIDER/ADMIN_SESSION_KEY แบบ sessionStorage) — ถ้าใช้ client เดียวกันทั้ง 3 role
   จะเก็บ session ได้แค่อันเดียว ล็อกอินไรเดอร์แล้วจะเด้งลูกค้าออกทันที ซึ่งพังพฤติกรรมเดิม
   สำคัญ: ใช้ Publishable Key (เดิมเรียก anon key) เท่านั้น ห้ามใช้ Secret/service_role key ในหน้าเว็บเด็ดขาด
   สิทธิ์ทุกอย่างถูกบังคับด้วย Row Level Security ฝั่ง Supabase (ดู supabase/migrations/0001_init.sql) */
const SUPABASE_URL='https://ptktomwmnnvlsjaiclvv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_4MpZOC76iZsraUonFXyqAw_Dvxv1bWM';
const sbCustomer=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'dekdoen-sb-customer',storage:window.localStorage,persistSession:true,autoRefreshToken:true}});
const sbRider=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'dekdoen-sb-rider',storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}});
const sbAdmin=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'dekdoen-sb-admin',storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}});

/* ======================= Google Maps (จุดรับ-ส่งบนแผนที่ ตอนสร้างออเดอร์ลูกค้า) =======================
   *** ใส่ Google Maps API Key ของคุณเองตรงบรรทัดถัดไป (ค่าว่างตอนนี้โดยตั้งใจ) ***
   คีย์นี้เป็นคนละประเภทกับ SUPABASE_SERVICE_ROLE_KEY: Google Maps API Key ถูกออกแบบมาให้ใช้งานฝั่ง frontend
   ได้ตามปกติ (จำกัดสิทธิ์การใช้งานด้วย "HTTP referrer restriction" ที่ตั้งค่าใน Google Cloud Console แทน ไม่ใช่

//  1) playOrderChime()  — เสียง "อินโทร" เอกลักษณ์ของแอป ยาว ~2.5 วิ ใช้เฉพาะตอนมีออเดอร์ใหม่เข้าระบบ (Rider/Admin) เท่านั้น

function ensureAudioCtx(){
 try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); }catch(e){}
 return audioCtx;
}

['click','touchstart','keydown'].forEach(evt=>document.addEventListener(evt,ensureAudioCtx,{once:true,passive:true}));
// เล่นโน้ตเดี่ยวด้วย oscillator หลัก + harmonic เบา ๆ ซ้อนขึ้นหนึ่งอ็อกเทฟ ให้ฟังดูมีมิติแบบระฆัง/ระนาดอ่อน ๆ
// ไม่ใช่เสียง sine เดี่ยวแบนราบแบบ beep เดิม — ใช้เป็นบล็อกพื้นฐานประกอบเป็นทำนองสั้น ๆ ของทั้ง 3 เสียงด้านล่าง
function playTone(freq,startAt,dur,peakGain,type){
 if(!audioCtx) return;
 try{
  const t0=audioCtx.currentTime+startAt;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peakGain,t0+Math.min(0.03,dur*0.25));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.03);
  const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
  o2.type='sine'; o2.frequency.value=freq*2;
  g2.gain.setValueAtTime(0.0001,t0);
  g2.gain.exponentialRampToValueAtTime(peakGain*0.16,t0+Math.min(0.02,dur*0.2));
  g2.gain.exponentialRampToValueAtTime(0.0001,t0+dur*0.7);
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.start(t0); o2.stop(t0+dur*0.7+0.03);
 }catch(e){ /* ห้ามให้ error หลุดออกไปกระทบระบบอื่น */ }
}

// เสียงแจ้งเตือนอัปเดตสถานะทั่วไป — สั้น นุ่มกว่าเสียงออเดอร์ใหม่ ใช้ตอนสถานะงานเปลี่ยน/ไรเดอร์รับงาน-จบงานเอง

// เพิ่มพารามิเตอร์ตัวเลือก distanceKm (ระยะทางจริงจาก Google Maps หน่วยกิโลเมตร) — ถ้าไม่ส่งมา (undefined)
// จะเท่ากับ 0 พฤติกรรมเดิมทุกประการ (ราคาที่คำนวณไม่เปลี่ยนแปลงจากเดิมเลยถ้าไม่ได้ใช้แผนที่) ใช้ค่า
// rates_config.km (ค่าบริการต่อกิโลเมตร ที่มีอยู่แล้วในระบบตั้งแต่เฟส 1 แต่ยังไม่เคยถูกใช้จริงในสูตรราคา) —
// ไม่ได้สร้างระบบราคาใหม่ซ้อน แค่เติมองค์ประกอบระยะทางเข้าไปในฟังก์ชันราคาเดิมฟังก์ชันเดียวที่ใช้อยู่ทั้งระบบ
function calcPricing(stopsCount,goods,distanceKm){
 const r=DB.rates;
 const extra=Math.max(0,stopsCount-1)*Number(r.perStop||0);
 const distanceFee=Number(distanceKm||0)*Number(r.km||0);
 const fee=Number(r.base||0)+extra+distanceFee;
 const commission=Math.round(fee*Number(r.commission||0)/100);
 const riderEarn=fee-commission;
 const total=Number(goods||0)+fee;
 return {goods:Number(goods||0),fee,extra,distanceFee,distanceKm:Number(distanceKm||0),commission,riderEarn,total};
}
// ราคาแยกรายงาน (งานที่ 1 = ค่าบริการเริ่มต้น, งานที่ 2 เป็นต้นไป = ค่าบริการต่อจุดเพิ่ม) — ใช้สูตรราคาเดิมทุกประการ แค่แยกแสดงเป็นรายการ
function perJobFees(stopsCount){
 const r=DB.rates; const fees=[];
 for(let i=0;i<stopsCount;i++) fees.push(i===0?Number(r.base||0):Number(r.perStop||0));
 return fees;
}

  pickup_lat:(pickupLat===undefined||pickupLat===null)?null:Number(pickupLat),
  pickup_lng:(pickupLng===undefined||pickupLng===null)?null:Number(pickupLng),
  dropoff_lat:(dropoffLat===undefined||dropoffLat===null)?null:Number(dropoffLat),
  dropoff_lng:(dropoffLng===undefined||dropoffLng===null)?null:Number(dropoffLng),
  distance_km:(distanceKm===undefined||distanceKm===null)?null:Number(distanceKm)
 };
 const {data,error}=await client.from('orders').insert(payload).select().single();
 if(error){ toast('สร้างออเดอร์ไม่สำเร็จ: '+error.message); return null; }
 upsertOrder(data);

/* ---------- เฟส 3: sync + realtime — เชื่อม DB.orders (cache กลางเดิม) เข้ากับ Supabase จริง ----------
   หลักการ: โค้ด render ทั้งหมด (renderAdminList/renderCustomerRoot/renderRiderJobRoom ฯลฯ) อ่าน DB.orders
   ตรง ๆ เหมือนเดิมทุกจุด ไม่ต้องแก้ — สิ่งที่เปลี่ยนคือ DB.orders ถูก "เติม/อัปเดต" จากฐานข้อมูลจริงแทนการเขียน
   ลง localStorage เอง โดย 2 ทาง: (1) ดึงข้อมูลทั้งหมดที่ role นั้นมีสิทธิ์เห็นตาม RLS ทันทีหลัง login/สมัคร/หรือมี

   ทุกครั้งที่ DB.orders เปลี่ยนจะเรียก fireChange() ตัวเดิม ซึ่งไปกระตุ้น render ทุกจอ + checkForNotifiableEvents()
   (แจ้งเตือน+เสียงอินโทร) โดยอัตโนมัติอยู่แล้วตามที่ boot() ผูก dbListeners ไว้ — ไม่ต้องเพิ่มโค้ดแจ้งเตือน/เสียงแยก */
function clientForRole(role){ return role==='rider'?sbRider: role==='admin'?sbAdmin: sbCustomer; }
function mapOrderRow(row){
 return {
  id:row.id, status:row.status, createdAt:row.created_at, createdBy:row.created_by,
  customerId:row.customer_id,
  customer:{name:row.customer_name||'',contact:row.customer_contact||'',note:row.customer_note||''},
  stops:row.stops||[], pricing:row.pricing||{}, timeline:row.timeline||[],
  rider:row.rider_id?{riderId:row.rider_id,name:row.rider_name||''}:null,
  pickupLat:row.pickup_lat??null, pickupLng:row.pickup_lng??null,
  dropoffLat:row.dropoff_lat??null, dropoffLng:row.dropoff_lng??null,
  distanceKm:row.distance_km??null,
  chat:[] // เติมทีหลังจาก chat_messages แยกต่างหาก — ดู upsertOrder/upsertChatMessage
 };
}
function upsertOrder(row,opts){
 const mapped=mapOrderRow(row);
 const idx=DB.orders.findIndex(o=>o.id===row.id);
 if(idx>=0){ mapped.chat=DB.orders[idx].chat; DB.orders[idx]=mapped; } // รักษาแชทที่โหลดไว้แล้วของออเดอร์นี้
 else{ DB.orders.unshift(mapped); }
 if(!opts||!opts.silent) fireChange(false);
}
function upsertChatMessage(row,opts){
 const o=findOrder(row.order_id); if(!o) return;
 if(o.chat.some(m=>m.id===row.id)) return; // กันซ้ำ (realtime อาจส่งมาซ้ำได้ในบางจังหวะ)
 o.chat.push({id:row.id, from:row.sender_role, text:row.text||'', image:row.image||null, at:row.created_at});
 o.chat.sort((a,b)=>new Date(a.at)-new Date(b.at));
 if(!opts||!opts.silent) fireChange(false);
}
async function syncOrdersForClient(client){

 const {data,error}=await client.from('chat_messages').select('*').order('created_at',{ascending:true});

 if(error||!data) return;

}
const REALTIME_CHANNELS={customer:null,rider:null,admin:null};
// สำคัญ: supabase-js v2 มี race condition ที่รู้จัก — ถ้า subscribe() ทันทีหลัง signIn/signUp
// อาจได้ realtime auth token เก่า (ก่อน login) เพราะตัว listener ที่ push token ใหม่เข้า
// realtime socket (onAuthStateChange) ทำงานแบบ async แยกต่างหาก ไม่รับประกันว่าจะเสร็จก่อน
// subscribe() ถูกเรียก — ผลคือ REST query เห็นข้อมูลถูกต้อง (RLS ผ่าน) แต่ realtime event ไม่มาเลย
// เพราะ RLS ของฝั่ง realtime ยัง evaluate ด้วย token เก่า (มักเป็น anon) จึงต้อง setAuth() ด้วย
// access_token ปัจจุบันก่อน subscribe() ทุกครั้ง กันไม่ให้เจอปัญหานี้
// เฟส 3 (แก้ระบบ Admin): บังคับออกจากระบบทันทีถ้าโดนแบนระหว่างมี session ค้างอยู่ (ตรวจจับผ่าน realtime บน
// แถว profiles ของตัวเอง ด้านล่าง) — ไม่ใช่แค่ป้องกันฝั่ง server (RLS/RPC เช็ค is_banned() อยู่แล้วทุกจุดสำคัญ)
// แต่ทำให้ UI สะท้อนสถานะจริงทันทีโดยไม่ต้องรอผู้ใช้ลองทำ action แล้วเจอ error เอง
function handleSelfBanned(role){
 toast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ');
 deactivateRoleSync(role);
 if(role==='customer'){ clearCustomerSession(); customerAuthMode='login'; renderCustomerRoot(); }
 else if(role==='rider'){ clearRiderSession(); riderAuthMode='login'; renderRiderRoot(); }
 else if(role==='admin'){ clearAdminSession(); renderAdminAuthState(); }
}
async function subscribeRealtimeForRole(role){
 const client=clientForRole(role);
 if(REALTIME_CHANNELS[role]){ try{ client.removeChannel(REALTIME_CHANNELS[role]); }catch(e){} REALTIME_CHANNELS[role]=null; }
 let selfId=null;
 try{
  const {data:{session}}=await client.auth.getSession();
  if(session&&session.access_token) client.realtime.setAuth(session.access_token);
  if(session&&session.user) selfId=session.user.id;
 }catch(e){ console.error('realtime setAuth failed',e); }
 const ch=client.channel('dekdoen-'+role)
  .on('postgres_changes',{event:'*',schema:'public',table:'orders'},payload=>{
   if(payload.eventType==='DELETE') return; // ระบบนี้ไม่มีการลบออเดอร์จริง
   upsertOrder(payload.new);
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},payload=>{
   upsertChatMessage(payload.new);
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'rider_credit_entries'},payload=>{
   if(payload.new) upsertCreditEntry(payload.new); fireChange(false);
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'rider_credit_payments'},payload=>{
   upsertCreditPayment(payload.new); fireChange(false);
  });
 if(selfId){
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+selfId},payload=>{
   if(payload.new&&payload.new.banned) handleSelfBanned(role);
  });
 }
 // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): เฉพาะแอดมินเท่านั้นที่ subscribe แบบไม่กรอง table ทั้งหมด
 // (RLS ของ profiles อนุญาตให้ is_admin() อ่านได้ทุกแถวอยู่แล้ว — realtime สืบสิทธิ์จาก RLS เดียวกันเสมอ ไม่ใช่
 // ช่องโหว่ใหม่) เพื่อให้หน้า "จัดการผู้ใช้" ของแอดมินอัปเดตสดทันทีที่มีคนสมัครสมาชิกใหม่/ถูกแบน/ถูกลบบัญชี
 // แทนที่จะต้องรอรีเฟรชหน้าเอง — ดู syncAdminUsersList()/ADMIN_USERS ด้านล่าง
 if(role==='admin'){
  ch.on('postgres_changes',{event:'*',schema:'public',table:'profiles'},payload=>{
   if(payload.eventType==='DELETE') removeAdminUserProfile(payload.old&&payload.old.id);
   else upsertAdminUserProfile(payload.new);
  });
 }
 ch.subscribe();
 REALTIME_CHANNELS[role]=ch;
}
function unsubscribeRealtimeForRole(role){
 const client=clientForRole(role);
 if(REALTIME_CHANNELS[role]){ try{ client.removeChannel(REALTIME_CHANNELS[role]); }catch(e){} REALTIME_CHANNELS[role]=null; }
}
const ROLE_SYNC_ACTIVE={customer:false,rider:false,admin:false};
// เรียกทันทีหลัง login/สมัครสมาชิกสำเร็จ และตอน boot() ถ้ามี session ค้างอยู่แล้ว (เปิดหน้าเว็บซ้ำ) — กันเรียกซ้ำด้วยธง ROLE_SYNC_ACTIVE
// สำคัญ: sync รอบแรกต้อง "เงียบ" ทั้งหมด (ไม่เรียก fireChange ระหว่างทาง) แล้วค่อย seed baseline การแจ้งเตือน
// (ensureNotifBaseline) จาก DB.orders ที่โหลดจริงแล้วก่อนเปิด realtime เสมอ — มิฉะนั้นออเดอร์/งานเก่าที่มีอยู่ก่อน
// จะถูกนับเป็น "ใหม่" แล้วเด้งแจ้งเตือน+เสียงย้อนหลังทั้งหมดทุกครั้งที่ login/เปิดหน้าเว็บ (บั๊กจริงที่ตรวจพบระหว่างทำ)
async function activateRoleSync(role){
 if(ROLE_SYNC_ACTIVE[role]) return;
 ROLE_SYNC_ACTIVE[role]=true;
 const client=clientForRole(role);
 const tasks=[syncOrdersForClient(client),syncChatForClient(client),syncRatesForClient(client),syncCreditForClient(client)];
 // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): เฉพาะแอดมินต้องโหลดรายชื่อผู้ใช้ทั้งหมดจริงจาก Supabase มาไว้ใน
 // ADMIN_USERS ด้วย (ดูคอมเมนต์ที่นิยาม ADMIN_USERS ด้านล่าง สำหรับที่มาของปัญหาเดิม)
 if(role==='admin') tasks.push(syncAdminUsersList());
 await Promise.all(tasks);
 ensureNotifBaseline(role);
 await subscribeRealtimeForRole(role);
 fireChange(false);
}
function deactivateRoleSync(role){
 ROLE_SYNC_ACTIVE[role]=false;
 unsubscribeRealtimeForRole(role);
}

// เฟส 3: ส่งข้อความแชทลง Supabase จริง (ตาราง chat_messages) — RLS บังคับว่า sender_id ต้องตรงกับผู้ login
// เองเท่านั้น (กันปลอมตัวเป็นคนอื่นส่งข้อความ) realtime จะส่งข้อความนี้กลับมาแสดงในทุกแท็บที่เกี่ยวข้องอัตโนมัติ
async function addChat(id,from,text,image){
 const t=(text||'').trim();
 if(!t&&!image) return;
 const client=from==='rider'?sbRider:sbCustomer;
 const sender=from==='rider'?currentRider():currentCustomer();
 if(!sender){ toast('กรุณาเข้าสู่ระบบก่อนส่งข้อความ'); return; }
 // เฟส 3 (fix): เช่นเดียวกับตอนสร้างออเดอร์ — ดึง user.id จาก Supabase Auth จริงมาใช้เป็น sender_id เสมอ
 // ห้ามใช้ sender.id จาก local mirror ตรงๆ กัน id เก่าก่อนเชื่อม Supabase หลุดเข้าไปเขียนลง DB
 const authId=from==='rider'?await requireRiderAuthId():await requireCustomerAuthId();
 if(!authId){ toast('เซสชันหมดอายุหรือไม่ถูกต้อง กรุณาเข้าสู่ระบบใหม่'); return; }
 const {data,error}=await client.from('chat_messages').insert({order_id:id,sender_role:from,sender_id:authId,text:t,image:image||null}).select().single();
 if(error){ toast('ส่งข้อความไม่สำเร็จ: '+error.message); return; }
 upsertChatMessage(data);
}

/* ======================= ศูนย์การแจ้งเตือน (แยกคีย์ localStorage จากออเดอร์ ไม่กระทบ DB เดิม) ======================= */
/* สำคัญ: แยกเก็บเป็น "คนละคีย์ localStorage ต่อ role" (rider / customer / admin) แทนที่จะรวมเป็นก้อนเดียวกันทั้งหมด
   เหตุผล: ถ้ารวมเป็น object ก้อนเดียว เวลาแท็บ A (เช่นแท็บลูกค้า) กับแท็บ B (เช่นแท็บไรเดอร์ที่เพิ่งรับงาน) ต่างก็ต้อง
   save ทับกันในคีย์เดียวกันเกือบพร้อมกัน (แท็บอื่นเป็นคนละ process กันจริง ๆ ไม่ใช่แค่คิวใน thread เดียว) จะเกิด
   lost-update ข้ามความสนใจกันได้ (เช่นแท็บลูกค้าบันทึกทับ baseline แชทที่แท็บไรเดอร์เพิ่ง seed ไว้)
   การแยกคีย์ตาม role ทำให้แท็บที่ไม่เกี่ยวข้องกับ role นั้นไม่มีทางเขียนทับข้อมูลของ role อื่นได้เลย */
const NOTIF_RIDER_KEY='dekdoen_notif_rider_v1';
const NOTIF_CUSTOMER_KEY='dekdoen_notif_customer_v1';
const NOTIF_ADMIN_KEY='dekdoen_notif_admin_v1';
function defaultRiderNotif(){ return { list:[], seen:{ baselineSeeded:false, riderJobs:[], riderChat:{} } }; }
function defaultCustomerNotif(){ return { list:[], seen:{ customerStatus:{}, customerChat:{} } }; }
function defaultAdminNotif(){ return { list:[], seen:{ baselineSeeded:false, adminStatus:{} } }; }
function loadStore(key,defFn){
 try{
  const raw=localStorage.getItem(key);
  if(!raw) return defFn();
  const d=JSON.parse(raw);
  const def=defFn();
  return Object.assign(def,d,{seen:Object.assign(def.seen,d.seen||{})});
 }catch(e){ return defFn(); }
}
function loadRiderNotif(){ return loadStore(NOTIF_RIDER_KEY,defaultRiderNotif); }
function loadCustomerNotif(){ return loadStore(NOTIF_CUSTOMER_KEY,defaultCustomerNotif); }
function loadAdminNotif(){ return loadStore(NOTIF_ADMIN_KEY,defaultAdminNotif); }
let NOTIF_RIDER=loadRiderNotif();
let NOTIF_CUSTOMER=loadCustomerNotif();
let NOTIF_ADMIN=loadAdminNotif();
let notifListeners=[];
function saveRiderNotif(){ try{ localStorage.setItem(NOTIF_RIDER_KEY,JSON.stringify(NOTIF_RIDER)); }catch(e){} notifListeners.forEach(fn=>{try{fn(false)}catch(e){}}); }
function saveCustomerNotif(){ try{ localStorage.setItem(NOTIF_CUSTOMER_KEY,JSON.stringify(NOTIF_CUSTOMER)); }catch(e){} notifListeners.forEach(fn=>{try{fn(false)}catch(e){}}); }
function saveAdminNotif(){ try{ localStorage.setItem(NOTIF_ADMIN_KEY,JSON.stringify(NOTIF_ADMIN)); }catch(e){} notifListeners.forEach(fn=>{try{fn(false)}catch(e){}}); }
window.addEventListener('storage',e=>{
 if(e.key===NOTIF_RIDER_KEY){ NOTIF_RIDER=loadRiderNotif(); notifListeners.forEach(fn=>{try{fn(true)}catch(e){}}); }
 else if(e.key===NOTIF_CUSTOMER_KEY){ NOTIF_CUSTOMER=loadCustomerNotif(); notifListeners.forEach(fn=>{try{fn(true)}catch(e){}}); }
 else if(e.key===NOTIF_ADMIN_KEY){ NOTIF_ADMIN=loadAdminNotif(); notifListeners.forEach(fn=>{try{fn(true)}catch(e){}}); }
});
function storeForRole(role){ return role==='rider'?NOTIF_RIDER: role==='admin'?NOTIF_ADMIN: NOTIF_CUSTOMER; }
function saveForRole(role){ if(role==='rider') saveRiderNotif(); else if(role==='admin') saveAdminNotif(); else saveCustomerNotif(); }
function pushNotification(role,{title,body,orderId}){
 const n={ id:'ntf_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), title, body:body||'', orderId:orderId||null, at:nowISO(), read:false };
 const store=storeForRole(role);
 store.list.unshift(n);
 if(store.list.length>200) store.list.length=200; // กันโตไม่จำกัด
 return n;
}
// เฟส 3: เรียกจาก activateRoleSync() หลังโหลดข้อมูลจริงจาก Supabase เสร็จ "เฉพาะของ role ที่เพิ่ง sync" เท่านั้น
// (ไม่ใช่ตอน boot() แบบเดิมอีกต่อไป เพราะตอนนั้น DB.orders ยังว่างเปล่า ยังไม่ทัน sync จริง) — ระบุ role เพื่อกัน
// role หนึ่ง seed baseline ของอีก role ด้วยข้อมูลที่ตัวเองมองเห็นไม่ครบ (เช่นไรเดอร์เห็นแค่ PENDING+งานตัวเอง
// ไม่เห็นออเดอร์ DONE ของคนอื่นเหมือนแอดมิน) กันไม่ให้ออเดอร์ที่มีอยู่ก่อนถูกนับเป็น "ใหม่" แล้วแจ้งเตือนย้อนหลัง
function ensureNotifBaseline(role){
 if((!role||role==='rider') && !NOTIF_RIDER.seen.baselineSeeded){
  NOTIF_RIDER.seen.riderJobs=DB.orders.filter(o=>o.status==='PENDING').map(o=>o.id);
  NOTIF_RIDER.seen.baselineSeeded=true;
  saveRiderNotif();
 }
 if((!role||role==='admin') && !NOTIF_ADMIN.seen.baselineSeeded){
  NOTIF_ADMIN.seen.adminStatus={};
  DB.orders.forEach(o=>{ NOTIF_ADMIN.seen.adminStatus[o.id]=o.status; });
  NOTIF_ADMIN.seen.baselineSeeded=true;
  saveAdminNotif();
 }
}
function checkRiderJobNotifications(){
 let changed=false;
 DB.orders.filter(o=>o.status==='PENDING').forEach(o=>{

function checkRiderChatNotifications(){

/* เชื่อม Supabase Auth จริงแล้ว (เฟส 2) — เบอร์โทรแปลงเป็น email ภายในปลอม (phoneToInternalEmail) ก่อนส่งให้

async function riderSignup({name,phone,password,photo}){
 name=(name||'').trim(); phone=(phone||'').trim();
 if(!name) return {ok:false,reason:'กรุณากรอกชื่อจริง'};
 if(!phone) return {ok:false,reason:'กรุณากรอกเบอร์โทรศัพท์'};

 const email=phoneToInternalEmail(phone,'rider');
 let data,error;
 try{ ({data,error}=await sbRider.auth.signUp({email,password,options:{data:{role:'rider',name,phone}}})); }
 catch(e){ return {ok:false,reason:'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 if(isDuplicateSignup(error,data)) return {ok:false,reason:'เบอร์นี้ถูกใช้สมัครแล้ว กรุณาเข้าสู่ระบบแทน'};
 if(error) return {ok:false,reason:'สมัครสมาชิกไม่สำเร็จ: '+error.message};
 const uid=data.user.id;
 if(photo){ try{ await sbRider.from('profiles').update({photo}).eq('id',uid); }catch(e){} }
 const r={id:uid,name,phone,photo:photo||null,banned:false,createdAt:nowISO()};
 RIDERS=loadRiders();
 const idx=RIDERS.riders.findIndex(x=>x.id===uid);

 saveRiders();

 if(w>AVATAR_MAX_DIM||h>AVATAR_MAX_DIM){
  if(w>=h){h=Math.round(h*AVATAR_MAX_DIM/w);w=AVATAR_MAX_DIM;}
  else{w=Math.round(w*AVATAR_MAX_DIM/h);h=AVATAR_MAX_DIM;}
 }
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
 let out=null;
 for(const q of [0.85,0.7,0.55]){
  let candidate=canvas.toDataURL('image/webp',q);
  if(!candidate||candidate.indexOf('data:image/webp')!==0) candidate=canvas.toDataURL('image/jpeg',q);
  out=candidate;
  if(candidate.length<220000) break;
 }
 return out;
}

/* ======================= เครดิต/คอมมิชชั่นไรเดอร์ (เฟส 3: เชื่อม Supabase จริงแล้ว — เดิมคำนวณเองในเครื่อง) =======================
   ตาราง rider_credit_entries สร้างแถวให้อัตโนมัติฝั่ง server ทันทีที่ออเดอร์ถึงสถานะ DONE จริง (trigger
   create_credit_entry_on_done ใน 0001_init.sql) และ record_rider_payment() RPC จัดการตัดยอดจ่ายแบบ FIFO ให้
   ฝั่งนี้จึงเหลือแค่ "cache" ผลลัพธ์จริงมาแสดง ไม่ต้องคำนวณเองในเครื่องอีกต่อไป (กันเลขไม่ตรงกับของจริงฝั่ง server)
   หมายเหตุ: โหมด "อัตราคงที่ต่องาน (flat)" ที่เคยเลือกได้ในเครื่อง ตาราง/สูตรจริงฝั่ง server รองรับเฉพาะคำนวณ
   จาก commission_percent ของ rates_config เท่านั้น (ดู create_credit_entry_on_done) ตัวเลือกนี้จึงเป็นค่า preference
   ที่ยังเลือกได้ในหน้าจอเหมือนเดิม (ไม่ลบ UI) แต่ไม่มีผลต่อยอดคอมมิชชั่นจริงที่แสดงอีกต่อไป */
let CREDIT={mode:'percent',flatPerJob:5};
let CREDIT_ENTRIES=[]; // cache จากตาราง rider_credit_entries จริง
let CREDIT_PAYMENTS=[]; // cache จากตาราง rider_credit_payments จริง
function upsertCreditEntry(row){
 const mapped={id:row.id, riderId:row.rider_id, riderName:row.rider_name, orderId:row.order_id, jobCount:row.job_count, fee:Number(row.fee), commissionAmount:Number(row.commission_amount), mode:row.mode, paidAmount:Number(row.paid_amount), status:row.status, createdAt:row.created_at};
 const idx=CREDIT_ENTRIES.findIndex(e=>e.id===row.id);
 if(idx>=0) CREDIT_ENTRIES[idx]=mapped; else CREDIT_ENTRIES.unshift(mapped);
}
function upsertCreditPayment(row){
 if(CREDIT_PAYMENTS.some(p=>p.id===row.id)) return;
 CREDIT_PAYMENTS.unshift({id:row.id, riderId:row.rider_id, riderName:row.rider_name, amount:Number(row.amount), note:row.note||'', at:row.created_at});
}
async function syncCreditForClient(client){
 const [{data:entries,error:e1},{data:payments,error:e2}]=await Promise.all([
  client.from('rider_credit_entries').select('*'),
  client.from('rider_credit_payments').select('*')
 ]);
 if(!e1) (entries||[]).forEach(upsertCreditEntry);
 if(!e2) (payments||[]).forEach(upsertCreditPayment);
}
function riderCreditSummary(riderId){
 const entries=CREDIT_ENTRIES.filter(e=>e.riderId===riderId);
 const totalCommission=entries.reduce((s,e)=>s+e.commissionAmount,0);
 const totalPaid=entries.reduce((s,e)=>s+e.paidAmount,0);
 return {completedCount:entries.length,totalCommission,totalPaid,outstanding:totalCommission-totalPaid,entries};
}
function allRidersCreditSummary(){
 const byKey={};
 CREDIT_ENTRIES.forEach(e=>{
  const key=e.riderId||('~'+e.riderName);
  if(!byKey[key]) byKey[key]={riderId:e.riderId,riderName:e.riderName,completedCount:0,totalCommission:0,totalPaid:0};
  byKey[key].completedCount++; byKey[key].totalCommission+=e.commissionAmount; byKey[key].totalPaid+=e.paidAmount;
 });
 return Object.values(byKey).map(r=>Object.assign(r,{outstanding:r.totalCommission-r.totalPaid}));
}
// จ่ายเงินแบบ FIFO จริงฝั่ง server ผ่าน RPC record_rider_payment (แทนที่การคำนวณเองในเครื่องเดิม)
let adminRecordPaymentBusy=false;
async function adminRecordPayment(riderKey,riderName,riderIdRaw){
 if(adminRecordPaymentBusy) return;
 const amtInput=$('payAmt_'+riderKey), noteInput=$('payNote_'+riderKey);
 const amount=Number(amtInput?amtInput.value:0);
 if(!amount||amount<=0){ toast('กรุณากรอกจำนวนเงินที่ชำระให้ถูกต้อง'); return; }
 const note=noteInput?noteInput.value.trim():'';
 if(!riderIdRaw){ toast('ไม่พบรหัสไรเดอร์ ไม่สามารถบันทึกการชำระเงินได้'); return; }
 adminRecordPaymentBusy=true;
 try{
  const {error}=await sbAdmin.rpc('record_rider_payment',{p_rider_id:riderIdRaw,p_rider_name:riderName,p_amount:amount,p_note:note});
  if(error){ toast('บันทึกการชำระเงินไม่สำเร็จ: '+error.message); return; }
  await syncCreditForClient(sbAdmin);
  toast('บันทึกการชำระเงิน '+baht(amount)+' แล้ว');
  renderAdminCreditList();

/* ---------- แนบรูปในแชท: ตรวจสอบ/บีบอัด/แสดงตัวอย่างก่อนส่ง ---------- */
const CHAT_IMAGE_MAX_BYTES=5*1024*1024; // 5 MB ก่อนอัปโหลด/บีบอัด
const CHAT_IMAGE_ACCEPTED=['image/jpeg','image/jpg','image/png','image/webp'];
const CHAT_IMAGE_MAX_DIM=1920;
let custPendingImage=null, riderPendingImage=null;
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file);});}
function loadImageEl(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('โหลดรูปไม่สำเร็จ'));img.src=src;});}
async function compressChatImage(file){
 const rawDataUrl=await fileToDataURL(file);
 const img=await loadImageEl(rawDataUrl);
 let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
 if(w>CHAT_IMAGE_MAX_DIM||h>CHAT_IMAGE_MAX_DIM){
  if(w>=h){h=Math.round(h*CHAT_IMAGE_MAX_DIM/w);w=CHAT_IMAGE_MAX_DIM;}
  else{w=Math.round(w*CHAT_IMAGE_MAX_DIM/h);h=CHAT_IMAGE_MAX_DIM;}
 }
 const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
 const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
 let out=null;
 for(const q of [0.82,0.68,0.55,0.4]){
  let candidate=canvas.toDataURL('image/webp',q);
  if(!candidate||candidate.indexOf('data:image/webp')!==0) candidate=canvas.toDataURL('image/jpeg',q);
  out=candidate;
  if(candidate.length<700000) break; // ประมาณ ~500KB จริงหลังถอด base64 — พอเหมาะกับ localStorage ของ MVP
 }
 return out;
}
async function onChatImagePicked(input,role){
 const file=input.files&&input.files[0];
 input.value='';
 if(!file)return;
 if(!CHAT_IMAGE_ACCEPTED.includes(file.type)){ toast('รองรับเฉพาะไฟล์ JPG, JPEG, PNG และ WebP เท่านั้น'); return; }
 if(file.size>CHAT_IMAGE_MAX_BYTES){ toast('รูปภาพต้องมีขนาดไม่เกิน 5 MB'); return; }
 try{
  const compressed=await compressChatImage(file);
  if(role==='customer'){ custPendingImage=compressed; renderCustAttachPreview(); }
  else { riderPendingImage=compressed; renderRiderAttachPreview(); }
 }catch(e){ toast('ไม่สามารถประมวลผลรูปนี้ได้ ลองรูปอื่น'); }
}

// ตรวจสอบทั้งระบบ (End-to-End, เฟส 4) — ADMIN_USERS: cache ผู้ใช้ "ทั้งหมดจริง" จากตาราง profiles
// ============================================================================
// ปัญหาเดิมที่พบจากการตรวจสอบ: allUsersList() อ่านจาก RIDERS/CUSTOMERS/ADMINS ซึ่งเป็นแค่ localStorage
// mirror ต่อเบราว์เซอร์ (ถูก seed ตอน login/สมัครสมาชิกของบัญชีที่เคยใช้งานบนเครื่องนั้นเท่านั้น) — ทำให้
// แอดมินเห็น "จัดการผู้ใช้" ไม่ครบ เห็นเฉพาะคนที่เคยล็อกอิน/สมัครบนเบราว์เซอร์เดียวกับแอดมินเอง และปุ่มแบน/
// ปลดแบนก็ค้นหาเป้าหมายจาก mirror เดียวกันนี้ด้วย ถ้าไม่เจอในนั้นจะขึ้น "ไม่พบบัญชีนี้" ทันทีแม้ผู้ใช้จะมีอยู่จริง
// ในระบบก็ตาม — แก้โดยดึงข้อมูลจากตาราง profiles ตรงๆ ผ่าน sbAdmin (RLS policy profiles_select_admin ใน
// 0001_init.sql อนุญาตให้แอดมินอ่านได้ทุกแถวอยู่แล้ว ไม่ต้องแก้ RLS เพิ่ม) แล้วรักษาให้สดอยู่เสมอผ่าน Realtime
// (ดู subscribeRealtimeForRole role==='admin' ด้านบน) — เป็น "แหล่งข้อมูลจริง" หนึ่งเดียวสำหรับหน้าจัดการผู้ใช้
// จากนี้ไป ไม่พึ่ง local mirror อีกต่อไป (RIDERS/CUSTOMERS/ADMINS ยังคงไว้เหมือนเดิมสำหรับ session ปัจจุบันของ
// เบราว์เซอร์นั้นๆ เท่านั้น ไม่ได้ถูกลบทิ้ง เพื่อไม่กระทบระบบ login/signup เดิม)
let ADMIN_USERS=[]; // [{id,role,name,phone,photo,banned,createdAt}]
let adminUsersSynced=false;
async function syncAdminUsersList(){
 const {data,error}=await sbAdmin.from('profiles').select('id,role,name,phone,photo,banned,created_at').order('created_at',{ascending:false});
 if(error){ console.error('syncAdminUsersList failed',error); toast('โหลดรายชื่อผู้ใช้ไม่สำเร็จ: '+error.message); return; }
 ADMIN_USERS=(data||[]).map(mapProfileRowToAdminUser);
 adminUsersSynced=true;
 if(adminTab==='users') renderAdminUsersList();
}
function mapProfileRowToAdminUser(p){
 return {id:p.id,role:p.role,name:p.name||'',phone:p.phone||'',photo:p.photo||null,banned:!!p.banned,createdAt:p.created_at};
}
// เรียกจาก realtime listener ของแอดมิน (INSERT สมาชิกใหม่ / UPDATE เช่นแบน-ปลดแบน-แก้โปรไฟล์)
function upsertAdminUserProfile(row){
 if(!row||!row.id) return;
 const mapped=mapProfileRowToAdminUser(row);
 const idx=ADMIN_USERS.findIndex(u=>u.id===mapped.id);
 if(idx>=0) ADMIN_USERS[idx]=mapped; else ADMIN_USERS.unshift(mapped);
 if(adminTab==='users') renderAdminUsersList();
}
// เรียกจาก realtime listener ของแอดมิน (DELETE — บัญชีถูกลบจริงผ่าน Edge Function admin-users)
function removeAdminUserProfile(id){
 if(!id) return;
 const idx=ADMIN_USERS.findIndex(u=>u.id===id);
 if(idx>=0) ADMIN_USERS.splice(idx,1);
 if(adminTab==='users') renderAdminUsersList();
}

// เฟส 5 (เชื่อม Edge Function "admin-users" เวอร์ชันจริงที่ deploy อยู่): เปลี่ยนจากเรียกด้วย fetch() ตรงๆ
// เป็น sbAdmin.functions.invoke() ตามที่ระบุ — ยังคงหลักการเดิมทุกประการ: แนบ access token ของแอดมินที่ login
// อยู่ไปให้ฟังก์ชันตรวจสอบสิทธิ์เอง (server-side) ทุกครั้งก่อนทำงาน service_role ไม่เคยหลุดมาฝั่ง frontend
// ใช้ร่วมกันทั้งลบบัญชีและรีเซ็ตรหัสผ่าน — ไม่สร้าง Supabase client ใหม่ ใช้ sbAdmin ตัวเดิมของโปรเจกต์เท่านั้น
async function callAdminUsersFunction(action,targetId,extra){
 const {data:sessionData,error:sessionError}=await sbAdmin.auth.getSession();
 const session=sessionData&&sessionData.session;
 if(sessionError||!session){ return {ok:false,error:'เซสชันแอดมินหมดอายุ กรุณาเข้าสู่ระบบใหม่'}; }
 let invokeResult;
 try{
  invokeResult=await sbAdmin.functions.invoke('admin-users',{
   body:Object.assign({action,targetId},extra||{}),
   headers:{Authorization:'Bearer '+session.access_token}
  });
 }catch(e){ return {ok:false,error:'เชื่อมต่อ server ไม่สำเร็จ กรุณาลองใหม่ ('+(e&&e.message||e)+')'}; }
 const {data,error}=invokeResult||{};
 if(error){
  // สำคัญ: เมื่อ Edge Function ตอบกลับ status ที่ไม่ใช่ 2xx (400/401/403/404/405/500) sbAdmin.functions.invoke()
  // จะไม่ parse body ให้อัตโนมัติ (data เป็น null) แต่เก็บ Response ดิบไว้ที่ error.context — ต้อง parse เอง
  // เพื่อดึงข้อความ error จริงจาก {ok:false,error:"..."} ที่ Edge Function ส่งมา ไม่งั้นจะเห็นแค่ข้อความทั่วไป
  // "Edge Function returned a non-2xx status code" ที่ไม่บอกสาเหตุจริงให้แอดมินเห็น
  let serverMsg=null;
  try{
   if(error.context&&typeof error.context.json==='function'){
    const errBody=await error.context.clone().json();
    serverMsg=errBody&&errBody.error;
   }
  }catch(e){ /* response ไม่ใช่ JSON ที่ parse ได้ — ใช้ error.message ทั่วไปแทนด้านล่าง */ }
  return {ok:false,error:serverMsg||error.message||'ทำรายการไม่สำเร็จ'};
 }
 if(!data||data.ok===false) return {ok:false,error:(data&&data.error)||'ทำรายการไม่สำเร็จ'};
 return Object.assign({ok:true},data);
}
// เฟส 3 (แก้ระบบ Admin): ลบบัญชีจริงทั้ง auth.users และ profiles (ผูก on delete cascade) ผ่าน Edge Function
// เท่านั้น (เดิมลบได้แค่แถว profiles ตรงๆ จาก client ทำให้บัญชี auth.users เดิมยัง login ผ่าน Supabase Auth ได้
// ในทางเทคนิค แม้จะใช้งานต่อไม่ได้เพราะไม่มี profile — ตอนนี้ลบจริงสมบูรณ์ 100% ผ่าน service_role ฝั่งเซิร์ฟเวอร์)
let adminDeleteBusy=false;
async function adminDeleteUser(type,id){
 if(adminDeleteBusy) return;
 if(type==='admin'){toast('ไม่สามารถลบบัญชีแอดมินจากหน้านี้ได้');adminUserConfirm=null;renderAdminUsersList();return}
 const me=currentAdmin();
 if(me&&me.id===id){ toast('ไม่สามารถลบบัญชีแอดมินของตัวเองได้'); adminUserConfirm=null; renderAdminUsersList(); return; }
 adminDeleteBusy=true;
 try{
  // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): เอาชื่อไว้แสดงผล toast จาก ADMIN_USERS (รายชื่อจริงทั้งระบบ) แทน
  // local mirror เดิม — ไม่ใช้เป็นเงื่อนไขตัดสินใจใดๆ การตรวจสอบสิทธิ์/ความถูกต้องทั้งหมดทำที่ Edge Function เสมอ
  const targetName=(ADMIN_USERS.find(x=>x.id===id)||{}).name||'';
  // ตามคำสั่ง (แก้เชื่อม admin-users): ต้องเรียก action "delete_user" ตรงตาม contract ของ Edge Function เวอร์ชัน
  // ที่ deploy จริง (เดิมเรียก 'delete' — ฝั่ง server เวอร์ชันนี้ normalize 'delete' เป็น 'delete_user' ให้เองก็จริง
  // แต่ระบุให้ตรงชัดเจนตามที่สั่งไว้)
  const r=await callAdminUsersFunction('delete_user',id);
  if(!r.ok){ toast('ลบบัญชีไม่สำเร็จ: '+r.error); return; }
  removeAdminUserProfile(id); // อัปเดต ADMIN_USERS ทันทีแบบ optimistic ก่อน (ตอบสนองไว)
  // ข้อกำหนด: ลบบัญชีสำเร็จแล้วต้องรีเฟรชรายชื่อผู้ใช้ใหม่ — ใช้ syncAdminUsersList() ซึ่งเป็นฟังก์ชันเดิมของ
  // โปรเจกต์ที่ query ตาราง profiles จริงจาก Supabase (เทียบเท่า loadUsers() ที่ผู้ใช้ระบุถึง) ยืนยันรายชื่อให้
  // ตรงกับฐานข้อมูลจริงอีกครั้งหลังลบเสร็จ ไม่พึ่งแค่การอัปเดต cache ในเครื่องเฉย ๆ
  syncAdminUsersList();
  // เผื่อบัญชีที่ถูกลบตรงกับ local mirror ของเบราว์เซอร์นี้เอง (เช่นแอดมินเคยล็อกอิน/สมัครเป็นคนนี้มาก่อนบนเครื่องนี้)
  // ให้เคลียร์ตามไปด้วย กันข้อมูลตกค้างชี้ไปหาบัญชีที่ลบไปแล้วจริง
  if(type==='customer'){ const idx=CUSTOMERS.customers.findIndex(x=>x.id===id); if(idx>=0){ CUSTOMERS.customers.splice(idx,1); saveCustomers(); } }
  else if(type==='rider'){ const idx=RIDERS.riders.findIndex(x=>x.id===id); if(idx>=0){ RIDERS.riders.splice(idx,1); saveRiders(); } }
  toast('ลบบัญชี'+(targetName?(' '+targetName):'')+' แล้ว (ประวัติออเดอร์เดิมยังอยู่)');
 } finally { adminDeleteBusy=false; adminUserConfirm=null; adminUserDetail=null; renderAdminUsersList(); }
}
// เฟส 3 (แก้ระบบ Admin, ใหม่): แอดมิน "รีเซ็ตรหัสผ่าน" ให้ลูกค้า/ไรเดอร์ได้ ผ่าน Edge Function เดียวกัน — ไม่มีทาง
// อ่านรหัสผ่านเดิมได้เลย (Supabase Auth เก็บ hash เท่านั้น) ระบบจะ "ตั้งรหัสผ่านใหม่แบบสุ่ม" ให้แทน แล้วแสดงให้
// แอดมินเห็น "ครั้งเดียว" ตรงนี้เพื่อนำไปแจ้งเจ้าของบัญชีเอง ไม่ถูกบันทึกไว้ที่ใดในระบบทั้งสิ้น
let adminResetPwBusy=false;
let adminResetPwResult=null; // {id, name, password} ของรายการล่าสุดที่เพิ่ง reset ไว้แสดงผลครั้งเดียว
// รับ customPassword เพิ่มเติมเป็นพารามิเตอร์ตัวเลือก (ไม่บังคับ): ถ้าอนาคตมีจุดในหน้าเว็บที่ให้แอดมินพิมพ์
// รหัสผ่านใหม่เองแล้วเรียกฟังก์ชันนี้พร้อมค่านั้น จะถูกส่งต่อเป็น newPassword ให้ Edge Function ใช้ตรงๆ ตามที่
// ระบุไว้ ("หากมีการส่งรหัสผ่านใหม่จากหน้าเว็บ ให้รองรับ newPassword") — ปุ่ม "รีเซ็ตรหัสผ่าน" เดิมในหน้า UI
// ยังคงเรียกแบบไม่ส่งพารามิเตอร์นี้เหมือนเดิมทุกประการ (customPassword=undefined) ทำให้ Edge Function สุ่ม
// รหัสผ่านให้เองเหมือนพฤติกรรมเดิมของฟีเจอร์นี้ ไม่มีอะไรเปลี่ยนจากมุมมองผู้ใช้งานปัจจุบัน
async function adminResetPassword(type,id,customPassword){
 if(adminResetPwBusy) return;
 // ตรวจสอบทั้งระบบ (End-to-End, เฟส 4): หาชื่อไว้แสดงผลจาก ADMIN_USERS แทน local mirror เดิม (เหตุผลเดียวกับ
 // adminToggleBan/adminDeleteUser ด้านบน) — ไม่กระทบการตรวจสิทธิ์ ซึ่งทำที่ Edge Function เสมออยู่แล้ว
 const u=ADMIN_USERS.find(x=>x.id===id);
 adminResetPwBusy=true;
 try{
  const extra=(typeof customPassword==='string'&&customPassword.trim())?{newPassword:customPassword.trim()}:undefined;
  const r=await callAdminUsersFunction('reset_password',id,extra);
  if(!r.ok){ toast('รีเซ็ตรหัสผ่านไม่สำเร็จ: '+r.error); return; }
  adminResetPwResult={id,name:(u&&u.name)||r.name||'',password:r.newPassword};
  toast('ตั้งรหัสผ่านใหม่ให้ '+((u&&u.name)||'')+' แล้ว — คัดลอกไปแจ้งเจ้าของบัญชีได้ด้านล่าง');
 } finally { adminResetPwBusy=false; renderAdminUsersList(); }
}

/* ---------- Google Maps: จุดรับ-ส่งบนแผนที่ ตอนสร้างออเดอร์ (ฟีเจอร์เสริม order-level แยกจากรายการงานหลายจุดเดิม
   ไม่บังคับต้องใช้ถึงจะส่งงานได้ ไม่แก้/ไม่แทนที่ .f-pickup/.f-dropoff รายจุดเดิมเลย) ---------- */
// ศูนย์กลางพื้นที่ให้บริการหลัก: มหาวิทยาลัยอุบลราชธานี อ.วารินชำราบ จ.อุบลราชธานี
// พิกัดอ้างอิงจาก Wikipedia (infobox หน้า Ubon Ratchathani University): 15.1180417°N, 104.9013750°E
// ใช้เป็นทั้งจุดกึ่งกลางแผนที่เริ่มต้น (ห้าม default กรุงเทพฯ) และจุดศูนย์กลาง locationBias ตอนค้นหาสถานที่
const UBU_CENTER={lat:15.1180417,lng:104.9013750};
const UBU_BIAS_RADIUS_M=20000; // รัศมี bias ~20กม. ครอบคลุม ม.อุบล/วารินชำราบ/ตัวเมืองอุบลฯ (ไม่ hard-block พื้นที่อื่น)
let orderMap=null, orderMapPickupMarker=null, orderMapDropoffMarker=null, orderRoutePolyline=null;
let mapPickupPoint=null, mapDropoffPoint=null; // {lat,lng,address,placeId} หรือ null ถ้ายังไม่ได้เลือก — state แยกกันชัดเจนคนละตัวแปร
let mapClickMode='pickup'; // โหมดตอนคลิกแผนที่: 'pickup' หรือ 'dropoff' — สลับผ่านปุ่ม/auto-switch หลังปักจุดรับ
let mapDistanceKm=null; // null = ยังไม่ได้เลือกจุดรับ-ส่งบนแผนที่ (ไม่กระทบราคาปกติเลย)
let mapDurationText=null; // เวลาเดินทางโดยประมาณ แสดงผลอย่างเดียว ไม่ถูกบันทึกลงออเดอร์ (ราคายังอิงระยะทางเหมือนเดิม)
let mapRouteFetchSeq=0; // กันผลลัพธ์ค้นหาเก่ามาทับผลใหม่ ถ้าผู้ใช้เปลี่ยนจุดรับ-ส่งเร็ว ๆ ระหว่างรอ Routes API ตอบกลับ
let mapPlacesDebounce={pickup:null,dropoff:null}; // debounce timer ต่ออินพุต กันยิง request ทุกตัวอักษรที่พิมพ์
function resetOrderMapState(){
 orderMap=null; orderMapPickupMarker=null; orderMapDropoffMarker=null; orderRoutePolyline=null;
 mapPickupPoint=null; mapDropoffPoint=null; mapDistanceKm=null; mapDurationText=null; mapClickMode='pickup';
 if(mapPlacesDebounce.pickup) clearTimeout(mapPlacesDebounce.pickup);
 if(mapPlacesDebounce.dropoff) clearTimeout(mapPlacesDebounce.dropoff);
 mapPlacesDebounce={pickup:null,dropoff:null};
}
// เริ่มระบบแผนที่ในฟอร์มสร้างออเดอร์ — ทำงานแบบไม่บังคับเสมอ: ถ้าไม่มี key หรือโหลดไม่สำเร็จ จะแสดงข้อความเฉย ๆ
// ไม่ throw ไม่บล็อกการกรอกฟอร์ม/ส่งออเดอร์แบบเดิม (เรียกจาก renderCustomerRoot ตอนสร้างฟอร์มครั้งแรกเท่านั้น)
async function initOrderMap(){
 const statusEl=$('orderMapStatus');
 if(!GOOGLE_MAPS_API_KEY){ if(statusEl) statusEl.textContent='ยังไม่ได้เปิดใช้งานแผนที่ (ไม่บังคับ) — ระบุจุดรับ-ส่งเป็นข้อความในรายการงานด้านล่างได้ตามปกติ'; return; }
 if(statusEl) statusEl.textContent='กำลังโหลดแผนที่...';
 try{ await loadGoogleMapsApi(); }
 catch(e){ if(statusEl) statusEl.textContent='โหลดแผนที่ไม่สำเร็จ ระบุจุดรับ-ส่งเป็นข้อความในรายการงานด้านล่างได้ตามปกติ'; return; }
 const canvas=$('orderMapCanvas'); if(!canvas) return; // ผู้ใช้อาจออกจากฟอร์มไปแล้วระหว่างรอโหลดสคริปต์
 // ค่ากลางเริ่มต้น: มหาวิทยาลัยอุบลราชธานี (พื้นที่ให้บริการหลัก) — ห้าม default กรุงเทพฯ ตามที่ระบุ
 // zoom:14 เหมาะกับการใช้งานในพื้นที่ (เห็นระดับถนน/ย่านรอบมหาวิทยาลัย ไม่กว้างเกินไปแบบ zoom ระดับจังหวัด)
 orderMap=new google.maps.Map(canvas,{center:UBU_CENTER,zoom:14});
 setupPlacesAutocomplete($('mapPickupInput'),'pickup',$('mapPickupSuggest'));
 setupPlacesAutocomplete($('mapDropoffInput'),'dropoff',$('mapDropoffSuggest'));
 orderMap.addListener('click',(ev)=>{ if(ev&&ev.latLng) handleMapClick(ev.latLng.lat(),ev.latLng.lng()); });
 updateMapClickModeButtons();
 if(statusEl) statusEl.textContent='พิมพ์ค้นหาจุดรับ-ส่ง หรือแตะบนแผนที่เพื่อปักหมุดได้เลย';
}
// สลับโหมด "กำลังปักหมุดจุดรับ" / "กำลังปักหมุดจุดส่ง" ตอนคลิกแผนที่ — ปุ่มอยู่ในการ์ดแผนที่ (customerFormHTML)
function setMapClickMode(mode){ mapClickMode=(mode==='dropoff')?'dropoff':'pickup'; updateMapClickModeButtons(); }
function updateMapClickModeButtons(){
 const bp=$('mapModePickupBtn'), bd=$('mapModeDropoffBtn');
 if(bp) bp.classList.toggle('primary',mapClickMode==='pickup');
 if(bp) bp.classList.toggle('ghost',mapClickMode!=='pickup');
 if(bd) bd.classList.toggle('primary',mapClickMode==='dropoff');
 if(bd) bd.classList.toggle('ghost',mapClickMode!=='dropoff');
}
// คลิกบนแผนที่เพื่อปักหมุด (ตามโหมดที่เลือกอยู่) — แปลงพิกัดเป็นที่อยู่ถ้าทำได้ (reverseGeocode มี fallback เอง)
// ไม่ว่า reverse geocode จะสำเร็จหรือไม่ ก็ยังปักหมุด/คำนวณเส้นทางได้ด้วยพิกัดดิบเสมอ
async function handleMapClick(lat,lng){
 const which=mapClickMode;
 const label=(which==='pickup')?$('mapPickupInput'):$('mapDropoffInput');
 const coordText=lat.toFixed(5)+', '+lng.toFixed(5);
 if(label) label.value=coordText+' (กำลังค้นหาชื่อสถานที่...)';
 const point={lat,lng,address:coordText,placeId:null};
 if(which==='pickup') mapPickupPoint=point; else mapDropoffPoint=point;
 updateOrderMapMarkers();
 tryDrawRoute();
 const addr=await reverseGeocode(lat,lng); // best-effort — ถ้า Geocoding API ไม่ได้เปิดใช้งาน จะคืนค่า null เฉย ๆ
 if(addr){
  point.address=addr;
  if(label) label.value=addr;
 } else if(label){ label.value=coordText; }
 // ปักจุดรับด้วยการคลิกแล้ว ถ้ายังไม่มีจุดส่ง สลับโหมดไปรอปักจุดส่งต่อให้อัตโนมัติ (ปรับเองได้ทุกเมื่อผ่านปุ่ม)
 if(which==='pickup'&&!mapDropoffPoint) setMapClickMode('dropoff');
}
// แปลงพิกัดเป็นที่อยู่ (reverse geocode) แบบ best-effort ผ่าน Geocoding API — ถ้า API นี้ไม่ได้เปิดใช้งานใน
// โปรเจกต์ Google Cloud หรือเรียกไม่สำเร็จด้วยเหตุใดก็ตาม จะคืนค่า null เฉย ๆ (ไม่ throw) แล้วโค้ดที่เรียกใช้
// จะ fallback ไปแสดงพิกัดดิบแทน — ไม่กระทบการปักหมุด/คำนวณเส้นทาง/ราคาเลย เพราะสิ่งเหล่านั้นใช้ lat/lng ตรงๆ
async function reverseGeocode(lat,lng){
 try{
  const resp=await fetch('https://maps.googleapis.com/maps/api/geocode/json?latlng='+lat+','+lng+'&language=th&key='+encodeURIComponent(GOOGLE_MAPS_API_KEY));
  const data=await resp.json().catch(()=>null);
  if(data&&data.status==='OK'&&data.results&&data.results[0]) return data.results[0].formatted_address||null;
  return null;
 }catch(e){ return null; }
}
// ค้นหาสถานที่ด้วย Places API (New) โดยตรงผ่าน REST (places:autocomplete) — ไม่ใช้ widget
// google.maps.places.Autocomplete เดิม เพราะ widget นั้นต้องเปิดใช้ "Places API" รุ่นเก่า ซึ่งโปรเจกต์นี้ไม่ได้
// เปิดไว้ (เปิดเฉพาะ "Places API (New)") จึงสร้างช่องค้นหา+ลิสต์ผลลัพธ์เอง ผูกกับ input ธรรมดาที่มีอยู่แล้ว
function setupPlacesAutocomplete(inputEl,which,listEl){
 if(!inputEl||!listEl) return;
 inputEl.addEventListener('input',()=>{
  const q=inputEl.value.trim();
  if(mapPlacesDebounce[which]) clearTimeout(mapPlacesDebounce[which]);
  if(!q){ listEl.innerHTML=''; listEl.hidden=true; return; }
  mapPlacesDebounce[which]=setTimeout(()=>fetchPlaceSuggestions(q,which,listEl),350);
 });
 // หน่วงการซ่อนลิสต์ตอน blur กันกรณีคลิกเลือกรายการไม่ทัน (mousedown บนลิสต์จะยิงก่อน blur เสร็จ)
 inputEl.addEventListener('blur',()=>{ setTimeout(()=>{ listEl.hidden=true; },200); });
}
async function fetchPlaceSuggestions(q,which,listEl){
 let data=null,ok=false;
 try{
  const resp=await fetch('https://places.googleapis.com/v1/places:autocomplete',{
   method:'POST',
   headers:{'Content-Type':'application/json','X-Goog-Api-Key':GOOGLE_MAPS_API_KEY},
   // regionCode:'TH' + locationBias รอบมหาวิทยาลัยอุบลราชธานี — "bias" เอนเอียงผลลัพธ์มาทางพื้นที่นี้ก่อน
   // ไม่ใช่ locationRestriction (ซึ่งจะ hard-block พื้นที่อื่นไปเลย) จึงยังค้นหาสถานที่อื่นนอกพื้นที่ได้ตามปกติ
   body:JSON.stringify({input:q,languageCode:'th',regionCode:'TH',
    locationBias:{circle:{center:{latitude:UBU_CENTER.lat,longitude:UBU_CENTER.lng},radius:UBU_BIAS_RADIUS_M}}})
  });
  data=await resp.json().catch(()=>null); ok=resp.ok;
 }catch(e){ ok=false; }
 const suggestions=(ok&&data&&data.suggestions)||[];
 if(!suggestions.length){ listEl.innerHTML='<div style="padding:10px 12px;color:var(--muted)">ไม่พบสถานที่</div>'; listEl.hidden=false; return; }
 listEl.innerHTML=suggestions.slice(0,6).map((s,i)=>{
  const p=s.placePrediction; if(!p) return '';
  return `<div class="place-sugg-item" data-idx="${i}" style="padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)">${esc(p.text&&p.text.text||'')}</div>`;
 }).join('');
 listEl._suggestions=suggestions;
 listEl.hidden=false;
 Array.from(listEl.querySelectorAll('.place-sugg-item')).forEach(el=>{
  el.addEventListener('mousedown',(ev)=>{ ev.preventDefault(); const idx=Number(el.getAttribute('data-idx')); pickPlaceSuggestion(listEl._suggestions[idx],which,listEl); });
 });
}
async function pickPlaceSuggestion(sugg,which,listEl){
 const p=sugg&&sugg.placePrediction; if(!p) return;
 const inputEl=which==='pickup'?$('mapPickupInput'):$('mapDropoffInput');
 if(inputEl) inputEl.value=(p.text&&p.text.text)||'';
 listEl.hidden=true;
 const placeId=p.placeId; if(!placeId) return;
 let data=null,ok=false;
 try{
  const resp=await fetch('https://places.googleapis.com/v1/places/'+encodeURIComponent(placeId),{
   headers:{'X-Goog-Api-Key':GOOGLE_MAPS_API_KEY,'X-Goog-FieldMask':'location,formattedAddress'}
  });
  data=await resp.json().catch(()=>null); ok=resp.ok;
 }catch(e){ ok=false; }
 if(!ok||!data||!data.location) return;
 const point={lat:data.location.latitude,lng:data.location.longitude,address:data.formattedAddress||(p.text&&p.text.text)||'',placeId:placeId};
 if(which==='pickup') mapPickupPoint=point; else mapDropoffPoint=point;
 updateOrderMapMarkers();
 tryDrawRoute();
}
function updateOrderMapMarkers(){
 if(!orderMap) return;
 if(mapPickupPoint){
  if(!orderMapPickupMarker) orderMapPickupMarker=new google.maps.Marker({map:orderMap,label:'A'});
  orderMapPickupMarker.setPosition(mapPickupPoint);
 }
 if(mapDropoffPoint){
  if(!orderMapDropoffMarker) orderMapDropoffMarker=new google.maps.Marker({map:orderMap,label:'B'});
  orderMapDropoffMarker.setPosition(mapDropoffPoint);
 }
 const pts=[mapPickupPoint,mapDropoffPoint].filter(Boolean);
 if(pts.length===1){ orderMap.panTo(pts[0]); orderMap.setZoom(15); }
 else if(pts.length===2){ const bounds=new google.maps.LatLngBounds(); pts.forEach(p=>bounds.extend(p)); orderMap.fitBounds(bounds,60); }
}
// แปลงค่า duration ที่ Routes API ส่งกลับมา (รูปแบบ "1234s") เป็นข้อความเวลาโดยประมาณภาษาไทยอ่านง่าย
function formatDurationTh(durationStr){
 const sec=parseInt(String(durationStr||'').replace('s',''),10)||0;
 if(!sec) return '';
 const mins=Math.round(sec/60);
 if(mins<60) return Math.max(1,mins)+' นาที';
 const h=Math.floor(mins/60), m=mins%60;
 return h+' ชม.'+(m?(' '+m+' นาที'):'');
}
// วาดเส้นทางบนแผนที่จาก encoded polyline ที่ได้จาก Routes API (ต้องโหลด library "geometry" ไว้แล้วตอน initOrderMap)
function drawRoutePolyline(encoded){
 if(orderRoutePolyline){ orderRoutePolyline.setMap(null); orderRoutePolyline=null; }
 if(!encoded||!orderMap||!google.maps.geometry) return;
 const path=google.maps.geometry.encoding.decodePath(encoded);
 orderRoutePolyline=new google.maps.Polyline({path,map:orderMap,strokeColor:'#2563eb',strokeWeight:5,strokeOpacity:0.85});
 const bounds=new google.maps.LatLngBounds();
 path.forEach(p=>bounds.extend(p));
 orderMap.fitBounds(bounds,60);
}
// เรียก Routes API (New) — computeRoutes — เพื่อคำนวณเส้นทาง/ระยะทาง/เวลาเดินทางจริงตามถนน (ไม่ใช่เส้นตรง)
// เรียกตรงจากฝั่ง browser ด้วย GOOGLE_MAPS_API_KEY เดียวกับที่ใช้กับ Maps JavaScript API/Places API (คีย์ตัวเดียว
// จำกัดสิทธิ์ด้วย HTTP referrer restriction ใน Google Cloud Console — ไม่ใช่ secret ที่ต้องซ่อน) ระยะทางที่ได้
// ใช้ป้อนเข้าสูตรราคาเดิม (calcPricing) ต่อทันที ส่วนเวลาเดินทางแสดงผลให้ลูกค้าดูเฉย ๆ ไม่มีผลต่อราคา
async function tryDrawRoute(){
 const distEl=$('orderMapDistance');
 const mySeq=++mapRouteFetchSeq;
 if(!mapPickupPoint||!mapDropoffPoint||!GOOGLE_MAPS_API_KEY){
  mapDistanceKm=null; mapDurationText=null;
  if(distEl) distEl.textContent='';
  if(orderRoutePolyline){ orderRoutePolyline.setMap(null); orderRoutePolyline=null; }
  renderCustomerEstimate();
  return;
 }
 if(distEl) distEl.textContent='กำลังคำนวณเส้นทาง...';
 let data=null, ok=false;
 try{
  const resp=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{
   method:'POST',
   headers:{
    'Content-Type':'application/json',
    'X-Goog-Api-Key':GOOGLE_MAPS_API_KEY,
    'X-Goog-FieldMask':'routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline'
   },
   body:JSON.stringify({
    origin:{location:{latLng:{latitude:mapPickupPoint.lat,longitude:mapPickupPoint.lng}}},
    destination:{location:{latLng:{latitude:mapDropoffPoint.lat,longitude:mapDropoffPoint.lng}}},
    travelMode:'DRIVE', routingPreference:'TRAFFIC_UNAWARE', units:'METRIC', languageCode:'th-TH'
   })
  });
  data=await resp.json().catch(()=>null);
  ok=resp.ok;
 }catch(e){ ok=false; }
 if(mySeq!==mapRouteFetchSeq) return; // ผู้ใช้เปลี่ยนจุดรับ-ส่งใหม่ระหว่างรอ — ทิ้งผลลัพธ์เก่านี้
 const route=data?.routes?.[0];
 if(!ok||!route){
  mapDistanceKm=null; mapDurationText=null;
  if(distEl) distEl.textContent='คำนวณเส้นทางไม่สำเร็จ (Routes API) ลองเลือกจุดรับ-ส่งใหม่ หรือตรวจสอบ API Key/Billing';
  renderCustomerEstimate();
  return;
 }
 const meters=Number(route.distanceMeters||0);
 mapDistanceKm=Math.round((meters/1000)*10)/10; // ปัดทศนิยม 1 ตำแหน่ง
 mapDurationText=formatDurationTh(route.duration);
 drawRoutePolyline(route.polyline?.encodedPolyline);
 updateOrderMapMarkers();
 if(distEl) distEl.textContent='ระยะทางจริง '+mapDistanceKm+' กม.'+(mapDurationText?(' • เวลาโดยประมาณ '+mapDurationText):'');
 renderCustomerEstimate();
}

async function onRiderAuthPhotoPicked(input){
 const file=input.files&&input.files[0]; input.value='';
 if(!file)return;
 if(!CHAT_IMAGE_ACCEPTED.includes(file.type)){ toast('รองรับเฉพาะไฟล์ JPG, JPEG, PNG และ WebP เท่านั้น'); return; }
 if(file.size>CHAT_IMAGE_MAX_BYTES){ toast('รูปภาพต้องมีขนาดไม่เกิน 5 MB'); return; }
 try{ riderAuthPendingPhoto=await compressAvatarImage(file); renderRiderAuthState(); }
 catch(e){ toast('ไม่สามารถประมวลผลรูปนี้ได้ ลองรูปอื่น'); }
}
let riderAuthBusy=false;
async function onRiderSignupSubmit(){
 if(riderAuthBusy) return;
 const name=$('riderSignupName').value, phone=$('riderSignupPhone').value;
 const pw=$('riderSignupPassword').value, pw2=$('riderSignupPassword2').value;
 if(!name.trim()){ toast('กรุณากรอกชื่อจริง'); return; }
 if(!phone.trim()){ toast('กรุณากรอกเบอร์โทรศัพท์'); return; }
 if(!pw||pw.length<4){ toast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร'); return; }
 if(pw!==pw2){ toast('รหัสผ่านยืนยันไม่ตรงกัน'); return; }
 riderAuthBusy=true;
 try{
  const r=await riderSignup({name,phone,password:pw,photo:riderAuthPendingPhoto});
  if(!r.ok){ toast(r.reason); return; }
  riderAuthPendingPhoto=null;
  setRiderSession(r.rider.id);
  toast('สมัครสมาชิกสำเร็จ ยินดีต้อนรับ '+r.rider.name);
  renderRiderRoot();
  activateRoleSync('rider');
 } finally { riderAuthBusy=false; }
}
async function onRiderLoginSubmit(){
 if(riderAuthBusy) return;
 const phone=$('riderLoginPhone').value, pw=$('riderLoginPassword').value;
 riderAuthBusy=true;
 try{
  const r=await riderLogin(phone,pw);
  if(!r.ok){ toast(r.reason); return; }
  setRiderSession(r.rider.id);
  toast('ยินดีต้อนรับกลับมา '+r.rider.name);
  renderRiderRoot();
  activateRoleSync('rider');
 } finally { riderAuthBusy=false; }
}
function riderLogout(){
 sbRider.auth.signOut().catch(()=>{});
 clearRiderSession();
 deactivateRoleSync('rider');
 riderAuthMode='login';
 toast('ออกจากระบบแล้ว');
 renderRiderRoot();
}

function renderRiderProfileCard(){

let riderProfileSaveBusy=false;
async function onRiderProfileSave(){
 if(riderProfileSaveBusy) return;
 const rider=currentRider(); if(!rider){ toast('กรุณาเข้าสู่ระบบก่อน'); return; }
 const name=$('riderProfileName').value, phone=$('riderProfilePhone').value;
 const pw=$('riderProfilePassword').value, pw2=$('riderProfilePassword2').value;
 if(!name.trim()){ toast('กรุณากรอกชื่อจริง'); return; }
 if(!phone.trim()){ toast('กรุณากรอกเบอร์โทรศัพท์'); return; }
 if(pw||pw2){
  if(pw.length<4){ toast('รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร'); return; }
  if(pw!==pw2){ toast('รหัสผ่านยืนยันไม่ตรงกัน'); return; }
 }
 // สำคัญ: แก้ไขได้เฉพาะบัญชีของตัวเอง (currentRider) เท่านั้น ไม่มี UI ใดในระบบที่ส่ง id ของไรเดอร์คนอื่นเข้ามาได้
 const patch={name,phone};
 if(pw) patch.password=pw;
 if(riderProfilePendingPhoto!==undefined) patch.photo=riderProfilePendingPhoto;
 riderProfileSaveBusy=true;
 let r;
 try{ r=await updateRiderProfile(rider.id,patch); } finally { riderProfileSaveBusy=false; }
 if(!r.ok){ toast(r.reason); return; }
 riderProfilePendingPhoto=undefined;
 toast('บันทึกโปรไฟล์แล้ว');
 // ชื่อ/รูปใหม่ต้องอัปเดตทันทีทุกที่ที่แสดงอยู่ (แชท, งานที่กำลังทำ, รายการแอดมิน, หน้าติดตามของลูกค้า)
 renderRiderRoot(); renderAdminList(); renderCustomerRoot();
}

async function riderClaim(id){
 const rider=currentRider();
 if(!rider){ toast('กรุณาเข้าสู่ระบบไรเดอร์ก่อนรับงาน'); return; }
 // claim_order() เป็น atomic UPDATE ... WHERE status='PENDING' ฝั่ง server เดียว — กันไรเดอร์ 2 คนรับงานเดียวกันซ้อนกันจริงระดับ DB
 const {data,error}=await sbRider.rpc('claim_order',{p_order_id:id});
 if(error){ toast(error.message||'รับงานไม่สำเร็จ'); return; }
 upsertOrder(data);
 // เหตุการณ์ตรงจากการกดของไรเดอร์เอง — แจ้งเตือนครั้งเดียวแน่นอน ไม่ต้องผ่านระบบ dedup กลาง เพราะ claim_order สำเร็จได้ครั้งเดียวต่องานอยู่แล้ว
 NOTIF_RIDER=loadRiderNotif();
 pushNotification('rider',{title:RIDER_NOTIF_TEXT.CLAIMED,body:'งาน #'+id,orderId:id});
 saveRiderNotif();
 toast('รับงาน '+id+' แล้ว');
 playStatusChime();
}
function myActiveOrder(){
 const rider=currentRider(); if(!rider)return null;
 return DB.orders.find(o=>o.rider&&['ASSIGNED','TO_PICKUP','PICKED_UP','DELIVERING'].includes(o.status)&&
  (o.rider.riderId===rider.id || (!o.rider.riderId && o.rider.name===rider.name)));
}
async function riderToggleStopDone(oid,seq){
 const {data,error}=await sbRider.rpc('toggle_order_stop_done',{p_order_id:oid,p_seq:seq});
 if(error){ toast(error.message||'อัปเดตไม่สำเร็จ'); return; }
 upsertOrder(data);
}
async function riderAdvance(id){
 const o=findOrder(id); if(!o)return; const ns=NEXT_STATUS[o.status]; if(!ns)return;
 const {data,error}=await sbRider.rpc('advance_order_status',{p_order_id:id});
 if(error){ toast(error.message||'อัปเดตสถานะไม่สำเร็จ'); return; }
 upsertOrder(data);
 toast('อัปเดตสถานะแล้ว');
 if(data.status==='DONE'){
  NOTIF_RIDER=loadRiderNotif();
  pushNotification('rider',{title:RIDER_NOTIF_TEXT.DONE,body:'งาน #'+id,orderId:id});
  saveRiderNotif();
  playStatusChime();
 }
}

function renderRiderAuthState(){
 const authCard=$('riderAuthCard'), appBox=$('riderAppBox');
 if(!authCard||!appBox) return;
 if(currentRider()){
  authCard.classList.add('hidden'); authCard.innerHTML='';
  appBox.classList.remove('hidden');
  renderRiderProfileCard();
 }else{
  appBox.classList.add('hidden');
  authCard.classList.remove('hidden');
  // เก็บค่าที่พิมพ์ค้างไว้ก่อน rebuild (เช่นตอนเลือกรูปโปรไฟล์ระหว่างกรอกฟอร์ม) กันข้อมูลหาย
  const keep={};
  ['riderSignupName','riderSignupPhone','riderSignupPassword','riderSignupPassword2','riderLoginPhone','riderLoginPassword'].forEach(id=>{ if($(id)) keep[id]=$(id).value; });
  authCard.innerHTML=riderAuthFormHTML();
  Object.keys(keep).forEach(id=>{ if($(id)) $(id).value=keep[id]; });
 }
}
function renderRiderRoot(){
 const root=$('riderRoot'); if(!root)return;
 if(!riderBuilt){ root.innerHTML=riderRootHTML(); riderBuilt=true; }
 renderRiderAuthState();
 if(!currentRider()) return; // ยังไม่ล็อกอิน — ไม่ต้องเรนเดอร์ห้องรับงาน/งานของฉัน
 const params=new URLSearchParams(location.search);
 renderRiderInvite(params.get('order'));
 renderRiderJobRoom();
 renderRiderMyJob();
 renderRiderCreditCard();
}

/* ======================= ROLE / ROUTER ======================= */
function setRole(role){
 document.querySelectorAll('.role').forEach(b=>b.classList.toggle('active',b.dataset.role===role));
 ['admin','customer','rider'].forEach(r=>$(r+'View').classList.toggle('hidden',r!==role));
 if(role==='admin'){ $('heroTitle').textContent='จัดการงานรับหิ้ว';$('heroText').textContent='ดูงานทั้งหมดแบบเรียลไทม์ กรอง ค้นหา และดูรายละเอียดทุกจุดรับ-ส่ง'}
 if(role==='customer'){ $('heroTitle').textContent='ให้เราช่วยหิ้วให้คุณ';$('heroText').textContent='เช็คราคา เพิ่มจุดรับ-ส่งได้หลายจุด แนบรูป แล้วส่งงานได้ทันที'}
 if(role==='rider'){ $('heroTitle').textContent='ห้องรับงานไรเดอร์';$('heroText').textContent='เห็นงานใหม่ทันที กดรับงาน อัปเดตสถานะ และแชทกับลูกค้าได้ในที่เดียว'}
 if($('notifPanel')) $('notifPanel').classList.add('hidden');
 renderBellBadge();
}
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>setRole(b.dataset.role));

/* ======================= BOOT ======================= */
function boot(){
 // เฟส 2: ไม่ auto-seed บัญชีแอดมินจาก localStorage อีกต่อไป (ดูคอมเมนต์ที่ ensureDefaultAdminSeeded ด้านบน)
 // บัญชีแอดมินเริ่มต้น admin/admin1234 ถูกสร้างไว้ในฝั่ง Supabase ล่วงหน้าแล้ว
 $('adminRoot').innerHTML=adminRootHTML();
 addStopTo('adminStops',{pickup:'ร้าน A'}); addStopTo('adminStops',{pickup:'ร้าน B'});
 $('rateBase').value=DB.rates.base; $('ratePerStop').value=DB.rates.perStop; $('rateKm').value=DB.rates.km; $('rateCommission').value=DB.rates.commission; $('rateNote').value=DB.rates.note;
 renderAdminEstimate(); renderAdminList();
 renderAdminAuthState(); // ต้อง login แอดมินก่อนถึงจะเห็นเนื้อหาแอดมินจริง

 renderCustomerRoot();
 renderRiderRoot();

 // หมายเหตุ (เฟส 3): ไม่เรียก ensureNotifBaseline() ตรงนี้อีกต่อไป เพราะ DB.orders ยังว่างเปล่า (ยังไม่ทัน sync
 // จริงจาก Supabase) — ensureNotifBaseline() ถูกเรียกจาก activateRoleSync() แทน หลังโหลดข้อมูลจริงเสร็จแล้วเท่านั้น
 checkForNotifiableEvents(); // seed baseline ต่อออเดอร์/แชทที่กำลังดูอยู่ตอนเปิดหน้า (ทำงานได้แม้ DB.orders ยังว่าง)
 renderSoundButton();
 renderBellBadge();

 dbListeners.push(()=>renderAdminList());
 dbListeners.push(()=>renderCustomerRoot());
 dbListeners.push(()=>{renderRiderJobRoom();renderRiderMyJob();});
 dbListeners.push(()=>checkForNotifiableEvents());
 dbListeners.push(()=>{renderRiderCreditCard();renderAdminCreditList();}); // เครดิต/เครดิตการชำระเงินอัปเดตสดผ่าน realtime เดียวกับออเดอร์

 // เมื่อโปรไฟล์ไรเดอร์เปลี่ยน (ชื่อ/รูป) จากแท็บใดก็ตาม ต้องอัปเดตทุกหน้าที่แสดงชื่อ/รูปไรเดอร์ทันที
 riderStoreListeners.push(()=>{ renderAdminList(); renderCustomerRoot(); renderRiderRoot(); if(adminTab==='users') renderAdminUsersList(); });
 customerStoreListeners.push(()=>{ renderCustomerRoot(); if(adminTab==='users') renderAdminUsersList(); });
 adminStoreListeners.push(()=>{ if(adminTab==='users') renderAdminUsersList(); });

 notifListeners.push(()=>{
  renderBellBadge();
  const panel=$('notifPanel');
  if(panel&&!panel.classList.contains('hidden')) renderNotifPanel();
 });

 const params=new URLSearchParams(location.search);
 const initial=params.get('view')||'admin';
 setRole(['admin','customer','rider'].includes(initial)?initial:'admin');

 // เฟส 3: ถ้ามี session ค้างอยู่แล้ว (เปิดหน้าเว็บซ้ำโดยไม่ต้อง login ใหม่) ให้เชื่อม sync+realtime ทันที
 // ต่อ role นั้น ๆ โดยไม่ต้องรอกด login/สมัครอีกครั้ง
 if(currentCustomer()) activateRoleSync('customer');
 if(currentRider()) activateRoleSync('rider');
 if(currentAdmin()) activateRoleSync('admin');

 if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
 }
}
boot();
</script>
</body></html>
